  /api/v1/deliveries/{deliveryRunId}/replay:
    parameters:
      - name: deliveryRunId
        in: path
        required: true
        description: "Zustelllauf-ID (UUID) der aufgegebenen Zustellung."
        schema:
          type: string
          format: uuid
    post:
      operationId: replayDelivery
      tags: [Zustellung]
      summary: Tote Zustellung erneut auslösen
      description: >-
        Löst eine aufgegebene Zustellung erneut aus (FR-024). Es entsteht ein
        **neuer Zustelllauf** mit **neuer Zustelllauf-ID**, aber **derselben
        Ereignis-ID**; die Versuchsanzahl beginnt wieder bei 1. Der
        ursprüngliche Datensatz bleibt im Protokoll **unverändert** erhalten
        (Historie).

        **Einmal:** Ein aufgegebener Zustelllauf kann **einmal** replayed
        werden — die Datenbank erzwingt das (UNIQUE über die Replay-Beziehung,
        ADR-006). Ein **weiterer** Replay desselben Laufs antwortet mit
        **HTTP 409** `delivery_state_conflict`; es entsteht **kein** weiterer
        Zustelllauf (AC-013-1, AC-013-5).

        **Berechtigung:** Ausschließlich der **Empfänger-Admin des betroffenen
        Endpunkts** ist berechtigt (D-15, bestätigt am 2026-10-21 mit F-03).
        `developer` und `service_admin` erhalten HTTP 403.

        **Reihenfolge der Prüfungen:** Zuerst wird der **Mandant** geprüft. Ein
        Zustelllauf eines **fremden** Mandanten ergibt **HTTP 404** — **auch**
        für `developer` und `service_admin` (D-02, ADR-015 §3, V-39). Die
        Rollenprüfung greift **erst danach**, also nur für einen Lauf im
        **eigenen** Mandanten: dort ergibt eine falsche Rolle **HTTP 403**
        (`forbidden`).

        **Pause:** Ist der Endpunkt pausiert, startet **kein** Versuch. Der
        Aufruf antwortet in diesem Fall mit **HTTP 409**
        `delivery_state_conflict` — es entsteht **kein** neuer Zustelllauf und
        der Vorgängerlauf bleibt unverändert (D-03, AC-013-4).
      x-ac-id:

openapi: 3.0.3

info:
  title: EchoBox — Ereignis-Briefkasten mit Zustellgarantie
  version: 1.0.0
  description: |
    # EchoBox — Ereignis-Briefkasten mit Zustellgarantie

    EchoBox nimmt Ereignisse entgegen und liefert sie per HTTP an registrierte
    Empfänger-URLs weiter (Webhook-Zustell-Wrapper). Kein Message-Broker, kein
    Event-Store. Der Dienst hält nur, was er für die Zustellung braucht, und das
    so kurz wie möglich.

    ## Vertrag und Versionierung

    Dieser Vertrag ist die **Single Source of Truth**. Er wird **nach Schritt 4
    (Grill-Me-Stresstest) eingefroren**; bis dahin ist er ein stabiler Entwurf.
    Eine Änderung am Signaturverfahren, an Header-Namen oder am Ablehnungssignal
    (Abschnitt `x-delivery-protocol`) ist ein **breaking change** und braucht
    eine neue Hauptversion (`/api/v2`).

    ## Mandant

    Der Mandant stammt **ausschließlich aus der Identität** (JWT-Claim
    `organisation_id`) und ist **kein** Filter- oder Request-Parameter (D-01).
    Ein mitgelieferter Mandantenparameter wird mit **HTTP 422** abgelehnt.
    Fremde Ressourcen werden mit **HTTP 404** beantwortet, damit die Existenz
    fremder Objekte nicht preisgegeben wird (D-02). Das gilt für **alle**
    Rollen — **auch** für `service_admin`: der **Einzelabruf** einer Ressource
    eines fremden Mandanten endet mit 404 (V-27).

    **Reihenfolge der Prüfungen: erst der Mandant, dann die Rolle.** Gehört
    die adressierte Ressource **nicht** dem Mandanten aus der Identität, endet
    der Aufruf mit **HTTP 404** — **auch** für `developer` und `service_admin`
    (D-02, ADR-015 §3, V-39). Die Rollenprüfung greift **erst danach**, also
    **innerhalb des eigenen Mandanten**: dort ist die Rolle falsch ⇒
    **HTTP 403** (F-03, ADR-015 §3). Für den Replay heißt das: ein Zustelllauf
    eines **fremden** Mandanten ergibt **404** (auch für `developer` und
    `service_admin`), ein Zustelllauf des **eigenen** Mandanten **ohne** die
    Rolle `receiver_admin` ergibt **403**.

    **`organisation_id` in den Antworten:** Das Feld ist **immer** gefüllt und
    benennt den **besitzenden Mandanten** der Ressource — im eigenen Mandanten
    den eigenen, in den mandantenübergreifenden Antworten den Mandanten, zu dem
    die Ressource gehört. Es ist **kein** Sonderfeld einer Rolle und **kein**
    Filter (D-01).

    ## Rollen

    Die Rollenmatrix ist **vollständig** — sie nennt **jede** Rolle mit
    **jedem** Recht (ADR-015 §1):

    | Rolle | Endpunkte verwalten | Ereignisse einliefern | Secret rotieren | Zustellprotokoll lesen | Tote Zustellung erneut auslösen | Totenliste mandantenübergreifend | Kennzahlen | Aufbewahrung erzwingen |
    |---|---|---|---|---|---|---|---|---|
    | `developer` | — | **ja** | — | **ja** (eigener Mandant) | **nein** (F-03) | **nein** | eigener Mandant | **nein** |
    | `receiver_admin` | **ja** (eigener Mandant) | — | **ja** | **ja** (eigener Mandant) | **ja** (eigener Endpunkt) | **nein** | eigener Mandant | **nein** |
    | `service_admin` | **ja** — **nur im eigenen Mandanten** (wie `receiver_admin`); die mandantenübergreifende **Sicht** gilt **nur** für die **drei** Listen-/Betriebsoperationen (E-01, V-27): der **Einzelabruf** einer fremden Ressource ⇒ **404** | **nein** (FR-010) | — | **ja** (eigener Mandant) | **nein** (F-03) | **ja** | **ja** (eigener Mandant) | **ja** |

    **Die mandantenübergreifende Sicht** des `service_admin` gilt **nur** für die
    **drei** Listen-/Betriebsoperationen: Endpunktliste, Totenliste und
    Aufbewahrung (E-01). Ein **vierter** mandantenübergreifender Leseweg wird
    **nicht** gebaut; ein **Schreibzugriff** mandantenübergreifend gibt es
    **nicht**.

    **Der Einzelabruf einer Ressource eines fremden Mandanten ergibt HTTP 404 —
    auch für `service_admin`** (D-02, V-27).

    **Reihenfolge der Prüfungen: erst der Mandant, dann die Rolle** (V-39).
    Eine Ressource eines **fremden** Mandanten ergibt **404** — für **alle**
    Rollen; die Rolle wird **erst** innerhalb des **eigenen** Mandanten geprüft
    und ergibt dort **403** (ADR-015 §3).

    ## Fehlersemantik

    Alle Fehlerantworten nutzen **ein** Schema (`Problem`, RFC-7807-artig) mit
    dem maschinenlesbaren Feld `code`:

    | Status | `code` | Wann |
    |---|---|---|
    | 400 | `malformed_request` | **syntaktisch** fehlerhafte Anfrage (kein gültiges JSON) |
    | 401 | `unauthorized` | kein oder ungültiges Token |
    | 403 | `forbidden` | angemeldet, die Ressource gehört dem **eigenen** Mandanten, aber die Rolle darf es nicht |
    | 404 | `not_found` | Ressource existiert nicht **oder** gehört einem **fremden** Mandanten (für diesen Mandanten nicht sichtbar) |
    | 409 | `idempotency_conflict` | gleicher Idempotenzschlüssel mit abweichender Nutzlast (D-05) |
    | 409 | `delivery_state_conflict` | Zustelllauf ist nicht replaybar (nicht aufgegeben, Endpunkt pausiert oder bereits replayed) |
    | 413 | `payload_too_large` | Nutzlast > 1.048.576 Byte (NFR-001, D-13) |
    | 422 | `validation_failed` | **semantisch** ungültig: das Feld verletzt das Schema des Request-Bodys (unbekanntes Feld, falscher Typ, fehlendes Pflichtfeld) |
    | 422 | `tenant_parameter_rejected` | ein Mandantenparameter (`organisation_id`) wurde im Body, im Query oder im Header mitgeschickt (D-01) |
    | 429 | `rate_limit_exceeded` | API-seitiges Anfragelimit (nicht das Endpunkt-Limit aus FR-033) |
    | 500 | `internal_error` | unerwarteter Fehler — kein Stacktrace, kein internes Detail |
    | 503 | `service_unavailable` | Dienst nicht bereit (Readiness) — der nicht bereite Zustand kommt als **503 mit `Problem`**, nicht als Readiness-Bericht (ADR-015 §4) |

    **Die Grenze zwischen 400 und 422:** 400 bedeutet *syntaktisch* fehlerhaft
    (der Body ist kein gültiges JSON). **Jede** Abweichung vom **Schema** des
    Request-Bodys — unbekanntes Feld, falscher Typ, fehlendes Pflichtfeld —
    ist **422** `validation_failed` mit einem `violations`-Eintrag; sie wird
    **nicht** stillschweigend ignoriert. Ein mitgelieferter **Mandantenparameter**
    ist 422 `tenant_parameter_rejected` (D-01).

    **Die Grenze zwischen 403 und 404: erst der Mandant, dann die Rolle.** Eine
    Ressource eines **fremden** Mandanten ergibt **404** — für **alle** Rollen,
    auch für `developer` und `service_admin`; die Existenz fremder Objekte wird
    nicht preisgegeben (D-02). Die Rolle wird **erst** geprüft, wenn die
    Ressource dem **eigenen** Mandanten gehört — dann ergibt die falsche Rolle
    **403** (ADR-015 §3, V-39).

    ## Pagination

    Alle Listen sind **cursor-basiert** (`limit` + `cursor`, Antwort unter
    `page.next_cursor` / `page.has_more`). `total` wird bewusst **nicht**
    ausgewiesen: eine Zählung über die verschlüsselten, zeitlich geordneten
    Zustelltabellen wäre teuer und im Protokoll nicht nötig.

    **Cursor und Sortierung.** Der Cursor ist **opak** (HMAC-signiert) und
    trägt den **Sortierschlüssel** der Liste; die Position hängt am Schlüssel,
    nicht an einem Offset — zwischen zwei Seiten geänderte Datensätze werden
    deshalb **weder doppelt** noch **übersprungen**. Sortiert wird absteigend
    nach Zeitstempel, mit der **UUID als Tie-Breaker** in derselben Richtung;
    die Reihenfolge ist damit **total** — zwei Datensätze mit gleichem
    Zeitstempel wechseln ihre Plätze **nie**, und zwei Seiten teilen sich keine
    Randzeile. Ändert sich der Sortierschlüssel eines Datensatzes, rutscht er in
    der Reihenfolge nach vorn und erscheint erst wieder in einer Liste ab
    Seite 1.

    **Mandantenübergreifende Listen.** Für den `service_admin` laufen
    `GET /api/v1/endpoints` und `GET /api/v1/dead-deliveries` in **einer**
    globalen Reihenfolge über **alle** Mandanten: der Cursor läuft **über die
    Mandantgrenzen hinweg**, es gibt **keine** Seite je Mandant, und eine Seite
    kann Datensätze verschiedener Mandanten enthalten. Die Sortierschlüssel
    sind dort `updated_at` (Endpunktliste) und `created_at` (Totenliste).
    `organisation_id` ist **immer** gefüllt — es benennt den **besitzenden
    Mandanten** der Ressource; in diesen mandantenübergreifenden Antworten
    steht damit der Mandant, zu dem der Datensatz gehört. Die Liste liefert
    damit auch **IDs fremder Mandanten** — der **Detailabruf** einer solchen ID
    endet mit **HTTP 404**, auch für den `service_admin` (D-02, V-27). Ein
    Cursor gilt nur für **dieselbe** Operation **mit denselben Filtern**; bei
    geänderten Filtern beginnt die Liste neu.

    `POST /api/v1/retention/enforcement` ist **nicht** paginiert: die Antwort
    enthält **einen** Eintrag je Mandant in `tenants[]` — ohne Cursor, ohne
    `page`.

    ## Suchbarkeit

    Die Protokollsuche läuft **ausschließlich über Metadaten** (Ereignis-ID,
    Ereignistyp, Endpunkt, Status, Zeitraum). Eine Suche nach Nutzlastinhalt
    existiert **nicht** — das wäre mit der Verschlüsselung im Ruhezustand
    unvereinbar (FR-012, D-11).

    **Der Zeitraumfilter ist je Liste benannt:** im **Zustellprotokoll**
    (`GET /api/v1/deliveries`) bezieht sich `from`/`to` auf den
    **Anlegezeitpunkt** des Zustelllaufs (`created_at` — der Sortierschlüssel,
    ADR-017 §4); in der **Totenliste** (`GET /api/v1/dead-deliveries`) auf den
    **Aufgabezeitpunkt** (`abandoned_at`). Beide Aussagen stehen
    **nebeneinander** und sind je Liste benannt (V-40).

    ## Vorgabewerte (bestätigt am 2026-10-21, Gate 1)

    Diese Werte sind **Vorgaben der Betriebskonfiguration**, keine harten
    API-Grenzwerte: der Vertrag nennt sie, damit ein Aufrufer weiß, womit er
    rechnen muss — geändert wird jeder Wert **über die Konfiguration der
    Umgebung**, nicht über diesen Vertrag und nicht über Code.

    | ID | Gegenstand | Vorgabewert | Steuerung |
    |---|---|---|---|
    | **F-01** | Rate-Limit je Endpunkt | **60 Versuche je Endpunkt und Minute**, Strategie `delay` (verschieben) | `echobox.delivery.rate-limit.*`, je Endpunkt überschreibbar |
    | **F-02** | Aufbewahrung | **30 Tage** — getrennt für Ereignisse und für Zustellprotokolle, Fristbeginn = **letzter Versuch** | `echobox.retention.*`, je Mandant überschreibbar |
    | **F-03** | Replay-Berechtigung | **nur** der Empfänger-Admin des betroffenen Endpunkts; `developer` und `service_admin` ⇒ **403** — ein Zustelllauf **fremder** Mandanten ⇒ **404** (V-39) | Rollenprüfung (ADR-015) |
    | **F-04** | Versuche und Backoff | **8 Versuche**, Basis **1 Minute**, Verdopplung (×2), Deckel **60 Minuten**, Streuung **± 20 %** | `echobox.delivery.backoff.*`, `echobox.delivery.max-attempts` |

    Auswirkung auf die Sichtbarkeit: `EndpointMetrics.rate_limit.limit` weist den
    **wirksamen** Grenzwert aus, `DeliveryRun.max_attempts` die **wirksame**
    Versuchsgrenze, `RetentionEnforcementResponse` die **beiden** angewandten
    Fristen. `max_attempts` und die Aufbewahrungsfristen bleiben nullable —
    `null` bedeutet dort „keine Grenze bzw. keine Frist gesetzt".
    Für das **Endpunkt-Limit** gilt eine **zweistufige** Auskunft:
    `rate_limit.limit` ist **immer** der wirksame Grenzwert (Vorgabe **60**) und
    `rate_limit.limited` sagt, ob die Begrenzung **abgeschaltet** ist
    (`limited: false` ⇒ `limit: 0`).


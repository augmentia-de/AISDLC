      x-stories: [US-026]
      tags: ["Notifications"]
      summary: "Einen Zustellversuch lesen"
      description: |
        Liefert einen Zustellversuch der Warn-E-Mail. Ein Versuch zu einem Prompt einer
        fremden Organisation ist nicht existent → `404`.

        **Mandant:** nur Zustellversuche der eigenen Organisation.
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "SECURITY_ADMIN, ORG_ADMIN"
      responses:
        "200":
          description: "Der Zustellversuch."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDelivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /notifications/{notificationId}/retry:
    parameters:
      - name: "notificationId"
        in: "path"
        description: "ID des Zustellversuchs."
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: retryNotificationDelivery
      x-stories: [US-027]
      tags: ["Notifications"]
      summary: "Zustellversuch erneut auslösen (Totmannschaltung)"
      description: |
        Löst einen fehlgeschlagenen Zustellversuch erneut aus — insbesondere einen Eintrag in
        der Totmannschaltung (FR-052, AC-027-2). Der Eintrag wechselt von `DEAD_LETTER` nach
        `PENDING` und wird vom Zustell-Worker erneut bearbeitet.

        **Zustandsbedingung:** Zulässig ist `FAILED` oder `DEAD_LETTER`; für `SENT` oder
        `PENDING` antwortet der Dienst mit `409 Conflict`.

        **Nebenwirkungen:** Neuer Zustelljob, Audit-Eintrag `NOTIFICATION_RETRY_REQUESTED`.

        **Unabhängigkeit:** Der Prüfstatus der Version bleibt vom Zustellerfolg unabhängig
        (FR-052, AC-027-3).
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "SECURITY_ADMIN, ORG_ADMIN"
      responses:
        "202":
          description: "Zustellversuch erneut eingereiht."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDelivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------------
  # Privacy
  # ---------------------------------------------------------------------------------
  /privacy-notice:
    get:
      operationId: getPrivacyNotice
      x-stories: [US-030]
      tags: ["Privacy"]
      summary: "Datenschutzhinweis (DE/EN) lesen"
      description: |
        Liefert den aktuellen Datenschutzhinweis in Deutsch **und** Englisch mit Zweck,
        Rechtsgrundlage, Aufbewahrungsfristen und Betroffenenrechten (FR-064, DP-001,
        DP-006, AC-030-1).

        Der Endpunkt ist **öffentlich** — der Hinweis muss auch vor der Anmeldung erreichbar
        sein. Er enthält keine personenbezogenen Daten.

        **Versionierung:** `version` und `effectiveFrom` kennzeichnen die Fassung. Die
        vorherigen Fassungen bleiben archiviert (siehe `/privacy-notice/versions`).
      security: []
      x-tenant-scope: "none (öffentlicher Informationstext)"
      x-required-role: "none"
      responses:
        "200":
          description: "Der Datenschutzhinweis in beiden Sprachen."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyNotice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /privacy-notice/versions:
    get:
      operationId: listPrivacyNoticeVersions
      x-stories: [US-030]
      tags: ["Privacy"]
      summary: "Archivierte Fassungen des Datenschutzhinweises"
      description: |
        Listet die archivierten Fassungen des Datenschutzhinweises mit Versionskennung und
        Gültigkeitsbeginn — Nachweis der Historie (AC-030-2). Der Endpunkt ist öffentlich,
        weil der Text keine personenbezogenen Daten enthält.
      security: []
      x-tenant-scope: "none (öffentlicher Informationstext)"
      x-required-role: "none"
      responses:
        "200":
          description: "Die archivierten Fassungen."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyNoticeVersionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------------
  # Operations
  # ---------------------------------------------------------------------------------
  /health:
    get:
      operationId: getHealth
      x-stories: [US-032, US-033, US-034]
      tags: ["Operations"]
      summary: "Health-Check"
      description: |
        Liveness-/Readiness-Status des Dienstes inklusive der Zustände der abhängigen
        Komponenten (Datenbank, Warteschlange, Provider-Erreichbarkeit, SMTP).

        **Wichtig:** Der Health-Status verrät **keinen** fachlichen Inhalt. Der Provider-Status
        ist ein Betriebs-Gate, kein Mandantenbezug. Der Endpunkt ist öffentlich, damit der
        Plattform-Betrieb ihn ohne fachliche Rechte pollen kann.

        **Nebenwirkungen:** keine.
      security: []
      x-tenant-scope: "none (keine Fachdaten)"
      x-required-role: "none"
      responses:
        "200":
          description: "Der Dienst ist gesund."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "Der Dienst ist nicht bereit — eine Pflichtkomponente ist nicht verfügbar."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ops/metrics:
    get:
      operationId: getMetrics
      x-stories: [US-032]
      tags: ["Operations"]
      summary: "Betriebsmetriken lesen"
      description: |
        Liefert die aggregierten Betriebsmetriken: Warteschlangentiefe, Scan-Dauer
        (p50/p95/p99), Fehlerquote, Zustellquote und Verteilung der Scan-Status (FR-072,
        NFR-014, AC-032-1).

        **Keine Mandantenbezüge:** Die Metriken sind organisationsübergreifend aggregiert. Es
        werden **keine** organisationsbezogenen Werte, keine Nutzerkennungen und keine
        Inhalte ausgeliefert. Der Endpunkt ist öffentlich, wird aber in der Produktion nur
        im internen Netz freigeschaltet.

        **Nebenwirkungen:** keine.
      security: []
      x-tenant-scope: "none (aggregiert, ohne Mandantenbezug)"
      x-required-role: "none"
      responses:
        "200":
          description: "Der Metrik-Schnappschuss."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

# =====================================================================================
# COMPONENTS
# =====================================================================================  # ---------------------------------------------------------------------------------
  # Aufbewahrung und Qualitätsnachweis (Betrieb)
  # ---------------------------------------------------------------------------------
  /ops/retention:
    get:
      operationId: listRetentionRuns
      x-stories: [US-028]
      tags: ["Operations"]
      summary: "Läufe des Aufbewahrungsjobs lesen"
      description: |
        Liefert die Läufe des Aufbewahrungsjobs mit Zeitfenster, Status und den
        **gelöschten Mengen je Objektklasse** (FR-060, AC-028-1, US-028).

        **Idempotenz:** Ein zweiter Lauf löscht nichts und meldet `0` gelöschte
        Datensätze, ohne Fehler (AC-028-2).

        **Fehlerverhalten:** Schlägt ein Löschvorgang fehl, endet der Lauf mit
        `status: FAILED`, wird erneut versucht und löst einen Alarm aus; es bleibt kein
        teilweiser oder inkonsistenter Zustand zurück (AC-028-3).

        **Mandant:** Die Läufe sind Betriebsobjekte. Die gelöschten Mengen sind
        aggregiert und enthalten **keine Inhalte** — deshalb kein Mandantenfilter.
      security:
        - bearerAuth: []
      x-tenant-scope: "none (Betriebsobjekt ohne Fachdatenbezug)"
      x-required-role: "ORG_ADMIN"
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: "Seite der Retention-Läufe."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedRetentionRuns"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: triggerRetentionRun
      x-stories: [US-028]
      tags: ["Operations"]
      summary: "Aufbewahrungsjob manuell auslösen"
      description: |
        Löst einen Lauf des Aufbewahrungsjobs sofort aus (FR-060, US-028). Der reguläre
        Takt bleibt täglich 03:00 UTC; der manuelle Lauf dient Nachweis, Tests und
        Betrieb (AC-028-1).

        **Idempotenz:** Der Lauf ist idempotent — wiederholte Läufe löschen nur, was
        älter als die jeweilige Frist ist, und melden `0` (AC-028-2).

        **Wirkung:** Gelöscht werden ausschließlich Telemetrie (> 90 Tage) und
        KI-Rohpayloads (> 24 h). Prompts und Versionen bleiben bestehen (A-03, F5).

        **Seiteneffekte:** Der Lauf schreibt eine Zusammenfassung der Löschmengen in die
        Logs und in den Audit-Trail (`RETENTION_RUN`) — ohne Inhalt (SEC-010).
      security:
        - bearerAuth: []
      x-tenant-scope: "none (Betriebsobjekt ohne Fachdatenbezug)"
      x-required-role: "ORG_ADMIN"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerRetentionRequest"
            example:
              dryRun: false
      responses:
        "202":
          description: "Retention-Lauf eingereiht."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /ops/quality-gate:
    get:
      operationId: getQualityGateAttestation
      x-stories: [US-031]
      tags: ["Operations"]
      summary: "Zuletzt gemeldeten Qualitätsnachweis lesen"
      description: |
        Liefert den zuletzt von der CI-Pipeline gemeldeten Qualitätsnachweis: Commit,
        Pipeline, Schwelle, gemessene Line-Coverage für Backend und Frontend sowie das
        Ergebnis (FR-073, US-031).

        **Zweck:** Der Nachweis macht das harte Coverage-Gate (F9, NFR-009) im Betrieb
        sichtbar und prüfbar. Er ersetzt **nicht** das Gate in der CI — dort schlägt
        der Build weiterhin fehl (AC-031-2).

        **Mandant:** Betriebsobjekt ohne Fachdatenbezug und ohne Mandantenbezug.
      security:
        - bearerAuth: []
      x-tenant-scope: "none (Betriebsobjekt ohne Fachdatenbezug)"
      x-required-role: "SECURITY_ADMIN, ORG_ADMIN"
      responses:
        "200":
          description: "Zuletzt gemeldeter Qualitätsnachweis."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityGateAttestation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: reportQualityGateAttestation
      x-stories: [US-031, US-034]
      tags: ["Operations"]
      summary: "Qualitätsnachweis der CI-Pipeline einreichen"
      description: |
        Nimmt den Qualitätsnachweis einer CI-Pipeline entgegen (FR-073, US-031).

        **Autorisierung:** Nicht durch einen Benutzer-Token, sondern durch ein
        **CI-Service-Token** mit dem Scope `ci:quality-gate`. Es ist kein
        Benutzerkonto und hat **keinen** Mandantenbezug; der Endpunkt nimmt
        ausschließlich Build-Metadaten ohne Fachdaten entgegen. Ein Aufruf mit einem
        Benutzer-Token ohne diesen Scope liefert `403`.

        **Validierung:** `commitSha` muss der SHA des Builds entsprechen, `threshold`
        muss 80 betragen (F9), `backendCoverage` und `frontendCoverage` liegen
        zwischen 0 und 100. Ein `status: FAILED` wird **protokolliert, aber nicht
        abgelehnt** — der Nachweis soll auch Fehlschläge dokumentieren.

        **Idempotenz:** Der Nachweis ist je Commit-SHA eindeutig; ein erneutes
        Einreichen derselben SHA ersetzt den Nachweis (Upsert).
      security:
        - bearerAuth: []
      x-tenant-scope: "none (Betriebsobjekt ohne Fachdatenbezug)"
      x-required-role: "CI-Service-Token (Scope ci:quality-gate)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityGateReportRequest"
            example:
              commitSha: "9f2c1a7b4d5e6f708192a3b4c5d6e7f8091a2b3c"
              pipelineUrl: "https://github.com/promptguard/promptguard/actions/runs/4711"
              threshold: 80
              backendCoverage: 84.6
              frontendCoverage: 81.2
              status: "PASSED"
      responses:
        "200":
          description: "Nachweis gespeichert (Upsert je Commit-SHA)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityGateAttestation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"


components:

  # ---------------------------------------------------------------------------------
  # Security schemes
  # ---------------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: "bearer"
      bearerFormat: "JWT"
      description: |
        JWT-Authentifizierung (SEC-001, FR-001). Der Access-Token trägt die Claims `sub`,
        `organisation_id`, `role` und `exp`; der Signaturschlüssel wird ausschließlich aus
        der Umgebung gelesen. **Jeder** Token ist auf genau eine `organisation_id`
        beschränkt — der Token selbst ist die Mandantengrenze.

        Der Refresh-Token wird als `HttpOnly; SameSite=Strict; Secure` Cookie gesetzt und
        **nie** im `localStorage` gehalten.

  # ---------------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------------
  parameters:
    PageParam:
      name: "page"
      in: "query"
      description: "Seitenzahl, 1-basiert."
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    SizeParam:
      name: "size"
      in: "query"
      description: |
        Seitengröße. Default 50, Maximum 200. Ein Wert über 200 wird mit **`400`** abgewiesen
        und das Maximum genannt (AC-015-3) — nicht mit `422`.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      example: 50

    PromptIdPathParam:
      name: "promptId"
      in: "path"
      description: "ID des Prompts. Fremde IDs sind nicht existent → `404`."
      required: true
      schema:
        type: string
        format: uuid

    VersionIdPathParam:
      name: "versionId"
      in: "path"
      description: "ID der Prompt-Version. Fremde IDs sind nicht existent → `404`."
      required: true
      schema:
        type: string
        format: uuid

    CategoryIdPathParam:
      name: "categoryId"
      in: "path"
      description: "ID der Kategorie. Fremde IDs sind nicht existent → `404`."
      required: true
      schema:
        type: string
        format: uuid

    UserIdPathParam:
      name: "userId"
      in: "path"
      description: "ID des Nutzers."
      required: true
      schema:
        type: string
        format: uuid

    InvitationIdPathParam:
      name: "invitationId"
      in: "path"
      description: "ID der Einladung. Fremde IDs sind nicht existent → `404`."
      required: true
      schema:
        type: string
        format: uuid

  # ---------------------------------------------------------------------------------
  # Responses
  # ---------------------------------------------------------------------------------
  responses:
    BadRequest:
      description: |
        Die Anfrage ist syntaktisch fehlerhaft (z. B. `size` über 200, ungültiges
        Query-Format). Die Meldung nennt die konkrete Grenze.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://api.promptguard.example/errors/invalid-request"
            title: "Invalid request"
            status: 400
            detail: "The page size must not exceed 200. Requested: 5000."
            instance: "/api/v1/prompts"
            correlationId: "01J8Z6M2QK9Y3F7V0C4T5N6P7R"
            errors:
              - field: "size"
                code: "exceeds_maximum"
                message: "Maximum page size is 200."

    Unauthorized:
      description: |
        Kein gültiges Access-Token, Token abgelaufen oder Session-Kette invalidiert. Die
        Antwort enthält **keine** Information darüber, ob ein Konto existiert.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://api.promptguard.example/errors/unauthorized"
            title: "Unauthorized"
            status: 401
            detail: "The access token is missing, expired or invalid. Use the refresh endpoint to obtain a new token pair."
            instance: "/api/v1/prompts"
            correlationId: "01J8Z6M2QK9Y3F7V0C4T5N6P7R"

    Forbidden:
      description: |
        Der Nutzer ist angemeldet, besitzt aber nicht die erforderliche Rolle oder die
        Operation ist in der eigenen Organisation nicht zulässig. Die Antwort enthält
        **keinen** Existenzhinweis auf fremde Ressourcen.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://api.promptguard.example/errors/forbidden"
            title: "Forbidden"
            status: 403
            detail: "The role SECURITY_ADMIN is required for this operation. Ask an organisation admin to grant it."
            instance: "/api/v1/prompt-versions/2b1c3d4e-5f60-7182-93a4-b5c6d7e8f90/waiver"
            correlationId: "01J8Z6M2QK9Y3F7V0C4T5N6P7R"

    NotFound:
      description: |
        Die Ressource existiert nicht **oder** ist für diese Organisation nicht sichtbar. Es
        wird **keine** Existenzinformation preisgegeben: kein Titel, kein Eigentümer, kein
        Prüfstatus, keine Anzahl (FR-023, SEC-002).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://api.promptguard.example/errors/not-found"
            title: "Not found"
            status: 404
            detail: "No resource with this id exists in your organisation."
            instance: "/api/v1/prompts/1f2e3d4c-5b6a-7988-9a0b-1c2d3e4f5a6b"
            correlationId: "01J8Z6M2QK9Y3F7V0C4T5N6P7R"

    Conflict:
      description: |
        Die Anfrage kollidiert mit dem aktuellen Zustand (E-Mail bereits vergeben, Kategorie
        referenziert, Version nicht in `FAILED`, letzte `ORG_ADMIN`-Rolle, …). Die Meldung
        nennt den aktuellen Zustand und die zulässige nächste Handlung.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://api.promptguard.example/errors/conflict"
            title: "Conflict"
            status: 409
            detail: "The version is in status APPROVED. A rescan is only possible for versions in status FAILED."
            instance: "/api/v1/prompt-versions/2b1c3d4e-5f60-7182-93a4-b5c6d7e8f90/rescan"
            correlationId: "01J8Z6M2QK9Y3F7V0C4T5N6P7R"

    ValidationFailed:
      description: |
        Die Anfrage ist semantisch ungültig. `errors` benennt **jedes** betroffene Feld mit
        Feldname, stabilem Code und Meldung (AC-007-2, AC-034-3).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://api.promptguard.example/errors/validation-failed"
            title: "Validation failed"
            status: 422
            detail: "The field 'title' must not be empty. Allowed length: 1-200 characters."
            instance: "/api/v1/prompts"
            correlationId: "01J8Z6M2QK9Y3F7V0C4T5N6P7R"
            errors:
              - field: "title"
                code: "must_not_be_empty"
                message: "The title must not be empty."
              - field: "tags"
                code: "exceeds_maximum_items"
                message: "At most 10 tags are allowed per prompt."

    RateLimited:
      description: |
        Das Rate-Limit wurde überschritten (Login: 10 Versuche/Minute je IP mit Sperre;
        API: 1 000/Minute je Nutzer). `Retry-After` nennt die Wartezeit in Sekunden.
      headers:
        Retry-After:
          description: "Wartezeit in Sekunden bis zum nächsten erlaubten Versuch."
          schema:
            type: integer
            minimum: 0
          example: 42
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://api.promptguard.example/errors/rate-limited"
            title: "Rate limit exceeded"
            status: 429
            detail: "Too many requests. Try again in 42 seconds."
            instance: "/api/v1/auth/login"
            correlationId: "01J8Z6M2QK9Y3F7V0C4T5N6P7R"

    InternalError:
      description: |
        Unerwarteter Fehler. Die Antwort enthält eine generische Meldung und eine
        Korrelations-ID — **keinen** Stacktrace und **keine** internen Details
        (SEC-009, AC-032-3).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "https://api.promptguard.example/errors/internal-error"
            title: "Internal server error"
            status: 500
            detail: "The request could not be processed. Quote the correlation id when reporting the problem."
            instance: "/api/v1/prompts"
            correlationId: "01J8Z6M2QK9Y3F7V0C4T5N6P7R"

  # ---------------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------------
  schemas:

    # -- Fehler -------------------------------------------------------------------
    Problem:
      type: object
      description: |
        Einheitliches Fehlerformat für **alle** Fehlerantworten (RFC 9457 Problem Details,
        erweitert um `correlationId` und `errors`).
      required: ["type", "title", "status", "detail", "instance"]
      properties:
        type:
          type: string
          format: uri
          description: "URI-Referenz auf die Fehlerklasse."
          example: "https://api.promptguard.example/errors/validation-failed"
        title:
          type: string
          description: "Kurze, stabile, englische Fehlerklasse — maschinenlesbar."
          example: "Validation failed"
        status:
          type: integer
          format: int32
          description: "HTTP-Statuscode; identisch mit dem Status der Antwort."
          example: 422
        detail:
          type: string
          description: |
            Was zu tun ist. Enthält **niemals** Prompt-Inhalt, Secrets, personenbezogene
            Daten oder interne Stacktraces.
          example: "The field 'title' must not be empty. Allowed length: 1-200 characters."
        instance:
          type: string
          description: "Pfad der Anfrage, die den Fehler ausgelöst hat."
          example: "/api/v1/prompts"
        correlationId:
          type: string
          description: "Korrelation-ID zur Zuordnung in den strukturierten Logs (AC-032-3)."
          example: "01J8Z6M2QK9Y3F7V0C4T5N6P7R"
        errors:
          type: array
          description: "Feldbezogene Fehler — nur bei `400` und `422` gefüllt."
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: ["field", "code"]
      properties:
        field:
          type: string
          description: "Name des betroffenen Feldes im Request-Body."
          example: "title"
        code:
          type: string
          description: "Stabiler, englischer Fehlercode."
          example: "must_not_be_empty"
        message:
          type: string
          description: "Meldung zum Feld."
          example: "The title must not be empty."

    # -- Enums --------------------------------------------------------------------
    Role:
      type: string
      description: "Organisationsgebundene Rolle (FR-004)."
      enum: ["DEVELOPER", "SECURITY_ADMIN", "ORG_ADMIN"]
      example: "DEVELOPER"

    UserStatus:
      type: string
      description: "Status des Nutzerkontos."
      enum: ["ACTIVE", "INVITED", "SUSPENDED", "ERASED"]
      example: "ACTIVE"

    ScanStatus:
      type: string
      description: |
        Prüfstatus einer Prompt-Version. Nur `APPROVED` und `WAIVED` gelten als freigegeben
        (Invariante I-3).
      enum: ["PENDING", "SCANNING", "APPROVED", "FLAGGED", "WAIVED", "FAILED"]
      example: "PENDING"

    ScanRunStatus:
      type: string
      description: "Status des Prüflaufs selbst."
      enum: ["QUEUED", "RUNNING", "COMPLETED", "FAILED", "DEAD_LETTER"]
      example: "COMPLETED"

    Severity:
      type: string
      description: "Schweregrad einer Fundstelle."
      enum: ["LOW", "MEDIUM", "HIGH", "CRITICAL"]
      example: "HIGH"

    FindingCategory:
      type: string
      description: "Erkennungskategorie (FR-033, FR-034, FR-035)."
      enum: ["PROMPT_INJECTION", "JAILBREAK", "SECRET", "PII"]
      example: "SECRET"

    InvitationStatus:
      type: string
      description: "Status einer Einladung."
      enum: ["PENDING", "ACCEPTED", "REVOKED", "EXPIRED"]
      example: "PENDING"

    NotificationStatus:
      type: string
      description: "Status eines Zustellversuchs der Warn-E-Mail."
      enum: ["PENDING", "SENT", "FAILED", "DEAD_LETTER"]
      example: "SENT"

    DuplicateMatch:
      type: object
      description: |
        Ähnlicher Prompt **derselben Organisation** (FR-032). Die Warnung ist beratend und
        blockiert das Anlegen nie.
      required: ["organisationId", "promptId", "title", "score"]
      properties:
        organisationId:
          type: string
          format: uuid
          description: "Mandant des Duplikathinweises — immer die eigene Organisation (ADR-002)."
        promptId:
          type: string
          format: uuid
          description: "ID des ähnlichen Prompts (Deep-Link-Ziel)."
        title:
          type: string
          description: "Titel des ähnlichen Prompts."
          example: "Refundierungsrichtlinie Support"
        versionNo:
          type: integer
          minimum: 1
          description: "Nummer der verglichenen Version."
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: "Ähnlichkeitsscore (Vektor-Ähnlichkeit, Default-Schwelle 0,90)."
          example: 0.94

    # -- Identity -----------------------------------------------------------------
    TokenPair:
      type: object
      description: "Ausgestelltes Token-Paar."
      required: ["accessToken", "tokenType", "expiresIn", "refreshToken"]
      properties:
        accessToken:
          type: string
          description: |
            Signiertes JWT mit den Claims `sub`, `organisation_id`, `role`, `exp`
            (FR-001). Kurzlebig, Default 15 Minuten.
        tokenType:
          type: string
          enum: ["Bearer"]
          example: "Bearer"
        expiresIn:
          type: integer
          description: "Gültigkeitsdauer des Access-Tokens in Sekunden."
          example: 900
        refreshToken:
          type: string
          description: |
            Refresh-Token (einmalig nutzbar, Rotation). Wird bevorzugt als `HttpOnly`-Cookie
            gesetzt; das Feld dient Nicht-Browser-Clients.
        refreshExpiresIn:
          type: integer
          description: "Gültigkeitsdauer des Refresh-Tokens in Sekunden (Default 30 Tage)."
          example: 2592000

    User:
      type: object
      description: "Nutzerkonto innerhalb einer Organisation."
      required: ["id", "email", "role", "status", "organisationId", "locale", "createdAt"]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        locale:
          type: string
          enum: [de, en]
          description: "Sprache der Oberfläche (deutsch ist Ziel). API-Fehler und Feldnamen bleiben englisch (NFR-018)."
          example: "de"
        displayName:
          type: string
          nullable: true
          description: "Anzeigename; optional."
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/UserStatus"
        organisationId:
          type: string
          format: uuid
          description: "Mandant des Kontos — 1 Nutzer : 1 Organisation (F2)."
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    Membership:
      type: object
      description: "Mitgliedschaft eines Nutzers in der Organisation."
      required: ["userId", "email", "role", "status", "organisationId", "createdAt"]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/UserStatus"
        organisationId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    AuthSession:
      type: object
      description: "Antwort nach Registrierung, Anmeldung oder Annahme einer Einladung."
      required: ["user", "tokens"]
      properties:
        user:
          $ref: "#/components/schemas/User"
        tokens:
          $ref: "#/components/schemas/TokenPair"
        organisation:
          $ref: "#/components/schemas/Organisation"

    Organisation:
      type: object
      description: "Mandant (Organisation = Abteilung, F2)."
      required: ["id", "name", "createdAt", "scanThreshold", "duplicateThreshold"]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        createdAt:
          type: string
          format: date-time
        scanThreshold:
          $ref: "#/components/schemas/Severity"
        duplicateThreshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
          default: 0.9
        duplicateDetectionEnabled:
          type: boolean
          default: true
        maxTagsPerPrompt:
          type: integer
          description: "Limit je Prompt (FR-015)."
          example: 10
        maxTagsPerOrganisation:
          type: integer
          description: "Limit je Organisation (FR-015)."
          example: 200
        providerVerified:
          type: boolean
          description: "Ergebnis der Provider-Verifikation (FR-038, DP-005)."
          example: true

    Invitation:
      type: object
      description: "Einmalige, zeitlich begrenzte Einladung in die eigene Organisation."
      required: ["id", "organisationId", "email", "role", "status", "expiresAt", "createdAt"]
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expiresAt:
          type: string
          format: date-time
          description: "Ablaufzeitpunkt (Default 7 Tage nach Erstellung)."
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true

    InvitationCreated:
      type: object
      description: |
        Antwort auf das Anlegen einer Einladung. **Nur hier** wird der Token einmalig
        ausgeliefert; gespeichert wird ausschließlich sein Hash.
      required: ["invitation", "token"]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        token:
          type: string
          description: "Einmaliger Einladungstoken (Einmalnutzung, 7 Tage gültig)."
          example: "inv_7f3c9a1b2c3d4e5f"

    AlertRecipient:
      type: object
      description: "Empfänger einer Warn-E-Mail; muss Mitglied derselben Organisation sein."
      required: ["userId", "email"]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email

    AlertRecipientList:
      type: object
      description: "Konfigurierte Alarmempfänger der Organisation."
      required: ["recipients", "fallbackToOrgAdmins"]
      properties:
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/AlertRecipient"
        fallbackToOrgAdmins:
          type: boolean
          description: |
            `true`, wenn die Liste leer ist und der Alarm an die `ORG_ADMIN`s der Organisation
            zugestellt wird (FR-053).
          example: true

    # -- Prompts ------------------------------------------------------------------
    Tag:
      type: object
      description: "Organisationsspezifischer Freitext-Tag (FR-015)."
      required: ["id", "organisationId", "name"]
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
          description: "Mandant des Tags — Tags sind organisationsspezifisch (FR-015, ADR-002)."
        name:
          type: string
          maxLength: 60
          description: "Anzeigename in der Schreibweise des ersten Zuordnungs."
          example: "Support"
        normalisedName:
          type: string
          description: "Für die Eindeutigkeit normalisierte Form (case-insensitiv)."
          example: "support"
        promptCount:
          type: integer
          minimum: 0

    Category:
      type: object
      description: "Organisationsspezifische Kategorie (FR-014)."
      required: ["id", "organisationId", "name", "isDefault", "isActive"]
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        isDefault:
          type: boolean
          description: "`true` für die Seed-Kategorien der Organisation."
        isActive:
          type: boolean
          description: "`false`, wenn die Kategorie deaktiviert wurde."
        promptCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time

    Prompt:
      type: object
      description: |
        Logischer Prompt. `status` ist der Prüfstatus der **aktuellen Version** (FR-012).
      required: ["id", "organisationId", "title", "categoryId", "tags", "status", "currentVersionId", "currentVersionNo", "createdBy", "createdAt", "updatedAt"]
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
          nullable: true
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        status:
          $ref: "#/components/schemas/ScanStatus"
        currentVersionId:
          type: string
          format: uuid
        currentVersionNo:
          type: integer
          minimum: 1
        content:
          type: string
          nullable: true
          description: "Inhalt der aktuellen Version. In Listenansichten nicht enthalten."
        findingCount:
          type: integer
          minimum: 0
          description: "Anzahl der Fundstellen der aktuellen Version."
        createdBy:
          type: string
          format: uuid
          nullable: true
          description: "`null`, wenn die Autorschaft anonymisiert wurde (Recht auf Löschung)."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PromptSummary:
      type: object
      description: "Listenansicht eines Prompts — ohne Inhalt."
      required: ["id", "organisationId", "title", "categoryId", "status", "currentVersionNo", "createdAt", "updatedAt"]
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
          nullable: true
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        status:
          $ref: "#/components/schemas/ScanStatus"
        currentVersionNo:
          type: integer
          minimum: 1
        findingCount:
          type: integer
          minimum: 0
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PromptVersion:
      type: object
      description: |
        Unveränderlicher Snapshot eines Prompt-Inhalts. Trägt den Prüfstatus (FR-013).
      required: ["id", "promptId", "organisationId", "versionNo", "content", "contentHash", "status", "createdAt"]
      properties:
        id:
          type: string
          format: uuid
        promptId:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        content:
          type: string
          maxLength: 50000
          description: "Unveränderlicher Inhalt der Version."
        contentHash:
          type: string
          description: |
            SHA-256 über den Inhalt. Die Freigabe ist an diesen Hash gebunden (Invariante I-1) —
            jede Inhaltsänderung erzeugt eine neue Version mit `PENDING`.
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        status:
          $ref: "#/components/schemas/ScanStatus"
        findingCount:
          type: integer
          minimum: 0
        createdBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        scannedAt:
          type: string
          format: date-time
          nullable: true
        waiver:
          $ref: "#/components/schemas/Waiver"

    VersionDiff:
      type: object
      description: "Vergleich zweier Versionen (FR-013, AC-009-3)."
      required: ["promptId", "fromVersionNo", "toVersionNo", "diff"]
      properties:
        promptId:
          type: string
          format: uuid
        fromVersionNo:
          type: integer
          minimum: 1
        toVersionNo:
          type: integer
          minimum: 1
        diff:
          type: string
          description: "Unified Diff der beiden Inhalte."
          example: "@@ -1,2 +1,3 @@\n Du bist ein Support-Mitarbeiter.\n+Nenne zuerst die Frist."
        addedLines:
          type: integer
          minimum: 0
        removedLines:
          type: integer
          minimum: 0

    # -- Scans --------------------------------------------------------------------
    ScanFinding:
      type: object
      description: |
        Konkreter Befund eines Prüflaufs (FR-037). Der Ausschnitt ist **maskiert**; die
        Maskierung betrifft nur die Anzeige — der übermittelte Inhalt bleibt unverändert
        (Entscheidung F1).
      required: ["id", "organisationId", "category", "severity", "redactedExcerpt", "explanation", "detector"]
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
          description: "Mandant des Fundes (ADR-002)."
        category:
          $ref: "#/components/schemas/FindingCategory"
        severity:
          $ref: "#/components/schemas/Severity"
        redactedExcerpt:
          type: string
          description: |
            Maskierter Ausschnitt des Fundes. Geheimnisse und personenbezogene Daten sind
            durch einen Platzhalter ersetzt.
          example: "sk-****[REDACTED]****9f2a"
        startOffset:
          type: integer
          minimum: 0
          description: "Zeichenoffset des Fundes im Inhalt."
        endOffset:
          type: integer
          minimum: 0
          description: "Zeichenoffset des Fundendes im Inhalt."
        line:
          type: integer
          minimum: 1
          description: "Zeilennummer des Fundes."
        column:
          type: integer
          minimum: 1
          description: "Spaltennummer des Fundes."
        explanation:
          type: string
          description: "Begründung des Befundes in deutscher Sprache."
          example: "Der Inhalt versucht, die vorherige Anweisung zu überschreiben."
        detector:
          type: string
          description: "Auslösende Regel bzw. Herkunft des Modellurteils."
          example: "rule:instruction-override-de"
        stage:
          type: string
          enum: ["PRECHECK", "DUPLICATE", "CLASSIFICATION"]
          description: "Stufe des Prüflaufs, die den Fund erzeugt hat (FR-031)."

    ProviderTransfer:
      type: object
      description: |
        Metadaten einer Übermittlung an den KI-Dienst (FR-074, Art. 30 DSGVO).
        **Ohne Inhalt** — nur Zeitpunkt, Provider, Modell, Zeichenlänge, Ergebnis-ID und
        Korrelations-ID.
      required: ["provider", "model", "contentLength", "transferredAt", "correlationId"]
      properties:
        provider:
          type: string
          example: "gemini-eu"
        model:
          type: string
          example: "gemini-2.0-flash"
        contentLength:
          type: integer
          minimum: 0
          description: "Übermittelte Zeichenzahl — kein Inhalt."
        transferredAt:
          type: string
          format: date-time
        resultId:
          type: string
          format: uuid
          nullable: true
          description: "ID des erzeugten Scan-Ergebnisses — erlaubt die Zuordnung der Fundstellen."
        correlationId:
          type: string
          example: "01J8Z6M2QK9Y3F7V0C4T5N6P7R"

    ScanRun:
      type: object
      description: |
        Ergebnis eines Prüflaufs über genau eine Version (FR-031, FR-036, FR-037).
      required: ["id", "promptVersionId", "promptId", "organisationId", "status", "findings", "findingCount"]
      properties:
        id:
          type: string
          format: uuid
        promptVersionId:
          type: string
          format: uuid
        promptId:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ScanRunStatus"
        versionStatus:
          $ref: "#/components/schemas/ScanStatus"
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        durationMs:
          type: integer
          minimum: 0
          nullable: true
        attemptCount:
          type: integer
          minimum: 0
          description: "Anzahl der Versuche inklusive aktuellem."
        threshold:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Severity"
          description: "Angewandter Mindest-Schweregrad. Erst nach Abschluss des Laufs gesetzt; bei einem abgeschlossenen Lauf immer vorhanden (AC-021-3)."
        duplicateThreshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
          nullable: true
          description: "Angewandte Duplikatschwelle. Erst nach Abschluss des Laufs gesetzt."
        findings:
          type: array
          description: "Fundstellen des Laufs. Maximale Länge 200; `findingCount` nennt die Gesamtzahl."
          maxItems: 200
          items:
            $ref: "#/components/schemas/ScanFinding"
        findingCount:
          type: integer
          minimum: 0
        duplicateMatches:
          type: array
          description: "Beratende Duplikatwarnung — bis zu 5 ähnliche Prompts derselben Organisation (FR-032)."
          maxItems: 5
          items:
            $ref: "#/components/schemas/DuplicateMatch"
        providerTransfer:
          $ref: "#/components/schemas/ProviderTransfer"
        lastError:
          type: string
          nullable: true
          description: "Technische Fehlermeldung **ohne Inhalt** (z. B. Timeout, Provider nicht erreichbar)."

    Waiver:
      type: object
      description: "Dokumentierte manuelle Ausnahme-Freigabe einer geflaggten Version (FR-039)."
      required: ["id", "organisationId", "promptVersionId", "reason", "waivedBy", "waivedAt"]
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
          description: "Mandant der Ausnahme-Freigabe (ADR-002)."
        promptVersionId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 10
          maxLength: 2000
          description: "Pflicht-Begründung des Security-Admins."
        waivedBy:
          type: string
          format: uuid
          nullable: true
          description: "`null`, wenn das freigebende Konto gelöscht wurde (Recht auf Löschung, FR-063)."
        waivedAt:
          type: string
          format: date-time

    PromptStatus:
      type: object
      description: |
        Momentaner Prüfstatus eines Prompts inklusive monoton steigender `sequence` — Grundlage
        für den Polling-Fallback und die Wiederherstellung nach einem Verbindungsabbruch
        (AC-024-3).
      required: ["promptId", "status", "sequence"]
      properties:
        promptId:
          type: string
          format: uuid
        currentVersionId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: "#/components/schemas/ScanStatus"
        sequence:
          type: integer
          format: int64
          minimum: 0
          description: "Monoton steigende Nummer je Prompt. Der Client verwirft Ereignisse mit kleinerem Wert."
        findingCount:
          type: integer
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        retryable:
          type: boolean
          description: "`true`, wenn der Status `FAILED` ist und ein erneuter Prüflauf möglich ist."

    StatusTransition:
      type: object
      description: "Ein Statusübergang einer Version (FR-041, SEC-010)."
      required: ["id", "organisationId", "promptId", "fromStatus", "toStatus", "at", "cause"]
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
          description: "Mandant des Ereignisses (ADR-002)."
        promptId:
          type: string
          format: uuid
        promptVersionId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        fromStatus:
          $ref: "#/components/schemas/ScanStatus"
        toStatus:
          $ref: "#/components/schemas/ScanStatus"
        at:
          type: string
          format: date-time
        cause:
          type: string
          description: "Auslösender Vorgang, z. B. `SCAN_COMPLETED`, `WAIVER_GRANTED`, `SCAN_RETRY_REQUESTED`."
          example: "SCAN_COMPLETED"
        actorId:
          type: string
          format: uuid
          nullable: true

    AuditEvent:
      type: object
      description: |
        Sicherheitsrelevantes Ereignis **ohne Inhalt** (SEC-010, FR-062). Enthält Actor,
        Zeitpunkt, Aktion und technische Metadaten — niemals Prompt-Inhalt, Fundstellen oder
        personenbezogene Daten.
      required: ["id", "organisationId", "action", "entityType", "at"]
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
          nullable: true
          description: "`null`, wenn die Autorschaft anonymisiert wurde (Recht auf Löschung)."
        actorEmail:
          type: string
          format: email
          nullable: true
        action:
          type: string
          description: |
            Stabile Aktionskennung. Bekannte Werte: `REGISTERED`, `LOGIN_SUCCEEDED`,
            `LOGIN_FAILED`, `LOGOUT`, `TOKEN_REFRESHED`, `PASSWORD_CHANGED`, `PROFILE_UPDATED`,
            `INVITATION_CREATED`, `INVITATION_ACCEPTED`, `INVITATION_REVOKED`,
            `MEMBER_ROLE_CHANGED`, `MEMBER_REMOVED`, `ALERT_RECIPIENTS_REPLACED`,
            `ORGANISATION_SETTINGS_CHANGED`, `PROMPT_CREATED`, `PROMPT_UPDATED`, `PROMPT_DELETED`,
            `CATEGORY_CREATED`, `CATEGORY_UPDATED`, `CATEGORY_DELETED`, `CATEGORY_DEACTIVATED`,
            `SCAN_QUEUED`, `SCAN_STARTED`, `SCAN_COMPLETED`, `SCAN_FAILED`,
            `SCAN_RETRY_REQUESTED`, `WAIVER_GRANTED`, `STATUS_CHANGED`, `NOTIFICATION_QUEUED`,
            `NOTIFICATION_SENT`, `NOTIFICATION_FAILED`, `NOTIFICATION_DEAD_LETTERED`,
            `NOTIFICATION_RETRY_REQUESTED`, `USER_ERASED`, `RETENTION_RUN`,
            `PROVIDER_TRANSFER`, `PROVIDER_VERIFICATION`.
          example: "WAIVER_GRANTED"
        entityType:
          type: string
          enum: ["ORGANISATION", "USER", "MEMBERSHIP", "INVITATION", "PROMPT", "PROMPT_VERSION", "SCAN", "NOTIFICATION", "CATEGORY"]
        entityId:
          type: string
          format: uuid
          nullable: true
        at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
          description: "Technische Metadaten ohne Inhalt, z. B. `{\"fromRole\":\"DEVELOPER\",\"toRole\":\"SECURITY_ADMIN\"}`."
          example:
            fromRole: "DEVELOPER"
            toRole: "SECURITY_ADMIN"

    NotificationDelivery:
      type: object
      description: |
        Zustellversuch der Warn-E-Mail (FR-050, FR-051, FR-052). Enthält **keinen**
        Prompt-Inhalt und **keine** Fundstellen-Ausschnitte — nur Kategorien und
        Schweregrade.
      required: ["id", "organisationId", "promptId", "recipient", "status", "attempts", "createdAt"]
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        promptId:
          type: string
          format: uuid
        promptTitle:
          type: string
          description: "Titel des Prompts — Bestandteil der Metadaten der Warnung (FR-051)."
        promptVersionId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        recipient:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/NotificationStatus"
        attempts:
          type: integer
          minimum: 0
        lastError:
          type: string
          nullable: true
          description: "Technische Fehlermeldung **ohne Inhalt**."
        findingCategories:
          type: array
          items:
            $ref: "#/components/schemas/FindingCategory"
        findingSeverities:
          type: array
          items:
            $ref: "#/components/schemas/Severity"
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ProviderVerification:
      type: object
      description: |
        Verifikationsstand der KI-Provider-Konfiguration (FR-038, FR-065, DP-005). Solange
        `verified` nicht `true` ist, bricht der Prüflauf ab, ohne dass Inhalt das System
        verlässt.
      required: ["verified", "provider", "model", "region", "checks", "lastCheckedAt"]
      properties:
        verified:
          type: boolean
          description: "Gesamtergebnis der Verifikation — Gate des Prüflaufs."
        provider:
          type: string
          example: "gemini-eu"
        model:
          type: string
          example: "gemini-2.0-flash"
        region:
          type: string
          description: "Region des Providers — muss `europe-west3` sein (DP-005)."
          example: "europe-west3"
        avvReference:
          type: string
          nullable: true
          description: "Referenz auf den Vertrag zur Auftragsverarbeitung."
        trainingOptOut:
          type: boolean
          description: "`true`, wenn der Provider das Training auf Eingangsdaten ausgeschlossen hat."
        durableStorageDisabled:
          type: boolean
          description: "`true`, wenn der Provider keine dauerhafte Speicherung zusagt."
        checks:
          type: array
          description: "Einzelergebnisse der Prüfungen."
          items:
            $ref: "#/components/schemas/ProviderCheck"
        violations:
          type: array
          description: "Verstöße gegen die Auflagen. Solange nicht leer, ist `verified` `false`."
          items:
            type: string
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        lastCheckedAt:
          type: string
          format: date-time

    ProviderCheck:
      type: object
      required: ["id", "passed"]
      properties:
        id:
          type: string
          description: "Stabile Kennung der Einzelprüfung."
          example: "eu-region"
        passed:
          type: boolean
        detail:
          type: string
          description: "Kurze, inhaltsfreie Beschreibung des Prüfergebnisses."

    PersonalDataExport:
      type: object
      description: |
        Maschinenlesbarer Export der personenbezogenen Daten einer Person (DP-007, DP-008).
        Enthält **keine** Prompt-Inhalte und **keine** Fundstellen-Ausschnitte.
      required: ["user", "membership", "promptReferences", "generatedAt"]
      properties:
        user:
          $ref: "#/components/schemas/User"
        membership:
          $ref: "#/components/schemas/Membership"
        promptReferences:
          type: array
          description: "Referenzen auf eigene Prompts und Versionen — ohne Inhalt."
          items:
            $ref: "#/components/schemas/PersonalDataPromptReference"
        sessions:
          type: array
          description: "Aktive Sitzungen (ohne Token-Werte)."
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              createdAt:
                type: string
                format: date-time
              lastUsedAt:
                type: string
                format: date-time
        generatedAt:
          type: string
          format: date-time

    PersonalDataPromptReference:
      type: object
      required: ["promptId", "versionNo"]
      properties:
        promptId:
          type: string
          format: uuid
        versionNo:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time

    PrivacyNotice:
      type: object
      description: "Datenschutzhinweis in deutscher und englischer Fassung (FR-064, DP-006)."
      required: ["version", "effectiveFrom", "languages"]
      properties:
        version:
          type: string
          description: "Versionskennung der Fassung."
          example: "2026-10-20.1"
        effectiveFrom:
          type: string
          format: date-time
        languages:
          type: object
          required: ["de", "en"]
          properties:
            de:
              $ref: "#/components/schemas/PrivacyNoticeText"
            en:
              $ref: "#/components/schemas/PrivacyNoticeText"

    PrivacyNoticeText:
      type: object
      required: ["purpose", "legalBasis", "retention", "rights"]
      properties:
        purpose:
          type: string
          description: "Zweck der Verarbeitung (DP-001)."
        legalBasis:
          type: string
          description: "Rechtsgrundlage (berechtigtes Interesse / interne Compliance-Pflicht)."
        retention:
          type: string
          description: "Aufbewahrungsfristen, z. B. „Logs 90 Tage, KI-Rohpayloads 24 Stunden“."
        rights:
          type: array
          description: "Betroffenenrechte: Auskunft, Berichtigung, Löschung, Widerspruch, Export."
          items:
            type: string
        controller:
          type: string
          nullable: true
        contact:
          type: string
          nullable: true
          description: "Kontaktstelle für Datenschutzanfragen."

    PrivacyNoticeVersionList:
      type: object
      required: ["versions"]
      properties:
        versions:
          type: array
          items:
            type: object
            required: ["version", "effectiveFrom"]
            properties:
              version:
                type: string
              effectiveFrom:
                type: string
                format: date-time
              archivedAt:
                type: string
                format: date-time
                nullable: true

    HealthStatus:
      type: object
      description: "Health-Status des Dienstes (FR-072)."
      required: ["status", "components"]
      properties:
        status:
          type: string
          enum: ["UP", "DEGRADED", "DOWN"]
        components:
          type: array
          items:
            type: object
            required: ["name", "status"]
            properties:
              name:
                type: string
                example: "database"
              status:
                type: string
                enum: ["UP", "DEGRADED", "DOWN"]
              detail:
                type: string
                nullable: true
                description: "Kurze, inhaltsfreie Beschreibung."
        checkedAt:
          type: string
          format: date-time

    MetricsSnapshot:
      type: object
      description: |
        Aggregierte Betriebsmetriken (FR-072, NFR-014). Organisationsübergreifend, ohne
        Mandantenbezug und ohne Inhalte.
      required: ["queueDepth", "scanDurationMs", "errorRate", "deliveryRate", "statusDistribution", "generatedAt"]
      properties:
        queueDepth:
          type: integer
          minimum: 0
          description: "Aktuelle Tiefe der Prüfwarteschlange."
        oldestQueuedJobAgeSeconds:
          type: integer
          minimum: 0
          nullable: true
        scanDurationMs:
          type: object
          description: "Dauer des Prüflaufs von Enqueue bis Urteil (NFR-002)."
          required: ["p50", "p95", "p99"]
          properties:
            p50:
              type: integer
              minimum: 0
            p95:
              type: integer
              minimum: 0
            p99:
              type: integer
              minimum: 0
        errorRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: "Anteil fehlgeschlagener Prüfläufe im Messfenster."
        deliveryRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: "Anteil erfolgreich zugestellter Warn-E-Mails im Messfenster (K7)."
        statusDistribution:
          type: object
          description: "Verteilung der Scan-Status."
          additionalProperties:
            type: integer
            minimum: 0
        generatedAt:
          type: string
          format: date-time

    # -- Request bodies -----------------------------------------------------------
    RegisterRequest:
      type: object
      required: ["email", "password", "organisationName"]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: "Klartextpasswort im Registrierungsfluss; wird mit bcrypt/argon2id (Cost ≥ 12) gehasht."
        organisationName:
          type: string
          minLength: 1
          maxLength: 200
          description: "Name der neu erzeugten Organisation."
        displayName:
          type: string
          maxLength: 200
          nullable: true
        organisationId:
          type: string
          format: uuid
          nullable: true
          description: |
            Wird **ignoriert** — eine Registrierung kann keiner bestehenden Organisation
            beitreten (FR-002, AC-002-3). Das Feld existiert nur, damit Clients eine
            versehentliche Übernahme explizit zurückweisen können.

    LoginRequest:
      type: object
      required: ["email", "password"]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 512
          nullable: true
          description: |
            Nur für Nicht-Browser-Clients. Browser übergeben den Refresh-Token als
            `HttpOnly`-Cookie (SEC-001).

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          maxLength: 512
          nullable: true
          description: "Optional; sonst wird der Refresh-Token aus dem Cookie gelesen."

    ProfileUpdateRequest:
      type: object
      description: "Mindestens ein Feld muss gesetzt sein."
      properties:
        displayName:
          type: string
          maxLength: 200
          nullable: true
        email:
          type: string
          format: email
          maxLength: 254
          description: "Neue Adresse; wird sofort übernommen (kein Bestätigungsworkflow im MVP)."
        locale:
          type: string
          enum: [de, en]
          description: "Sprache der Oberfläche; die Wahl wird gespeichert und wiederhergestellt (NFR-018, US-035 AC-035-4)."

    PasswordChangeRequest:
      type: object
      required: ["currentPassword", "newPassword"]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128

    OrganisationUpdateRequest:
      type: object
      description: "Mindestens ein Feld muss gesetzt sein."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        scanThreshold:
          $ref: "#/components/schemas/Severity"
        duplicateThreshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
        duplicateDetectionEnabled:
          type: boolean

    MemberRoleUpdateRequest:
      type: object
      required: ["role"]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    AlertRecipientsRequest:
      type: object
      required: ["recipients"]
      properties:
        recipients:
          type: array
          description: "1–n Empfänger; alle müssen Mitglieder derselben Organisation sein (FR-006)."
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/AlertRecipient"

    InvitationCreateRequest:
      type: object
      required: ["email", "role"]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: "#/components/schemas/Role"
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
          description: "Gültigkeitsdauer der Einladung (Default 7 Tage)."

    InvitationAcceptRequest:
      type: object
      required: ["token", "password"]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 512
        password:
          type: string
          minLength: 12
          maxLength: 128
        displayName:
          type: string
          maxLength: 200
          nullable: true

    PromptCreateRequest:
      type: object
      required: ["title", "content", "categoryId"]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          nullable: true
        content:
          type: string
          minLength: 1
          maxLength: 50000
        categoryId:
          type: string
          format: uuid
          description: "Genau eine Kategorie der eigenen Organisation (FR-010)."
        tags:
          type: array
          description: "0–n Tags; Freitext, organisationsspezifisch (FR-015)."
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 60

    PromptUpdateRequest:
      type: object
      description: |
        Mindestens ein Feld muss gesetzt sein. Jede inhaltliche Änderung erzeugt eine neue
        Version mit Status `PENDING` (FR-012, Invariante I-1).
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          nullable: true
        content:
          type: string
          minLength: 1
          maxLength: 50000
        categoryId:
          type: string
          format: uuid
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 60

    CategoryCreateRequest:
      type: object
      required: ["name"]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    CategoryUpdateRequest:
      type: object
      description: "Mindestens ein Feld muss gesetzt sein."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        isActive:
          type: boolean
          description: "`false` deaktiviert die Kategorie; Referenzen bestehender Prompts bleiben erhalten."

    RescanRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          nullable: true
          description: "Optionaler Grund; wird im Audit-Eintrag festgehalten."

    WaiverRequest:
      type: object
      required: ["reason"]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 2000
          description: "Pflicht-Begründung; ohne sie `422` und kein Audit-Eintrag (AC-023-3)."


servers:
  - url: https://echobox.example
    description: Produktion (EU-Hosting). Staging und Produktion nutzen getrennte Konfigurationen und getrennte Secrets (AC-023-5).

tags:
  - name: Endpunkte
    description: Registrierung, Pause, Reaktivierung und Secret-Rotation (FR-001…FR-004).
  - name: Ereignisse
    description: Annahme, Idempotenz und Verschlüsselung im Ruhezustand (FR-010…FR-013).
  - name: Zustellung
    description: Zustellprotokoll, tote Zustellungen, Replay, Kennzahlen (FR-024, FR-030…FR-032).
  - name: Betrieb
    description: Health, Readiness, Rate-Limit-Zählung, Aufbewahrung (FR-031, FR-033, NFR-006).

security:
  - bearerAuth: []

# =============================================================================
# Ausgehender Zustellvertrag (eingefroren)
# -----------------------------------------------------------------------------
# Dieser Abschnitt beschreibt den HTTP-Vertrag, den EchoBox gegen die
# registrierte Empfänger-URL ausübt. Er ist **kein** Teil der eingehenden
# REST-Schnittstelle, gehört aber in denselben Vertrag: Verfahren und
# Header-Name der Signatur sowie das Ablehnungssignal dürfen sich danach
# nicht mehr ändern (FR-020, D-07, D-08).
# =============================================================================
x-delivery-protocol:
  title: Ausgehender Zustellvertrag (Version 1)
  status: eingefroren
  applies_to: Jede HTTP-Zustellung an eine registrierte Endpunkt-URL.
  x-ac-id:
    - US-009/AC-009-1
    - US-009/AC-009-2
    - US-009/AC-009-3
    - US-009/AC-009-4
    - US-009/AC-009-5
    - US-010/AC-010-1
    - US-010/AC-010-2
    - US-010/AC-010-3
    - US-010/AC-010-4
    - US-014/AC-014-1
    - US-014/AC-014-2
    - US-014/AC-014-3
    - US-014/AC-014-4

  request:
    method: POST
    url: "{target_url}"
    x-ac-id:
      - US-010/AC-010-1
    headers:
      - name: Content-Type
        required: true
        value: "<payload_media_type des Ereignisses> (Vorgabe: application/json)"
        description: "Medientyp der Nutzlast. Entspricht `payload_media_type` des Ereignisses."
      - name: X-EchoBox-Event-Id
        required: true
        value: "<UUID>"
        description: >-
          **Ereignis-ID.** Stabil über alle Zustellläufe und alle Endpunkte
          hinweg. Der Empfänger nutzt sie als fachlichen Deduplizierungsschlüssel
          (FR-021, D-06).
        x-ac-id:
          - US-010/AC-010-1
          - US-010/AC-010-4
      - name: X-EchoBox-Delivery-Run-Id
        required: true
        value: "<UUID>"
        description: >-
          **Zustelllauf-ID.** Über alle Versuche eines Laufs identisch. Ein
          Replay erzeugt einen **neuen** Zustelllauf mit neuer ID (FR-024, D-06).
        x-ac-id:
          - US-010/AC-010-1
          - US-010/AC-010-2
          - US-013/AC-013-5
      - name: X-EchoBox-Attempt-Id
        required: true
        value: "<UUID>"
        description: >-
          **Versuchs-ID.** Für jeden HTTP-Versuch eindeutig. Zwei Versuche
          desselben Zustelllaufs haben unterschiedliche Versuchs-IDs, gleiche
          Ereignis-ID und gleiche Zustelllauf-ID (FR-021, D-06).
        x-ac-id:
          - US-010/AC-010-1
          - US-010/AC-010-2
      - name: X-EchoBox-Attempt-Number
        required: true
        value: "<1-basiert>"
        description: "Versuchsnummer innerhalb des Zustelllaufs. Beginnt nach einem Replay wieder bei 1 (FR-024)."
        x-ac-id:
          - US-010/AC-010-2
          - US-013/AC-013-1
      - name: X-EchoBox-Event-Type
        required: true
        value: "<Ereignistyp>"
        description: "Ereignistyp des zugestellten Ereignisses (Filter des Empfängers)."
      - name: X-EchoBox-Timestamp
        required: true
        value: "<ISO-8601 UTC, z. B. 2026-10-21T09:15:22.481Z>"
        description: >-
          Zeitpunkt der Zustellung in UTC. **Exakt dieser Wert** geht in die
          Signier-Eingabe ein. Der Empfänger darf einen Zeitstempel, der mehr
          als `signature_tolerance_seconds` (Konfiguration, Default 300) von der
          eigenen Uhr abweicht, ablehnen (Replay-Schutz).
        x-ac-id:
          - US-009/AC-009-5
      - name: X-EchoBox-Signature
        required: true
        value: "v1=<hex-lowercase-hmac-sha256>"
        description: >-
          **Signatur der Zustellung.** Verfahren und Header-Name sind
          eingefroren (FR-020, D-07).
        x-ac-id:
          - US-009/AC-009-1
          - US-009/AC-009-2
          - US-009/AC-009-3
          - US-009/AC-009-4
      - name: User-Agent
        required: true
        value: "EchoBox-Delivery/1.0"
        description: "Ermöglicht dem Empfänger, EchoBox-Zustellungen zu erkennen."
    body:
      description: >-
        **Der Request-Body sind die Nutzlastbytes des Ereignisses** — keine
        Hülle, kein Envelope. Alle Metadaten stehen in den Headern. Das ist
        zwingend, weil die zugestellten Bytes byteidentisch mit dem sein
        müssen, **was das Ereignis trägt** (AC-007-3), und weil die Signatur
        über genau diese Bytes berechnet wird (D-07).

        Bei Einlieferung als `payload` (JSON-Wert) sind das die **kanonisch
        materialisierten** Bytes (RFC 8785, UTF-8, sortierte Schlüssel, ohne
        bedeutungslose Leerzeichen); bei `payload_base64` sind es die **exakt
        gelieferten** Bytes. „Byteidentisch" heißt also: identisch mit dem, was
        das Ereignis trägt — **nicht** mit dem Rohtext, den der Aufrufer
        zufällig gesendet hat.
      media_type: "application/json (bzw. payload_media_type des Ereignisses)"
      x-ac-id:
        - US-007/AC-007-3
        - US-008/AC-008-1
      example: '{"order_id":4711,"state":"shipped"}'

  signature:
    algorithm: HMAC-SHA256
    header_name: X-EchoBox-Signature
    header_value_format: "v1=<hex-lowercase>"
    secret: "Das Endpunkt-Secret des Empfängers (Klartext, nie im Klartext ausgegeben)."
    signing_input: "<timestamp>.<payload_bytes>"
    signing_input_detail: >-
      ASCII-Darstellung des exakten `X-EchoBox-Timestamp`-Werts, gefolgt von
      einem einzelnen Punkt `.`, gefolgt von den **exakt gesendeten Body-Bytes**
      (UTF-8, ohne weitere Normalisierung). Bei vorverschlüsselten Ereignissen
      (FR-013) sind die gesendeten Bytes die Chiffre — der Empfänger prüft die
      Signatur über die empfangenen Bytes und entschlüsselt erst danach.
    verification: >-
      Der Empfänger berechnet `hex(HMAC-SHA256(secret, signing_input))` und
      vergleicht **zeitkonstant** mit dem Hexanteil aus `X-EchoBox-Signature`.
      Bei Abweichung gilt die Zustellung als **nicht erfolgreich zugestellt**.
    canonicalisation: "keine — die Bytes werden unverändert signiert."
    version_marker: >-
      Der Präfix `v1=` im Headerwert ist Teil der Signier-Eingabe-Konvention.
      Ein neues Verfahren erhält einen neuen Präfix und eine neue Hauptversion
      des ausgehenden Vertrags; der alte Präfix bleibt parallel unterstützt.
    x-ac-id:
      - US-009/AC-009-1
      - US-009/AC-009-2
      - US-009/AC-009-5

  response:
    description: >-
      Der Empfänger antwortet mit einem HTTP-Statuscode. Ein Antwort-Body wird
      nicht ausgewertet.
    outcomes:
      - status_range: "2xx"
        meaning: "Erfolgreich zugestellt. Es erfolgt **kein** weiterer Versuch für dieses Ereignis an diesen Endpunkt."
        x-ac-id:
          - US-010/AC-010-3
          - US-011/AC-011-4
      - status_code: 410
        meaning: >-
          **Ablehnungssignal** (dauerhaft nicht gewünscht). Der Empfänger signalisiert
          damit ausdrücklich, dass er das Ereignis **nicht** mehr möchte. Die Zustellung
          wird sofort ohne weitere Versuche aufgegeben, Status `rejected` (FR-025, D-08).
        required_headers:
          - name: X-EchoBox-Rejection
            required: true
            value: "permanent"
            description: "Kennzeichnet die Antwort als dauerhafte Ablehnung — **Pflicht** beim Signal (ADR-009)."
        body:
          description: "Das exakte Format des Ablehnungssignals (JSON)."
          media_type: "application/json"
          schema:
            $ref: "#/components/schemas/DeliveryRejection"
          example:
            rejection: permanent
            reason: event_type_not_subscribed
            message: "Dieser Endpunkt verarbeitet den Ereignistyp order.changed nicht."
            rejected_event_types:
              - order.changed
        x-ac-id:
          - US-014/AC-014-1
          - US-014/AC-014-2
      - status_range: "5xx, 408, 429"
        meaning: "Wiederholbarer Fehler. Es wird ein weiterer Versuch nach Backoff geplant."
        x-ac-id:
          - US-011/AC-011-3
          - US-014/AC-014-3
      - status_range: "übrige 4xx (außer 410)"
        meaning: >-
          Kein Wiederholen. Die Zustellung wird ohne weitere Versuche aufgegeben und
          als `rejected` protokolliert (D-08). Der Empfänger bekommt damit eine
          dauerhafte Absage, auch ohne das ausdrückliche Ablehnungssignal.
        x-ac-id:
          - US-014/AC-014-4
      - status_range: "3xx"
        meaning: >-
          **Kein Wiederholen.** Eine Umleitung (301, 302, 307, 308 …) wird
          **nicht befolgt** — der Dienst sendet genau einmal an die registrierte
          Ziel-URL. Die Zustellung endet ohne weitere Versuche mit Status
          `rejected` und `rejection_reason = client_error` (D-08, ADR-009).
          Grund: die Ziel-URL ist Teil der Signatur-Eingabe; ein Folgeort
          würde die signierte URL aufweichen.
        x-ac-id:
          - US-010/AC-010-3
          - US-014/AC-014-4
      - transport_error: true
        meaning: >-
          Netzwerkfehler, DNS-Fehler, TLS-Fehler, Verbindungs-Timeout,
          Lese-Timeout. Wird wie ein 5xx behandelt: Wiederholung nach Backoff.
          Die Summe aus Verbindungs- und Lese-Timeout je Versuch bleibt unter
          30 s (Abschnitt 11 der Anforderung, ADR-008).

          **Trennlinie der Klassifikation:** `timeout` = der
          **Verbindungs-Timeout** (5 s) oder der **Lese-Timeout** (10 s) hat
          ausgelöst; `network_error` = DNS-, TLS- oder Verbindungsfehler
          **ohne** Timeout. Beide Outcomes führen zum selben Verhalten
          (Wiederholung nach Backoff), werden im Protokoll aber
          **unterschiedlich** ausgewiesen (AC-011-3, FR-030).
        x-ac-id:
          - US-011/AC-011-3
          - US-014/AC-014-3

  duplicate_handling:
    guarantee: at-least-once
    description: >-
      EchoBox garantiert **at-least-once**: ein Ereignis kann mehrfach beim
      Empfänger ankommen. Der Dienst garantiert **nicht** at-most-once — ein
      Timeout, bei dem der Empfänger bereits verarbeitet hat, ist vom Dienst
      nicht unterscheidbar.
    receiver_deduplication_key: >-
      **X-EchoBox-Event-Id** — fachliche Deduplizierung (dasselbe Ereignis).
      Für die Erkennung einer **Wiederholung desselben Zustelllaufs** (Timeout-
      Dublette) dienen **X-EchoBox-Delivery-Run-Id** (gleich) und
      **X-EchoBox-Attempt-Id** / **X-EchoBox-Attempt-Number** (verschieden).
    x-ac-id:
      - US-010/AC-010-1
      - US-010/AC-010-2
      - US-010/AC-010-4

  retry_policy:
    description: >-
      Wiederholung nach fehlgeschlagenem Versuch mit **wachsendem Abstand**
      (Verdopplung) und **Streuung**, damit nicht alle Endpunkte eines
      Ausfalls gleichzeitig wieder versucht werden (FR-022). Nach erschöpften
      Versuchen wird die Zustellung aufgegeben und landet in der Liste der
      toten Zustellungen (FR-023).
    configuration:
      max_attempts: "Konfigurierbar. Vorgabewert (bestätigt 2026-10-21, F-04): 8 Versuche."
      base_delay: "Konfigurierbar. Vorgabewert (F-04): 1 Minute."
      multiplier: "Konfigurierbar. Vorgabewert (F-04): 2 (Verdopplung)."
      max_delay: "Konfigurierbar. Vorgabewert (F-04): 60 Minuten."
      jitter: "Konfigurierbar. Vorgabewert (F-04): ± 20 %."
      attempt_timeout:
        connect_timeout: "Konfigurierbar. Festlegung der Architektur (ADR-008): Default 5 s."
        read_timeout: "Konfigurierbar. Festlegung der Architektur (ADR-008): Default 10 s."
      expected_completion_window: >-
        Das erwartete **Gesamtfenster** bis zum letzten Versuch. Bei den
        Vorgabewerten (8 Versuche, Basis 1 Minute, Verdopplung, Deckel
        60 Minuten) sind das 7 Wartezeiten = 1 + 2 + 4 + 8 + 16 + 32 + 60 =
        **123 Minuten ≈ 2 Stunden**; mit der Streuung von ± 20 % liegt das
        Fenster zwischen rund 1 h 38 min und 2 h 28 min (ADR-008). Das Fenster
        ist die **Zusage** gegenüber den Empfängern — die Frist läuft ab dem
        **Annahmezeitpunkt** des Ereignisses.
    x-ac-id:
      - US-011/AC-011-1
      - US-011/AC-011-2
      - US-011/AC-011-3
      - US-011/AC-011-5
      - US-012/AC-012-1
      - US-012/AC-012-3
      - US-012/AC-012-4

  rate_limit:
    description: >-
      Jeder Endpunkt ist gegen zu viele Zustellversuche in kurzer Zeit
      geschützt (FR-033). **Vorgabewert (bestätigt 2026-10-21, F-01): 60
      Zustellversuche je Endpunkt und Minute, Strategie `delay`** — bei
      Überschreitung wird der Versuch **verschoben**, nicht verworfen und nicht
      blockiert. Der Wert steht in der Betriebskonfiguration und ist je
      Endpunkt überschreibbar; er ist **keine** harte API-Grenze (D-14).
      Die Zählung der Zustellversuche je Endpunkt und Zeitfenster läuft
      unabhängig vom Grenzwert und ist über
      `GET /api/v1/endpoints/{endpointId}/metrics` im Feld `rate_limit`
      abrufbar.
    strategy_options:
      - name: delay
        meaning: "Der Versuch wird verschoben (nicht verworfen, nicht blockiert). Der Zustelllauf trägt den Zustand `delayed` und einen nächsten Versuchszeitpunkt. **Vorgabe (F-01).**"
      - name: block
        meaning: "Der Versuch wird zurückgestellt, bis das Zeitfenster wieder frei ist. Das Ereignis geht nicht verloren."
    default_strategy: "delay"
    default_limit: 60
    default_window_seconds: 60
    states:
      - name: kein_override
        meaning: >-
          `limit_value IS NULL` — es ist **kein** Override je Endpunkt gesetzt.
          Es gilt die Vorgabe aus der Betriebskonfiguration: **60** Versuche je
          Endpunkt und Minute (F-01). **Vorgabe (F-01).**
      - name: abgeschaltet
        meaning: >-
          `limit_value = 0` — die Begrenzung ist für diesen Endpunkt
          **abgeschaltet**; es gibt keinen wirksamen Grenzwert. Die Zählung
          läuft weiter (AC-018-4), der Versuch wird **nicht** verschoben.
    observability: >-
      Die Zählung je Endpunkt und Zeitfenster ist über
      `GET /api/v1/endpoints/{endpointId}/metrics` im Feld `rate_limit` abrufbar;
      `rate_limit.limit` weist den **wirksamen** Grenzwert aus (Vorgabe 60,
      je Endpunkt überschreibbar) und `rate_limit.limited` sagt, ob die
      Begrenzung **abgeschaltet** ist (`limited: false` ⇒ `limit: 0`).
    x-ac-id:
      - US-018/AC-018-1
      - US-018/AC-018-2
      - US-018/AC-018-3

# =============================================================================
# Pfade
# =============================================================================
paths:

  # ------------------------------------------------------------------ Endpunkte
  /api/v1/endpoints:
    post:
      operationId: createEndpoint
      tags: [Endpunkte]
      summary: Endpunkt registrieren
      description: >-
        Registriert eine Empfänger-URL mit Secret und den gewünschten
        Ereignistypen (FR-001). Der Endpunkt wird mit dem Status `active`
        (aktiv) angelegt und dem Mandanten der Identität zugewiesen. Das Secret
        wird verschlüsselt abgelegt und **nie** im Klartext ausgegeben.
      x-ac-id:
        - US-001/AC-001-1
        - US-001/AC-001-2
        - US-001/AC-001-3
        - US-001/AC-001-4
        - US-001/AC-001-5
      x-requirement-ids: [FR-001, NFR-004]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointCreateRequest"
            example:
              target_url: https://orders.example.invalid/hooks/echobox
              secret: "s3cr3t-rotationswert"
              event_types:
                - order.changed
                - order.cancelled
      responses:
        "201":
          description: Endpunkt angelegt.
          headers:
            Location:
              description: "URL des neu angelegten Endpunkts."
              schema:
                type: string
                format: uri
                example: https://echobox.example/api/v1/endpoints/8f1c2f0e-2f4a-4a0e-9d5b-6a1c2e3f4a5b
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
              example:
                endpoint_id: 8f1c2f0e-2f4a-4a0e-9d5b-6a1c2e3f4a5b
                organisation_id: m-1
                target_url: https://orders.example.invalid/hooks/echobox
                status: active
                event_types: [order.changed, order.cancelled]
                secret_version: 1
                secret_rotated_at: null
                paused_at: null
                created_at: "2026-10-21T09:10:00.000Z"
                updated_at: "2026-10-21T09:10:00.000Z"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listEndpoints
      tags: [Endpunkte]
      summary: Endpunkte auflisten
      description: >-
        Listet die Endpunkte. Für **alle** Rollen **außer** `service_admin` ist
        die Liste **mandantengefiltert**: ein `receiver_admin` sieht **nur** die
        Endpunkte **seines** Mandanten; ein `service_admin` sieht die Endpunkte
        **aller** Mandanten (FR-004, E-01). Mandant ohnehin aus der Identität —
        ein `organisation_id`-Filter ist nicht Teil des Vertrags (D-01).

        **Mandantenübergreifende Sicht:** Sie wird über die schmalen
        Eigentümerfunktionen des Schemas hergestellt (ADR-002 §7) — **nicht**
        über eine Laufzeitrolle mit `BYPASSRLS`.

        **`organisation_id`:** Das Feld ist in **jedem** Datensatz gefüllt — es
        benennt den **besitzenden Mandanten** des Endpunkts: im eigenen Mandanten
        den eigenen, in der mandantenübergreifenden Sicht den Mandanten, zu dem
        der Endpunkt gehört.

        **IDs fremder Mandanten:** Die mandantenübergreifende Liste liefert auch
        Endpunkt-IDs **fremder** Mandanten. Der **Detailabruf**
        (`GET /api/v1/endpoints/{endpointId}`) einer solchen ID endet mit
        **HTTP 404** — **auch** für den `service_admin` (D-02, V-27). Die
        mandantenübergreifende Sicht gilt **nur** für die **drei**
        Listen-/Betriebsoperationen; ein vierter mandantenübergreifender
        Leseweg wird **nicht** gebaut.
      x-ac-id:
        - US-004/AC-004-1
        - US-004/AC-004-2
      x-requirement-ids: [FR-004]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: >-
            Endpunktliste — **mandantengefiltert** für alle Rollen **außer**
            `service_admin`, der die Endpunkte **aller** Mandanten sieht (E-01);
            `organisation_id` benennt je Datensatz den **besitzenden Mandanten**.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointList"
              example:
                items:
                  - endpoint_id: 8f1c2f0e-2f4a-4a0e-9d5b-6a1c2e3f4a5b
                    organisation_id: m-1
                    target_url: https://orders.example.invalid/hooks/echobox
                    status: active
                    event_types: [order.changed, order.cancelled]
                    secret_version: 1
                    secret_rotated_at: null
                    paused_at: null
                    created_at: "2026-10-21T09:10:00.000Z"
                    updated_at: "2026-10-21T09:10:00.000Z"
                page:
                  limit: 50
                  has_more: false
                  next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/endpoints/{endpointId}:
    parameters:
      - $ref: "#/components/parameters/EndpointId"
    get:
      operationId: getEndpoint
      tags: [Endpunkte]
      summary: Endpunkt lesen
      description: >-
        Liefert einen einzelnen Endpunkt. Ein Endpunkt eines fremden Mandanten
        wird mit **HTTP 404** beantwortet — die Existenz fremder Objekte wird
        nicht preisgegeben (D-02). Das gilt **auch** für `service_admin`: die
        mandantenübergreifende Sicht gilt **nur** für Endpunktliste, Totenliste
        und Aufbewahrung (E-01); ein **Einzelabruf** über die Mandantgrenze
        hinweg wird **nicht** gebaut (V-27). Das Secret wird nie ausgegeben.
      x-ac-id:
        - US-004/AC-004-3
        - US-019/AC-019-1
      x-requirement-ids: [FR-001, FR-004]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Endpunkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateEndpoint
      tags: [Endpunkte]
      summary: Endpunkt aktualisieren
      description: >-
        Teilaktualisierung von Ziel-URL und Ereignistypen. Es werden **nur** die
        mitgeschickten Felder geändert. Das Secret wird **nicht** über diesen
        Weg geändert — dafür gibt es die Secret-Rotation. Die Validierung der
        Ziel-URL ist identisch zur Registrierung (https-Pflicht, keine
        eingebetteten Zugangsdaten) (FR-001).
      x-ac-id:
        - US-001/AC-001-2
        - US-001/AC-001-3
        - US-019/AC-019-2
      x-requirement-ids: [FR-001]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointUpdateRequest"
            example:
              target_url: https://orders.example.invalid/hooks/echobox-v2
              event_types:
                - order.changed
      responses:
        "200":
          description: Endpunkt aktualisiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/endpoints/{endpointId}/pause:
    parameters:
      - $ref: "#/components/parameters/EndpointId"
    post:
      operationId: pauseEndpoint
      tags: [Endpunkte]
      summary: Endpunkt pausieren
      description: >-
        Setzt den Endpunkt auf `paused` (pausiert). Ein pausierter Endpunkt erhält
        **keine** Zustellung: für Ereignisse, die während der Pause eintreffen,
        entsteht kein Zustellvorgang und **keine** Warteschlangeneintragung; ein
        bereits geplanter Wiederholungsvorgang wird abgebrochen (Zustelllauf
        endet mit `cancelled`). Nach der Reaktivierung wird **nichts**
        nachgeliefert (FR-002, D-03).
      x-ac-id:
        - US-002/AC-002-1
        - US-002/AC-002-3
        - US-002/AC-002-4
        - US-002/AC-002-5
      x-requirement-ids: [FR-002]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Endpunkt pausiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
              example:
                endpoint_id: 8f1c2f0e-2f4a-4a0e-9d5b-6a1c2e3f4a5b
                organisation_id: m-1
                target_url: https://orders.example.invalid/hooks/echobox
                status: paused
                event_types: [order.changed, order.cancelled]
                secret_version: 1
                secret_rotated_at: null
                paused_at: "2026-10-21T11:40:00.000Z"
                created_at: "2026-10-21T09:10:00.000Z"
                updated_at: "2026-10-21T11:40:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/endpoints/{endpointId}/resume:
    parameters:
      - $ref: "#/components/parameters/EndpointId"
    post:
      operationId: resumeEndpoint
      tags: [Endpunkte]
      summary: Endpunkt reaktivieren
      description: >-
        Hebt die Pause auf. **Es wird nichts nachgeliefert** — Ereignisse, die
        während der Pause eingeliefert wurden, erhalten keinen Zustellversuch
        (FR-002, D-03).
      x-ac-id:
        - US-002/AC-002-2
        - US-002/AC-002-5
      x-requirement-ids: [FR-002]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Endpunkt reaktiviert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/endpoints/{endpointId}/secret-rotation:
    parameters:
      - $ref: "#/components/parameters/EndpointId"
    post:
      operationId: rotateEndpointSecret
      tags: [Endpunkte]
      summary: Endpunkt-Secret rotieren
      description: >-
        Ersetzt das Secret des Endpunkts. Ab dem **nächsten** Zustellversuch
        gilt ausschließlich das neue Secret; eine Signatur über das alte Secret
        wird nicht mehr erzeugt. Das alte Secret wird **nicht** im Klartext
        ausgegeben, die Rotation wird mit Zeitpunkt und auslösender Identität
        protokolliert (FR-003).
      x-ac-id:
        - US-003/AC-003-1
        - US-003/AC-003-2
        - US-003/AC-003-3
        - US-003/AC-003-4
      x-requirement-ids: [FR-003]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretRotationRequest"
            example:
              secret: "neues-s3cr3t-rotationswert"
      responses:
        "200":
          description: Secret rotiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRotationResponse"
              example:
                endpoint_id: 8f1c2f0e-2f4a-4a0e-9d5b-6a1c2e3f4a5b
                secret_version: 2
                rotated_at: "2026-10-21T12:05:11.204Z"
                rotated_by: "user-42@orders.example.invalid"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  # ------------------------------------------------------------------- Ereignisse
  /api/v1/events:
    post:
      operationId: submitEvent
      tags: [Ereignisse]
      summary: Ereignis einliefern
      description: >-
        Nimmt ein Ereignis an (FR-010). Die Annahme ist **asynchron**: die
        Zustellung startet erst **nach** der Antwort, der Annahme-Request wird
        nie blockiert (NFR-002, D-10).

        **Idempotenz:** Der Gültigkeitsbereich des Idempotenzschlüssels ist das
        Paar (Mandant, Schlüssel) (D-05). Eine Wiederholung mit gleicher
        Nutzlast ist **erfolgreich** (HTTP 202) und liefert die Kennung des
        **ersten** Ereignisses (`idempotent_replay: true`). Dieselbe Nutzlast wird
        **nie** überschrieben. Derselbe Schlüssel mit **abweichender** Nutzlast
        wird mit **HTTP 409** abgelehnt.

        **Größengrenze:** Die Nutzlast ist auf 1.048.576 Byte (1 MB) begrenzt
        (NFR-001). Gemessen werden die **Nutzlastbytes** — bei vorverschlüsselter
        Einlieferung also die Chiffre, nicht der Klartext (D-13). 1 Byte darüber
        → HTTP 413.

        Die Grenze betrifft die **Nutzlast**, **nicht** den Request-Body: bei
        Einlieferung als `payload_base64` ist der Body base64-kodiert und damit
        rund **1,4-mal** so groß (bis ≈ 1,4 MB). Der Dienst akzeptiert einen
        Request-Body bis **2 MiB**; darüber antwortet er mit HTTP 413
        `payload_too_large`.

        **Verschlüsselung:** Die Nutzlast wird verschlüsselt gespeichert und nur
        für den Zustellvorgang entschlüsselt (FR-012, NFR-004).
      x-ac-id:
        - US-005/AC-005-1
        - US-005/AC-005-2
        - US-005/AC-005-3
        - US-005/AC-005-4
        - US-005/AC-005-5
        - US-005/AC-005-6
        - US-006/AC-006-1
        - US-006/AC-006-2
        - US-006/AC-006-3
        - US-006/AC-006-4
        - US-008/AC-008-1
        - US-008/AC-008-2
        - US-008/AC-008-3
      x-requirement-ids: [FR-010, FR-011, FR-012, FR-013, NFR-001, NFR-002]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventIntakeRequest"
            example:
              event_type: order.changed
              idempotency_key: order-4711-changed-2026-10-21T09:00:00Z
              payload:
                order_id: 4711
                state: shipped
              payload_encoding: plaintext
              payload_media_type: application/json
      responses:
        "202":
          description: >-
            Ereignis angenommen. Die Zustellung läuft im Hintergrund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventIntakeResponse"
              example:
                event_id: 3c9a7d21-8e4b-4a1f-9c2d-5e6f7a8b9c0d
                event_type: order.changed
                idempotency_key: order-4711-changed-2026-10-21T09:00:00Z
                status: accepted
                idempotent_replay: false
                subscribed_endpoint_count: 2
                payload_size_bytes: 35
                accepted_at: "2026-10-21T09:15:22.481Z"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getEvent
      tags: [Ereignisse]
      summary: Ereignis lesen (Metadaten)
      description: >-
        Liefert die Metadaten eines Ereignisses. Die Nutzlast wird nie
        ausgegeben. Ein Ereignis eines **fremden** Mandanten wird mit
        **HTTP 404** beantwortet (D-02) — **auch** für `service_admin`: die
        mandantenübergreifende Sicht gilt **nur** für Endpunktliste, Totenliste
        und Aufbewahrung (E-01, V-27).

        Ereignisse werden über das **Zustellprotokoll** gefunden, über den
        Filter `event_id` bzw. `event_type` in `GET /api/v1/deliveries`.
        Eine eigene Ereignisliste ist nicht Teil des Vertrags.
      x-ac-id:
        - US-015/AC-015-3
        - US-007/AC-007-5
      x-requirement-ids: [FR-012, FR-030]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ereignis (Metadaten).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

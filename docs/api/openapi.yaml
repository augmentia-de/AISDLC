  /api/v1/retention/enforcement:
    post:
      operationId: enforceRetention
      tags: [Betrieb]
      summary: Aufbewahrung durchsetzen
      description: >-
        Erzwingt die Aufbewahrung (FR-031, D-12). **Geltungsbereich: alle
        Mandanten** — die Operation ist mandantenübergreifend; je Mandant gilt
        die für ihn konfigurierte Frist. Die mandantenübergreifende Sicht und
        die Durchsetzung werden über die schmale Eigentümerfunktion des Schemas
        hergestellt (ADR-002 §7).

        **Anker je Datenart:** Die Frist beginnt **je Datensatz**, nicht zu
        einem globalen Stichtag. Der Anker ist der **letzte Zustellversuch**
        (`last_attempt_at`); für Ereignisse **ohne** Versuch ist es der
        Annahmezeitpunkt (`accepted_at`) (ADR-012 §2, F-02).

        **Zwei Stufen:** (1) **Markieren** (`deleted_at` gesetzt) — der Datensatz
        ist sofort unsichtbar; (2) **Purge** — die physische Löschung nach der
        **Karenzzeit** (`purge_delay_days`). Die Karenzzeit ist
        **konfigurierbar** (`echobox.retention.purge-delay`); ein
        **Vorgabewert ist nicht festgelegt** — der Vertrag behauptet keinen
        (offener Punkt R-01: Fachbereich, Gate 2). Bei `dry_run: true` wird
        nichts geändert; die Zähler weisen dann die **vorgemerkten** Mengen aus.

        **Kaskade:** Das Löschen eines Ereignisses nimmt seine Zustellläufe und
        Versuche **mit**. Die Protokollfrist gilt deshalb nur für Läufe, deren
        Ereignis noch steht.

        **Zwei Fristen, getrennt:** Vorgabewert **30 Tage** je Datenart
        (bestätigt am 2026-10-21 mit F-02), je Mandant überschreibbar. Steht in
        `retention_settings` **kein** Wert, gilt die Vorgabe (kein Override).
        Ist für **keinen** Mandanten eine Frist wirksam, bleibt der Aufruf ein
        **No-Op** und meldet `0`.

        **Nur `service_admin`**. Ein `receiver_admin` erhält HTTP 403.
      x-ac-id:
        - US-016/AC-016-5
      x-requirement-ids: [FR-031]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionEnforcementRequest"
            example:
              dry_run: true
      responses:
        "200":
          description: Aufbewahrung durchgesetzt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionEnforcementResponse"
              example:
                dry_run: true
                scope: all
                anchor: last_attempt_at
                purge_delay_days: null
                event_retention_days: 14
                delivery_retention_days: 30
                event_cutoff: "2026-10-07T00:00:00.000Z"
                delivery_cutoff: "2026-09-21T00:00:00.000Z"
                marked_events: 140
                marked_delivery_runs: 700
                marked_attempts: 3360
                purged_events: 0
                purged_delivery_runs: 0
                purged_attempts: 0
                tenants:
                  - organisation_id: m-1
                    event_retention_days: 30
                    event_retention_source: default
                    delivery_retention_days: 30
                    delivery_retention_source: default
                    event_cutoff: "2026-09-21T00:00:00.000Z"
                    delivery_cutoff: "2026-09-21T00:00:00.000Z"
                    marked_events: 128
                    marked_delivery_runs: 640
                    marked_attempts: 3120
                    purged_events: 0
                    purged_delivery_runs: 0
                    purged_attempts: 0
                  - organisation_id: m-2
                    event_retention_days: 14
                    event_retention_source: tenant
                    delivery_retention_days: 30
                    delivery_retention_source: default
                    event_cutoff: "2026-10-07T00:00:00.000Z"
                    delivery_cutoff: "2026-09-21T00:00:00.000Z"
                    marked_events: 12
                    marked_delivery_runs: 60
                    marked_attempts: 240
                    purged_events: 0
                    purged_delivery_runs: 0
                    purged_attempts: 0
                executed_at: "2026-10-21T13:00:00.000Z"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  # --------------------------------------------------------------------- Betrieb
  /health:
    get:
      operationId: getHealth
      tags: [Betrieb]
      summary: Health (Liveness)
      description: >-
        Liveness-Prüfung. Antwortet **ohne** Authentifizierung, damit Container-
        Runtime und Load-Balancer den Dienst prüfen können (AC-023-1).
      x-ac-id:
        - US-023/AC-023-1
      x-requirement-ids: [NFR-006]
      security: []
      responses:
        "200":
          description: Dienst läuft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: up
                service: echobox
                version: 1.0.0
                checked_at: "2026-10-21T13:05:00.000Z"
        "500":
          $ref: "#/components/responses/InternalError"

  /health/ready:
    get:
      operationId: getReadiness
      tags: [Betrieb]
      summary: Readiness
      description: >-
        Readiness-Prüfung: Datenbank erreichbar, Mandantenkontext gesetzt,
        Hintergrundprozess aktiv. Ohne Authentifizierung, damit der Container
        erst nach erfolgreicher Bereitschaft Traffic annimmt.

        **Der nicht bereite Zustand ist kein Readiness-Bericht:** Ist der Dienst
        nicht bereit, antwortet die Operation mit **HTTP 503** und dem
        Fehlerschema `Problem` (`code: service_unavailable`) — für **alle**
        Fehlerantworten gilt **ein** Schema (ADR-015 §4, V-41). Der
        **HTTP 200** trägt ausschließlich `status: ready` mit `checks.*: ok`.
      x-ac-id:
        - US-023/AC-023-1
      x-requirement-ids: [NFR-006]
      security: []
      responses:
        "200":
          description: Dienst ist bereit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
              example:
                status: ready
                checks:
                  database: ok
                  delivery_worker: ok
                  tenant_context: ok
                checked_at: "2026-10-21T13:05:00.000Z"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

# =============================================================================
# Komponenten
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT mit dem Claim `organisation_id` (Mandant) und den Rollen
        `developer`, `receiver_admin`, `service_admin`. Der Mandant stammt
        ausschließlich aus dem Token (D-01).

  parameters:
    EndpointId:
      name: endpointId
      in: path
      required: true
      description: "Endpunkt-ID (UUID)."
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      description: "Ereignis-ID (UUID)."
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: "Maximale Zahl der Einträge je Seite."
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaqer Fortsetzungs-Cursor aus `page.next_cursor` der vorigen Seite.
        Er trägt den **Sortierschlüssel** der Liste und gilt nur für dieselbe
        Operation mit denselben Filtern (siehe Abschnitt „Pagination“ in
        `info.description`). Ein ungültiger Cursor wird mit HTTP 422 abgelehnt.
      schema:
        type: string
        maxLength: 512
    From:
      name: from
      in: query
      required: false
      description: >-
        Beginn des Zeitraums (UTC, RFC 3339), inklusive. **Ohne `from`/`to` gilt
        das Vorgabefenster: die letzten 7 Tage bis jetzt** (ADR-011, bestätigt am
        2026-10-21).

        **Bezugszeitstempel je Operation:** im **Zustellprotokoll**
        (`GET /api/v1/deliveries`) der **Anlegezeitpunkt** des Zustelllaufs
        (`created_at` — derselbe Schlüssel wie die Sortierung, ADR-017 §4, V-40);
        in der **Totenliste** (`GET /api/v1/dead-deliveries`) der
        **Aufgabezeitpunkt** (`abandoned_at`); in den **Kennzahlen**
        (`GET /api/v1/endpoints/{endpointId}/metrics`) der **Beginn des
        Auswertungsfensters**.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: >-
        Ende des Zeitraums (UTC, RFC 3339), exklusive. **Ohne `from`/`to` gilt
        das Vorgabefenster: die letzten 7 Tage bis jetzt** (ADR-011, bestätigt am
        2026-10-21).

        **Bezugszeitstempel je Operation:** im **Zustellprotokoll**
        (`GET /api/v1/deliveries`) der **Anlegezeitpunkt** des Zustelllaufs
        (`created_at` — derselbe Schlüssel wie die Sortierung, ADR-017 §4, V-40);
        in der **Totenliste** (`GET /api/v1/dead-deliveries`) der
        **Aufgabezeitpunkt** (`abandoned_at`); in den **Kennzahlen**
        (`GET /api/v1/endpoints/{endpointId}/metrics`) das **Ende des
        Auswertungsfensters**.
      schema:
        type: string
        format: date-time
    StatusFilter:
      name: status
      in: query
      required: false
      description: "Filter auf den Endpunktstatus."
      schema:
        type: array
        items:
          $ref: "#/components/schemas/EndpointStatus"
      style: form
      explode: false
      example: active

  headers:
    RetryAfter:
      description: "Wartezeit in Sekunden bis zum nächsten erlaubten Versuch."
      schema:
        type: integer
        minimum: 1

  responses:
    MalformedRequest:
      description: "Syntaxfehler in der Anfrage (z. B. ungültiges JSON)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/malformed-request
            title: Malformed request
            status: 400
            code: malformed_request
            detail: "Der Request-Body ist kein gültiges JSON."
            instance: /api/v1/events
    Unauthorized:
      description: "Kein oder ungültiges Token."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/unauthorized
            title: Unauthorized
            status: 401
            code: unauthorized
            detail: "Das Bearer-Token fehlt oder ist ungültig."
            instance: /api/v1/endpoints
    Forbidden:
      description: >-
        Angemeldet, aber die Rolle darf die Operation nicht ausführen. Die
        Ressource gehört dem **eigenen** Mandanten — ein **fremder** Mandant
        ergibt **404**, nicht 403 (D-02, ADR-015 §3, V-39).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/forbidden
            title: Forbidden
            status: 403
            code: forbidden
            detail: "Diese Rolle darf die Operation für diesen Mandanten nicht ausführen."
            instance: /api/v1/dead-deliveries
    NotFound:
      description: >-
        Die Ressource existiert nicht oder gehört einem **fremden** Mandanten —
        für diesen Mandanten ist sie nicht sichtbar (D-02). Geprüft wird **zuerst
        der Mandant**, **danach die Rolle** (ADR-015 §3, V-39).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/not-found
            title: Not found
            status: 404
            code: not_found
            detail: "Die Ressource wurde nicht gefunden."
            instance: /api/v1/endpoints/8f1c2f0e-2f4a-4a0e-9d5b-6a1c2e3f4a5b
    IdempotencyConflict:
      description: >-
        Der Idempotenzschlüssel existiert im Mandanten bereits, aber mit
        **abweichender** Nutzlast (D-05).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/idempotency-conflict
            title: Idempotency conflict
            status: 409
            code: idempotency_conflict
            detail: "Der Idempotenzschlüssel wurde bereits mit einer abweichenden Nutzlast verwendet."
            instance: /api/v1/events
    DeliveryStateConflict:
      description: "Der Zustelllauf ist in einem Zustand, in dem die Operation nicht zulässig ist (z. B. Replay einer nicht aufgegebenen Zustellung)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/delivery-state-conflict
            title: Delivery state conflict
            status: 409
            code: delivery_state_conflict
            detail: "Nur aufgegebene Zustellungen können erneut ausgelöst werden."
            instance: /api/v1/deliveries/7d2b1c9a-5e6f-4a0b-8c7d-1e2f3a4b5c6d/replay
    PayloadTooLarge:
      description: "Die Nutzlast überschreitet 1.048.576 Byte (NFR-001, D-13)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/payload-too-large
            title: Payload too large
            status: 413
            code: payload_too_large
            detail: "Die Nutzlast beträgt 1048577 Byte; erlaubt sind höchstens 1048576 Byte."
            instance: /api/v1/events
    ValidationFailed:
      description: >-
        **Semantisch** ungültige Anfrage (HTTP 422). Die Grenze zu **400**
        (`malformed_request`): 400 bedeutet *syntaktisch* fehlerhaft — der Body
        ist kein gültiges JSON. **Jede** Abweichung vom **Schema** des
        Request-Bodys (unbekanntes Feld, falscher Typ, fehlendes Pflichtfeld)
        ist **422** — sie wird **nicht** stillschweigend ignoriert.

        Zwei `code`-Werte, die der Aufrufer unterscheiden muss:

        | `code` | Wann |
        |---|---|
        | `validation_failed` | das Feld verletzt das Schema des Request-Bodys — `violations` nennt den Feldverstoß |
        | `tenant_parameter_rejected` | ein **Mandantenparameter** (`organisation_id`) wurde im Body, im Query oder im Header mitgeschickt (D-01, AC-001-5, AC-004-4) |
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationFailedProblem"
              - $ref: "#/components/schemas/TenantParameterRejected"
          examples:
            validation_failed:
              summary: Das Feld verletzt das Schema des Request-Bodys.
              value:
                type: https://echobox.example/errors/validation-failed
                title: Validation failed
                status: 422
                code: validation_failed
                detail: "Die Anfrage ist semantisch ungültig."
                instance: /api/v1/endpoints
                violations:
                  - field: target_url
                    code: scheme_not_allowed
                    message: "Die Ziel-URL muss das Schema https verwenden."
            tenant_parameter_rejected:
              summary: Ein Mandantenparameter wurde mitgeschickt.
              value:
                type: https://echobox.example/errors/tenant-parameter-rejected
                title: Tenant parameter rejected
                status: 422
                code: tenant_parameter_rejected
                detail: "Der Mandant stammt aus der Identität; ein Mandantenparameter wird nicht akzeptiert."
                instance: /api/v1/endpoints
                violations:
                  - field: organisation_id
                    code: tenant_parameter_not_allowed
                    message: "Der Mandant darf nicht mitgeschickt werden."
    RateLimitExceeded:
      description: "Das Anfragelimit der API ist überschritten (nicht das Endpunkt-Limit aus FR-033)."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/rate-limit-exceeded
            title: Too many requests
            status: 429
            code: rate_limit_exceeded
            detail: "Zu viele Anfragen. Bitte später erneut versuchen."
            instance: /api/v1/events
    InternalError:
      description: "Unerwarteter Fehler. Es werden keine internen Details preisgegeben."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/internal-error
            title: Internal server error
            status: 500
            code: internal_error
            detail: "Die Anfrage konnte nicht verarbeitet werden."
            instance: /api/v1/events
    ServiceUnavailable:
      description: >-
        Der Dienst ist vorübergehend nicht bereit — der **nicht bereite**
        Zustand der Readiness-Prüfung (`GET /health/ready`). Er wird **nicht**
        als Readiness-Bericht, sondern mit diesem **Fehlerschema** beantwortet
        (ADR-015 §4, V-41).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/service-unavailable
            title: Service unavailable
            status: 503
            code: service_unavailable
            detail: "Der Dienst ist derzeit nicht bereit."
            instance: /api/v1/events

  schemas:

    # ------------------------------------------------------------- Fehlerformat
    Problem:
      type: object
      description: >-
        Einheitliches Fehlerschema für **alle** Fehlerantworten
        (RFC-7807-artig). Das Feld `code` ist der maschinenlesbare
        Schlüssel; `type` ist die stabile, dokumentierte Fehlerklasse.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: "Stabile URI der Fehlerklasse."
          example: https://echobox.example/errors/validation-failed
        title:
          type: string
          description: "Kurze, nichttechnische Überschrift."
          example: Validation failed
        status:
          type: integer
          description: "HTTP-Statuscode, identisch mit dem Response-Status."
          example: 422
        code:
          type: string
          description: "Maschinenlesbarer Fehlercode."
          enum:
            - malformed_request
            - unauthorized
            - forbidden
            - not_found
            - idempotency_conflict
            - delivery_state_conflict
            - payload_too_large
            - validation_failed
            - tenant_parameter_rejected
            - rate_limit_exceeded
            - internal_error
            - service_unavailable
        detail:
          type: string
          nullable: true
          description: "Was zu tun ist — nicht nur, was schiefging."
          example: "Die Ziel-URL muss das Schema https verwenden."
        instance:
          type: string
          nullable: true
          description: "Pfad der Anfrage."
          example: /api/v1/endpoints
        violations:
          type: array
          nullable: true
          description: >-
            Feldbezogene Verstoesse — bei `validation_failed` **und** bei
            `tenant_parameter_rejected` (beide 422-Codes nennen den Feldverstoß).
          items:
            $ref: "#/components/schemas/ValidationViolation"

    ValidationViolation:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: "Das betroffene Feld (Feldname, z. B. `target_url`)."
          example: target_url
        code:
          type: string
          description: "Maschinenlesbarer Verstoßcode."
          example: scheme_not_allowed
        message:
          type: string
          description: "Verständliche Meldung für den Aufrufer."
          example: "Die Ziel-URL muss das Schema https verwenden."

    ValidationFailedProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          description: >-
            **422 `validation_failed`** — das Feld verletzt das **Schema** des
            Request-Bodys (unbekanntes Feld, falscher Typ, fehlendes
            Pflichtfeld). Der Feldverstoß steht in `violations`. Die Abweichung
            wird **nicht** stillschweigend ignoriert.
          required: [code]
          properties:
            code:
              type: string
              enum: [validation_failed]

    TenantParameterRejected:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          description: >-
            **422 `tenant_parameter_rejected`** — ein **Mandantenparameter**
            (`organisation_id`) wurde im Body, im Query oder im Header
            mitgeschickt. Der Mandant stammt ausschließlich aus der Identität
            (D-01); ein mitgelieferter Mandantenparameter wird **nicht**
            stillschweigend ignoriert (AC-001-5, AC-004-4).
          required: [code]
          properties:
            code:
              type: string
              enum: [tenant_parameter_rejected]

    # ------------------------------------------------------------------- Aufzählungen
    EndpointStatus:
      type: string
      description: "Zustand eines Endpunkts."
      enum: [active, paused]

    EventStatus:
      type: string
      description: >-
        Zustand eines Ereignisses. `no_subscriber` bedeutet: angenommen und
        gespeichert, aber **kein** Endpunkt hat den Ereignistyp abonniert — der
        Zustand ist sichtbar, damit nichts still verschwindet (D-04).
      enum: [accepted, no_subscriber]

    DeliveryStatus:
      type: string
      description: >-
        Zustand eines Zustelllaufs. `pending` = angelegt, **noch kein Versuch
        ausgeführt** — das ist der Ausgangszustand eines **neuen** Laufs (auch
        nach einem Replay); `scheduled` = ein Versuch läuft gerade oder ist
        terminiert. `sent` = erfolgreich zugestellt, `failed` = der letzte
        Versuch ist fehlgeschlagen, ein weiterer ist nach dem Backoff geplant
        (ADR-008), `abandoned` = nach erschöpften Versuchen aufgegeben (tote
        Zustellung),
        `rejected` = vom Empfänger endgültig abgelehnt, `cancelled` = durch
        Pause abgebrochen, `delayed` = durch das Endpunkt-Limit verschoben,
        `no_subscriber` = Ereignis ohne Abnehmer.
      enum:
        - pending
        - scheduled
        - delayed
        - sent
        - failed
        - abandoned
        - rejected
        - cancelled
        - no_subscriber

    DeadDeliveryStatus:
      type: string
      description: >-
        Zustand einer **toten Zustellung**. Die Totenliste enthält
        **ausschließlich aufgegebene Zustellungen** — einen Zustelllauf, dessen
        Versuchsgrenze erreicht wurde (`abandoned_at` gesetzt). Endgültig
        beendete, aber **nicht** aufgegebene Zustellungen (vom Empfänger
        abgelehnt, durch Pause abgebrochen) sind **keine** toten Zustellungen;
        sie stehen im Zustellprotokoll (`GET /api/v1/deliveries`).
      enum:
        - abandoned

    AttemptOutcome:
      type: string
      description: >-
        Ergebnis eines einzelnen HTTP-Versuchs. **Trennlinie:** `timeout` = der
        **Verbindungs-Timeout** (5 s) oder der **Lese-Timeout** (10 s) hat
        ausgelöst; `network_error` = DNS-, TLS- oder Verbindungsfehler **ohne**
        Timeout. Beide Outcomes führen zum selben Verhalten (Wiederholung nach
        Backoff), werden im Protokoll aber **unterschiedlich** ausgewiesen
        (AC-011-3, FR-030). `client_error` erfasst auch eine **3xx**-Antwort
        (kein Wiederholen, ADR-009).
      enum:
        - success
        - retryable_failure
        - permanent_rejection
        - client_error
        - network_error
        - timeout
        - cancelled

    RejectionReason:
      type: string
      nullable: true
      description: >-
        Grund der endgültigen Ablehnung. `null`, wenn der Lauf **nicht**
        abgelehnt wurde — das Feld ist dann ohne Aussage.
      enum:
        - permanent_rejection
        - client_error

    # ------------------------------------------------------------------- Endpunkt
    EndpointCreateRequest:
      type: object
      additionalProperties: false
      required: [target_url, secret, event_types]
      properties:
        target_url:
          type: string
          format: uri
          maxLength: 2000
          description: >-
            Ziel-URL des Empfängers. **Muss** das Schema `https` tragen. Eingebettete
            Zugangsdaten (`https://user:pass@host/`) sind **verboten** — Zugangsdaten
            laufen ausschließlich über das Secret.
          example: https://orders.example.invalid/hooks/echobox
        secret:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
          description: >-
            Gemeinsames Secret des Endpunkts. Wird verschlüsselt abgelegt und
            **nie** im Klartext ausgegeben (AC-001-4). Mindestlänge 16 Zeichen.
          example: s3cr3t-rotationswert
        event_types:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: "Die Ereignistypen, die der Endpunkt abonniert."
          items:
            type: string
            minLength: 1
            maxLength: 200
          example: [order.changed, order.cancelled]
      x-validation-rules:
        - id: target_url_https_only
          description: "Nur `https` ist erlaubt (AC-001-2). Verstoß → HTTP 422."
        - id: target_url_no_credentials
          description: "Keine eingebetteten Zugangsdaten (AC-001-3). Verstoß → HTTP 422."
        - id: no_tenant_parameter
          description: "Ein `organisation_id` (oder jeder andere Mandantenparameter) im Body wird mit HTTP 422 abgelehnt (AC-001-5, D-01)."

    EndpointUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        target_url:
          type: string
          format: uri
          maxLength: 2000
          description: "Neue Ziel-URL. Gleiche Validierung wie bei der Registrierung."
        event_types:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: "Neue Liste der abonnierten Ereignistypen."
          items:
            type: string
            minLength: 1
            maxLength: 200
      x-validation-rules:
        - id: no_tenant_parameter
          description: "Ein `organisation_id` (oder jeder andere Mandantenparameter) im Body wird mit HTTP 422 `tenant_parameter_rejected` abgelehnt (D-01)."

    Endpoint:
      type: object
      description: >-
        Ein registrierter Empfänger. Das Secret wird **nie** ausgegeben;
        `secret_version` und `secret_rotated_at` zeigen nur den Zustand der
        Rotation (AC-001-4).
      required:
        - endpoint_id
        - organisation_id
        - target_url
        - status
        - event_types
        - secret_version
        - created_at
        - updated_at
      properties:
        endpoint_id:
          type: string
          format: uuid
        organisation_id:
          type: string
          description: >-
            Der **besitzende Mandant** der Ressource — **immer** gefüllt: im
            eigenen Mandanten der eigene Mandant, in der mandantenübergreifenden
            Sicht (`service_admin`) der Mandant, zu dem der Endpunkt gehört
            (E-01).
        target_url:
          type: string
          format: uri
        status:
          $ref: "#/components/schemas/EndpointStatus"
        event_types:
          type: array
          items:
            type: string
        secret_version:
          type: integer
          format: int32
          minimum: 1
          description: "Nummer der Secret-Generation (Startwert 1)."
        secret_rotated_at:
          type: string
          format: date-time
          nullable: true
        paused_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EndpointList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Endpoint"
        page:
          $ref: "#/components/schemas/Page"

    SecretRotationRequest:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
          description: "Das neue Secret. Ab dem nächsten Zustellversuch gilt ausschließlich dieses Secret."
          example: neues-s3cr3t-rotationswert
      x-validation-rules:
        - id: no_tenant_parameter
          description: "Ein `organisation_id` (oder jeder andere Mandantenparameter) im Body wird mit HTTP 422 `tenant_parameter_rejected` abgelehnt (D-01)."

    SecretRotationResponse:
      type: object
      required: [endpoint_id, secret_version, rotated_at, rotated_by]
      properties:
        endpoint_id:
          type: string
          format: uuid
        secret_version:
          type: integer
          format: int32
          minimum: 2
        rotated_at:
          type: string
          format: date-time
        rotated_by:
          type: string
          description: "Identität der auslösenden Rolle (Audit)."

    # ------------------------------------------------------------------- Ereignis
    EventIntakeRequest:
      type: object
      additionalProperties: false
      required: [event_type, idempotency_key]
      description: >-
        Einlieferung eines Ereignisses. **Genau eine** der Eigenschaften
        `payload` und `payload_base64` muss gesetzt sein. Ein `payload: null`
        verletzt das Schema (HTTP 422 `validation_failed`) und gilt **nicht**
        als gesetzt.

        `payload` nimmt einen beliebigen JSON-Wert entgegen; der Dienst
        materialisiert ihn **kanonisch** (RFC 8785, UTF-8, sortierte
        Schlüssel, ohne bedeutungslose Leerzeichen) und stellt **genau diese
        Bytes** zu. `payload_base64` erlaubt eine bytegenaue Übernahme.

        Bei `payload_encoding = pre_encrypted` ist `payload_base64` **Pflicht**
        und `payload` **verboten** — eine als verschlüsselt gekennzeichnete
        Einlieferung mit erkennbarer Klartextnutzlast wird mit HTTP 422
        abgelehnt (AC-008-2).
      properties:
        event_type:
          type: string
          minLength: 1
          maxLength: 200
          description: "Ereignistyp. Bestimmt, welche Endpunkte zustellen."
          example: order.changed
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Idempotenzschlüssel. Gültigkeitsbereich ist das Paar (Mandant,
            Schlüssel) (D-05).
          example: order-4711-changed-2026-10-21T09:00:00Z
        payload:
          nullable: false
          description: >-
            Nutzlast als JSON-Wert. Nicht gleichzeitig mit `payload_base64`
            setzen; `null` ist hier **nicht** erlaubt (HTTP 422) — das Feld gilt
            nur dann als gesetzt, wenn es einen Wert trägt. Die **zugestellten
            Bytes** sind die **kanonisch materialisierten** Bytes dieses Wertes
            (RFC 8785) — nicht der Rohtext, den der Aufrufer gesendet hat.
          example:
            order_id: 4711
            state: shipped
        payload_base64:
          type: string
          contentEncoding: base64
          description: >-
            Nutzlast als Base64 — für bytegenaue Übernahme, insbesondere bei
            vorverschlüsselten Ereignissen. Nicht gleichzeitig mit `payload`
            setzen. Die **zugestellten Bytes** sind die **exakt gelieferten**
            (dekodierten) Bytes. Die Base64-Länge ist rund **1,4-mal** so groß
            wie die Nutzlast — die Grenze von 1.048.576 Byte betrifft die
            **Nutzlastbytes**, nicht den Request-Body.
          example: T1AtU0VDUkVULVBBWUxPQURfQkFTRTY0
        payload_encoding:
          type: string
          enum: [plaintext, pre_encrypted]
          default: plaintext
          description: >-
            `plaintext` = der Dienst verschlüsselt die Nutzlast selbst
            (FR-012). `pre_encrypted` = die Bytes sind bereits verschlüsselt
            und werden **unverändert** gespeichert und zugestellt; vor der
            Zustellung findet **kein** Entschlüsseln statt (FR-013).
        payload_media_type:
          type: string
          default: application/json
          maxLength: 100
          description: "Medientyp der Nutzlast. Wird als `Content-Type` der Zustellung gesetzt."
      x-validation-rules:
        - id: exactly_one_payload
          description: "Genau eine von `payload` / `payload_base64` muss vorhanden sein. `payload: null` verletzt das Schema (HTTP 422 `validation_failed`) und gilt **nicht** als gesetzt. Verstoß → HTTP 422."
        - id: pre_encrypted_requires_base64
          description: "`payload_encoding = pre_encrypted` erfordert `payload_base64` und verbietet `payload`. Verstoß → HTTP 422 (AC-008-2)."
        - id: payload_size_limit
          description: "Die Nutzlastbytes dürfen höchstens 1048576 Byte betragen. Verstoß → HTTP 413 (AC-005-2, AC-005-3, NFR-001). Die Grenze betrifft die Nutzlastbytes, **nicht** den Request-Body (base64 ⇒ rund 1,4×); der Request-Body darf bis 2 MiB groß sein."
        - id: no_tenant_parameter
          description: "Ein `organisation_id` (oder jeder andere Mandantenparameter) im Body wird mit HTTP 422 `tenant_parameter_rejected` abgelehnt (D-01)."

    EventIntakeResponse:
      type: object
      required: [event_id, event_type, idempotency_key, status, idempotent_replay, accepted_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: "Kennung des Ereignisses. Bei einer idempotenten Wiederholung die Kennung des **ersten** Ereignisses (AC-006-1)."
        event_type:
          type: string
        idempotency_key:
          type: string
        status:
          $ref: "#/components/schemas/EventStatus"
        idempotent_replay:
          type: boolean
          description: >-
            `true`, wenn die Einlieferung eine Wiederholung unter demselben
            Idempotenzschlüssel war. Die erste Nutzlast bleibt unverändert
            (AC-006-2).
        subscribed_endpoint_count:
          type: integer
          minimum: 0
          description: "Zahl der Endpunkte, die den Ereignistyp abonniert haben. 0 ⇒ Status `no_subscriber` (D-04)."
        payload_size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Größe der **Nutzlastbytes des Ereignisses** — bei `payload` der
            **kanonisch materialisierten** Bytes (im Beispiel 35 Byte), bei
            `payload_base64` der dekodierten Bytes. Das ist zugleich die
            Nutzlast, die **zugestellt** wird.
        accepted_at:
          type: string
          format: date-time

    Event:
      type: object
      description: >-
        Metadaten eines Ereignisses. Die **Nutzlast wird nie ausgegeben** —
        sie ist im Ruhezustand verschlüsselt (FR-012). Ein **markiertes**
        Ereignis (Aufbewahrung) ist **sofort unsichtbar** und wird mit
        **HTTP 404** beantwortet (ADR-012 §3) — die Antwort trägt deshalb
        **keinen** Aufbewahrungsmarker (V-43).
      required: [event_id, event_type, idempotency_key, status, payload_encoding, payload_media_type, payload_size_bytes, accepted_at, created_at, updated_at]
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        idempotency_key:
          type: string
        status:
          $ref: "#/components/schemas/EventStatus"
        payload_encoding:
          type: string
          enum: [plaintext, pre_encrypted]
        payload_media_type:
          type: string
          description: >-
            Medientyp der Nutzlast — **immer** gefüllt (Vorgabe
            `application/json`); er wird als `Content-Type` der Zustellung
            gesetzt.
        payload_size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Größe der **Nutzlastbytes des Ereignisses** — bei `payload` der
            **kanonisch materialisierten** Bytes, bei `payload_base64` der
            dekodierten Bytes. Das ist zugleich die Nutzlast, die
            **zugestellt** wird.
        subscribed_endpoint_count:
          type: integer
          minimum: 0
        accepted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ------------------------------------------------------------------ Zustellung
    DeliveryRun:
      type: object
      description: >-
        Ein Zustelllauf: das Zustellprotokoll **eines** Ereignisses an
        **einem** Endpunkt. Die Versuche selbst stehen in
        `DeliveryRunDetail.attempts`.
      required:
        - delivery_run_id
        - event_id
        - organisation_id
        - event_type
        - status
        - attempt_count
        - created_at
        - updated_at
      properties:
        delivery_run_id:
          type: string
          format: uuid
          description: "Zustelllauf-ID. Ein Replay erzeugt eine **neue** ID (D-06)."
        replay_of:
          type: string
          format: uuid
          nullable: true
          description: >-
            Zustelllauf-ID des **Vorgängers**, wenn dieser Lauf ein Replay ist.
            `null`, wenn der Lauf **kein** Replay ist (AC-013-2). Die
            Replay-Historie bleibt am Lauf sichtbar.
        event_id:
          type: string
          format: uuid
        endpoint_id:
          type: string
          format: uuid
          nullable: true
          description: "`null` bei `no_subscriber` — es gibt keinen Endpunkt."
        organisation_id:
          type: string
          description: >-
            Der **besitzende Mandant** der Ressource — **immer** gefüllt: im
            eigenen Mandanten der eigene Mandant, in der mandantenübergreifenden
            Sicht der Mandant, zu dem der Zustelllauf gehört (E-01). Im
            Zustellprotokoll — das **mandantengefiltert** ist und auch dem
            `service_admin` nur die Läufe des Mandanten aus der Identität zeigt
            (E-10) — ist das der Mandant aus der Identität. Es ist **kein**
            Filter (D-01).
        event_type:
          type: string
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        attempt_count:
          type: integer
          format: int32
          minimum: 0
          description: "Anzahl der bereits ausgeführten Versuche (FR-030)."
        max_attempts:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: >-
            Konfigurierte Versuchsgrenze dieses Laufs. Vorgabewert **8**
            (bestätigt am 2026-10-21, F-04); beim Anlegen des Laufs
            festgeschrieben. `null`, wenn keine Grenze gesetzt ist.
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: "Zeitpunkt des letzten Versuchs (FR-030)."
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Nächster Versuchszeitpunkt. **Leer** bei endgültigen Zuständen
            (`sent`, `abandoned`, `rejected`, `cancelled`, `no_subscriber`) — es
            wird kein Zeitpunkt in der Vergangenheit oder in der Zukunft
            angezeigt (AC-015-2).
        last_response_status:
          type: integer
          nullable: true
          description: "HTTP-Statuscode der Antwort des Empfängers im letzten Versuch (FR-030)."
        last_error_code:
          type: string
          nullable: true
          description: "Fehlercode des letzten Versuchs, z. B. `connection_refused`, `read_timeout`."
        rejection_reason:
          $ref: "#/components/schemas/RejectionReason"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeliveryAttempt:
      type: object
      required: [attempt_id, delivery_run_id, attempt_number, started_at, outcome]
      properties:
        attempt_id:
          type: string
          format: uuid
          description: "Versuchs-ID — für jeden HTTP-Versuch eindeutig (D-06)."
        delivery_run_id:
          type: string
          format: uuid
        attempt_number:
          type: integer
          format: int32
          minimum: 1
          description: "Versuchsnummer innerhalb des Zustelllaufs (1-basiert)."
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        response_status:
          type: integer
          nullable: true
          description: "HTTP-Statuscode der Antwort des Empfängers, `null` bei Transportfehlern."
        outcome:
          $ref: "#/components/schemas/AttemptOutcome"
        error_code:
          type: string
          nullable: true
          description: "Fehlercode bei Transportfehlern, z. B. `connection_refused`, `read_timeout`, `dns_error`."
        next_attempt_at:
          type: string
          format: date-time
          nullable: true

    DeliveryRejection:
      type: object
      description: >-
        Das exakte Format des **Ablehnungssignals**, mit dem der Empfaenger
        signalisiert, dass er das Ereignis dauerhaft nicht moechte (FR-025).
        Der Dienst beendet die Zustellung daraufhin sofort ohne weitere
        Versuche (D-08).
      required: [rejection, reason]
      properties:
        rejection:
          type: string
          enum: [permanent]
          description: "Kennzeichnet die Ablehnung als dauerhaft."
          example: permanent
        reason:
          type: string
          maxLength: 100
          description: "Maschinenlesbarer Ablehnungsgrund."
          example: event_type_not_subscribed
        message:
          type: string
          nullable: true
          maxLength: 500
          description: "Optionaler Klartext fuer das Protokoll."
        rejected_event_types:
          type: array
          nullable: true
          description: "Ereignistypen, die der Empfaenger abgelehnt hat."
          items:
            type: string

    DeliveryRunDetail:
      allOf:
        - $ref: "#/components/schemas/DeliveryRun"
        - type: object
          required: [attempts]
          properties:
            attempts:
              type: array
              description: "Alle Versuche dieses Zustelllaufs, chronologisch."
              items:
                $ref: "#/components/schemas/DeliveryAttempt"

    DeliveryList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryRun"
        page:
          $ref: "#/components/schemas/Page"

    DeadDelivery:
      type: object
      description: >-
        Eine tote Zustellung — aufgegeben nach erschöpften Versuchen (FR-031).
        Sie ist **immer** ein aufgegebener Zustelllauf (`abandoned`); der
        Zeitpunkt der Aufgabe steht in `abandoned_at`.
      required:
        - delivery_run_id
        - event_id
        - organisation_id
        - endpoint_id
        - event_type
        - status
        - attempt_count
        - abandoned_at
      properties:
        delivery_run_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        organisation_id:
          type: string
          description: >-
            Der **besitzende Mandant** der Ressource — **immer** gefüllt: in der
            Totenliste der Mandant, zu dem die tote Zustellung gehört. Die
            Totenliste ist mandantenübergreifend und nur `service_admin`
            zugänglich (AC-016-1).
        endpoint_id:
          type: string
          format: uuid
        endpoint_url:
          type: string
          format: uri
          nullable: true
        event_type:
          type: string
        status:
          $ref: "#/components/schemas/DeadDeliveryStatus"
        attempt_count:
          type: integer
          format: int32
          minimum: 0
        last_response_status:
          type: integer
          nullable: true
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        abandoned_at:
          type: string
          format: date-time
          description: >-
            Zeitpunkt der **Aufgabe** — der Zeitpunkt, an dem die Versuchsgrenze
            erreicht wurde. **Immer** gefüllt (die Datenbank erzwingt das für
            jeden aufgegebenen Lauf).
        created_at:
          type: string
          format: date-time

    DeadDeliveryList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeadDelivery"
        page:
          $ref: "#/components/schemas/Page"

    ReplayRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
          description: "Freitextbegründung für das Audit-Protokoll."
      x-validation-rules:
        - id: no_tenant_parameter
          description: "Ein `organisation_id` (oder jeder andere Mandantenparameter) im Body wird mit HTTP 422 `tenant_parameter_rejected` abgelehnt (D-01)."

    ReplayResponse:
      type: object
      required: [previous_delivery_run_id, delivery_run_id, event_id, status, attempt_count]
      properties:
        previous_delivery_run_id:
          type: string
          format: uuid
          description: "Der aufgegebene Zustelllauf — bleibt im Protokoll unverändert erhalten (AC-013-2)."
        delivery_run_id:
          type: string
          format: uuid
          description: "Der **neue** Zustelllauf mit neuer ID und derselben Ereignis-ID (AC-013-5)."
        event_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        attempt_count:
          type: integer
          format: int32
          description: "Beginnt wieder bei 0; der erste Versuch hat die Nummer 1 (AC-013-1)."
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
        replayed_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------- Kennzahlen
    EndpointMetrics:
      type: object
      required: [endpoint_id, window, data_available, rate_limit]
      properties:
        endpoint_id:
          type: string
          format: uuid
        window:
          $ref: "#/components/schemas/MetricsWindow"
        data_available:
          type: boolean
          description: >-
            `false`, wenn im Fenster **kein** Zustellvorgang vorhanden ist. Dann
            sind `success_rate` und `delivery_latency_p95_ms` `null` — **nicht**
            0 % und **nicht** 100 % (AC-017-3).
        attempts_total:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        attempts_successful:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        success_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: "Erfolgreiche Versuche / alle Versuche im Fenster (FR-032)."
        delivery_latency_p95_ms:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: "p95 der Dauer von der Annahme bis zur erfolgreichen Antwort (FR-032)."
        rate_limit:
          $ref: "#/components/schemas/RateLimitObservation"

    MetricsWindow:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time

    RateLimitObservation:
      type: object
      description: >-
        Zählung der Zustellversuche je Endpunkt und Zeitfenster und der
        **wirksame** Grenzwert. Vorgabewert ist **60 Versuche je Endpunkt und
        Minute** mit Strategie `delay` (bestätigt am 2026-10-21, F-01);
        je Endpunkt überschreibbar (D-14). Es gibt **zwei** Zustände: kein
        Override (⇒ es gilt 60) und abgeschaltet (⇒ `limit: 0`,
        `limited: false`). Der Abschnitt ist **immer** Teil der Antwort — die
        Zählung läuft **unabhängig** vom Grenzwert (AC-018-4, V-42).
      required: [limit, limited, window_seconds, strategy, observed_attempts, delayed_attempts]
      properties:
        limit:
          type: integer
          minimum: 0
          description: >-
            Der **wirksame** Grenzwert je Endpunkt und Zeitfenster — **nie**
            `null`. Vorgabewert **60** (F-01); ein Endpunkt-Override
            (`limit_value`) ersetzt ihn. `limit: 0` bedeutet: die Begrenzung ist
            für diesen Endpunkt **abgeschaltet** (`limit_value = 0`).
        limited:
          type: boolean
          description: >-
            `false`, wenn die Begrenzung für diesen Endpunkt **abgeschaltet**
            ist — dann ist `limit: 0`. `true` bedeutet: es gilt ein wirksamer
            Grenzwert (`limit > 0`), auch dann, wenn der Wert aus der Vorgabe
            (60) kommt und **kein** Override gesetzt ist.
        window_seconds:
          type: integer
          minimum: 1
          description: "Länge des Zählfensters in Sekunden. Vorgabewert 60."
        strategy:
          type: string
          enum: [delay, block]
          description: "Angewandte Strategie bei Überschreitung."
        observed_attempts:
          type: integer
          format: int64
          minimum: 0
        delayed_attempts:
          type: integer
          format: int64
          minimum: 0
          description: "Zahl der durch das Limit verschobenen Versuche (AC-018-2)."

    # ----------------------------------------------------------------- Aufbewahrung
    RetentionEnforcementRequest:
      type: object
      additionalProperties: false
      properties:
        dry_run:
          type: boolean
          default: true
          description: >-
            `true` = nur zählen, nichts löschen. `false` = tatsächlich löschen.
            Standard ist `true`, damit ein versehentlicher Aufruf keine Daten
            verliert.
      x-validation-rules:
        - id: no_tenant_parameter
          description: "Ein `organisation_id` (oder jeder andere Mandantenparameter) im Body wird mit HTTP 422 `tenant_parameter_rejected` abgelehnt (D-01)."

    RetentionEnforcementResponse:
      type: object
      description: >-
        Ergebnis der Aufbewahrungsdurchsetzung. Die beiden Fristen sind
        **getrennt** für Ereignisse und für Zustellprotokolle (F-02) und
        beginnen **je Datensatz** am **Anker** (`last_attempt_at`; für
        Ereignisse ohne Versuch `accepted_at`).

        Die Zähler sind **nach Stufe** getrennt: `marked_*` zählt die in diesem
        Durchlauf **markierten** Datensätze (`deleted_at` gesetzt), `purged_*`
        die **physisch gelöschten**. Bei `dry_run: true` wird nichts geändert —
        die Zähler weisen dann die **vorgemerkten** Mengen aus.

        Die Fristen und Stichtage auf oberster Ebene sind die **kürzeste**
        angewandte Frist über alle Mandanten (der älteste Stichtag); je Mandant
        stehen die eigenen Fristen, Stichtage und Zählerstände in `tenants`.
        Ob ein Mandant eine **eigene** Frist hat oder die **Vorgabe** nutzt,
        steht je Datenart in `tenants[].event_retention_source` und
        `tenants[].delivery_retention_source`.
      required:
        - dry_run
        - scope
        - anchor
        - purge_delay_days
        - event_retention_days
        - delivery_retention_days
        - event_cutoff
        - delivery_cutoff
        - marked_events
        - marked_delivery_runs
        - marked_attempts
        - purged_events
        - purged_delivery_runs
        - purged_attempts
        - tenants
        - executed_at
      properties:
        dry_run:
          type: boolean
        scope:
          type: string
          enum: [all]
          description: >-
            **Geltungsbereich** der Durchsetzung: **alle** Mandanten. Die
            Operation ist mandantenübergreifend (FR-004, AC-016-5).
        anchor:
          type: string
          enum: [last_attempt_at]
          description: >-
            **Anker je Datensatz**: der **letzte Zustellversuch**. Für
            Ereignisse **ohne** Versuch gilt der Annahmezeitpunkt
            (`accepted_at`) (ADR-012 §2, F-02).
        purge_delay_days:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >-
            **Karenzzeit** zwischen der Stufe „Markieren" und der Stufe „Purge"
            in Tagen. Sie kommt aus der Betriebskonfiguration
            (`echobox.retention.purge-delay`) und ist **kein** im Vertrag
            verdrahteter Wert. **Ein Vorgabewert ist nicht festgelegt** — der
            Vertrag behauptet keinen (offener Punkt R-01: Fachbereich, Gate 2).
            `null`, wenn die Betriebskonfiguration keinen Wert setzt; wie lange
            ein markierter Datensatz ungelöscht bleibt, ist damit **nicht** Teil
            dieses Vertrags (ADR-012 §3, §6).
        event_retention_days:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: >-
            Angewandte Frist für Ereignisse in Tagen — die **kürzeste** über alle
            Mandanten. Vorgabewert **30** (bestätigt am 2026-10-21, F-02).
            `null`, wenn für **keinen** Mandanten eine Frist wirksam ist — dann
            wird nichts gelöscht.
        delivery_retention_days:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: >-
            Angewandte Frist für Zustellläufe, Versuche und Zähler in Tagen —
            die **kürzeste** über alle Mandanten. Vorgabewert **30** (F-02).
            `null`, wenn keine Frist wirksam ist.
        event_cutoff:
          type: string
          format: date-time
          nullable: true
          description: >-
            Stichtag für Ereignisse: Datensätze, deren **Anker** **vor** diesem
            Zeitpunkt liegt, werden markiert. `null`, wenn keine Frist wirksam
            ist.
        delivery_cutoff:
          type: string
          format: date-time
          nullable: true
          description: >-
            Stichtag für Zustellläufe und Versuche: Datensätze, deren **Anker**
            **vor** diesem Zeitpunkt liegt, werden markiert. `null`, wenn keine
            Frist wirksam ist.
        marked_events:
          type: integer
          format: int64
          minimum: 0
          description: "Ereignisse, die in diesem Durchlauf **markiert** wurden (`deleted_at` gesetzt)."
        marked_delivery_runs:
          type: integer
          format: int64
          minimum: 0
          description: "Zustellläufe, die in diesem Durchlauf **markiert** wurden."
        marked_attempts:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Versuche, die mit ihrem Zustelllauf **markiert** wurden — sie
            verlieren mit ihm die Sichtbarkeit.
        purged_events:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Datensätze, die in diesem Durchlauf **physisch gelöscht** wurden
            (Stufe „Purge", nach der Karenzzeit).
        purged_delivery_runs:
          type: integer
          format: int64
          minimum: 0
          description: "Zustellläufe, die in diesem Durchlauf **physisch gelöscht** wurden."
        purged_attempts:
          type: integer
          format: int64
          minimum: 0
          description: "Versuche, die in diesem Durchlauf **physisch gelöscht** wurden."
        tenants:
          type: array
          description: >-
            Je Mandant die **angewandten** Fristen, Stichtage und Zählerstände.
            `organisation_id` steht **im Datensatz**, damit der Client die
            Herkunft erkennt (AC-016-1).
          items:
            $ref: "#/components/schemas/TenantRetention"
        executed_at:
          type: string
          format: date-time

    TenantRetention:
      type: object
      description: >-
        Die Aufbewahrung **eines** Mandanten: die angewandten Fristen, die
        zugehörigen Stichtage und die Zählerstände je Stufe.

        Die Fristen sind **angewandte** Werte — der Mandant kann sie selbst
        gesetzt haben oder die Vorgabe nutzen. Welches von beiden gilt, steht
        je Datenart in `event_retention_source` und `delivery_retention_source`.
      required:
        - organisation_id
        - event_retention_days
        - event_retention_source
        - delivery_retention_days
        - delivery_retention_source
        - event_cutoff
        - delivery_cutoff
        - marked_events
        - marked_delivery_runs
        - marked_attempts
        - purged_events
        - purged_delivery_runs
        - purged_attempts
      properties:
        organisation_id:
          type: string
          description: "Mandant — **im Datensatz**, damit der Client die Herkunft erkennt (AC-016-1)."
        event_retention_days:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: >-
            Die **angewandte** Frist für Ereignisse in Tagen — der Wert, der
            tatsächlich gilt (Vorgabe **30** Tage, F-02, je Mandant
            überschreibbar). `null` bedeutet: es ist **keine** Frist wirksam
            (kein Override **und** keine Vorgabe) — dann wird nichts gelöscht.
        event_retention_source:
          type: string
          nullable: true
          enum: [tenant, default]
          description: >-
            Woher die angewandte Frist für Ereignisse stammt: `tenant` = der
            Mandant hat eine **eigene** Frist gesetzt; `default` = es gilt die
            **Vorgabe** (kein Override des Mandanten). `null`, wenn keine Frist
            wirksam ist — dann ist auch `event_retention_days` `null`.
        delivery_retention_days:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: >-
            Die **angewandte** Frist für Zustellprotokolle in Tagen (Vorgabe
            **30** Tage, F-02). `null` bedeutet: es ist **keine** Frist wirksam.
        delivery_retention_source:
          type: string
          nullable: true
          enum: [tenant, default]
          description: >-
            Woher die angewandte Frist für Zustellprotokolle stammt: `tenant` =
            der Mandant hat eine **eigene** Frist gesetzt; `default` = es gilt
            die **Vorgabe**. `null`, wenn keine Frist wirksam ist.
        event_cutoff:
          type: string
          format: date-time
          nullable: true
          description: "Stichtag für Ereignisse (Anker `last_attempt_at`). `null`, wenn keine Frist wirksam ist."
        delivery_cutoff:
          type: string
          format: date-time
          nullable: true
          description: "Stichtag für Zustellläufe und Versuche (Anker `last_attempt_at`). `null`, wenn keine Frist wirksam ist."
        marked_events:
          type: integer
          format: int64
          minimum: 0
        marked_delivery_runs:
          type: integer
          format: int64
          minimum: 0
        marked_attempts:
          type: integer
          format: int64
          minimum: 0
        purged_events:
          type: integer
          format: int64
          minimum: 0
        purged_delivery_runs:
          type: integer
          format: int64
          minimum: 0
        purged_attempts:
          type: integer
          format: int64
          minimum: 0

    # ------------------------------------------------------------------ Betrieb
    HealthStatus:
      type: object
      required: [status, service, version, checked_at]
      properties:
        status:
          type: string
          enum: [up]
        service:
          type: string
          example: echobox
        version:
          type: string
          example: 1.0.0
        checked_at:
          type: string
          format: date-time

    ReadinessStatus:
      type: object
      description: >-
        Bereitschaftsbericht des **bereiten** Zustands. Der Vertrag kennt nur
        **einen** beobachtbaren Wert: `status: ready` mit `checks.*: ok`. Der
        **nicht bereite** Zustand wird **nicht** als Readiness-Bericht
        geliefert, sondern als **HTTP 503** mit dem Fehlerschema `Problem`
        (`code: service_unavailable`) — für **alle** Fehlerantworten gilt
        **ein** Schema (ADR-015 §4, V-41).
      required: [status, checks, checked_at]
      properties:
        status:
          type: string
          enum: [ready]
          description: >-
            Im **HTTP 200** immer `ready` — der nicht bereite Zustand kommt als
            **503** mit `Problem`.
        checks:
          type: object
          description: >-
            Die Einzelprüfungen. Im **HTTP 200** sind sie alle `ok`; eine
            ausgefallene Prüfung führt zum **503** mit `Problem`.
          required: [database, delivery_worker, tenant_context]
          properties:
            database:
              type: string
              enum: [ok]
            delivery_worker:
              type: string
              enum: [ok]
            tenant_context:
              type: string
              enum: [ok]
        checked_at:
          type: string
          format: date-time

    # --------------------------------------------------------------------- Seite
    Page:
      type: object
      description: "Cursor-basierte Seitennavigation."
      required: [limit, has_more]
      properties:
        limit:
          type: integer
          minimum: 1
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
          description: "Cursor für die nächste Seite; `null` bei der letzten Seite."


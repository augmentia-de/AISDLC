        die Eindeutigkeit normalisiert, Duplikate innerhalb einer Organisation sind
        unmöglich. Max. 10 je Prompt, max. 200 je Organisation — Verletzung → `422` mit
        Nennung des Limits (AC-011-2, AC-011-3).


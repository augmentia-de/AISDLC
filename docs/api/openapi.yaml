# =============================================================================
# Vertragsweite Regeln
# =============================================================================
x-contract-rules:
  defaults:
    - "F-01 bis F-04 sind **Vorgaben der Betriebskonfiguration**, keine harten API-Grenzwerte; die Werte stehen in der Tabelle „Vorgabewerte“ in `info.description`."
    - "F-01: **zwei** Zustände — `limit_value IS NULL` = kein Override (⇒ es gilt die Vorgabe), `limit_value = 0` = abgeschaltet (⇒ `limit: 0`, `limited: false`); je Endpunkt überschreibbar."
    - "F-02: Fristbeginn **je Datensatz** = letzter Versuch (`last_attempt_at`, für Ereignisse ohne Versuch `accepted_at`); je Mandant überschreibbar. Zwei Stufen: **markieren**, dann **Purge** nach der Karenzzeit (`purge_delay_days`) — die **Karenzzeit ist konfigurierbar und hat keinen festgelegten Vorgabewert**. Das Löschen eines Ereignisses **nimmt seine Zustellläufe und Versuche mit**."
    - "F-03: Replay nur für den Empfänger-Admin des betroffenen Endpunkts; `developer` und `service_admin` erhalten HTTP 403 — **innerhalb des eigenen Mandanten**; ein Zustelllauf eines **fremden** Mandanten ergibt HTTP 404 (V-39)."
    - "F-04: Verdopplung mit voller Streuung; das Gesamtfenster bis zum letzten Versuch beträgt **≈ 2 Stunden**."
  tenant:
    - "Der Mandant stammt ausschließlich aus dem JWT-Claim `organisation_id` (D-01)."
    - "Ein Mandantenparameter (`organisation_id`) im Body, im Query oder im Header wird mit HTTP 422 (`tenant_parameter_rejected`) abgelehnt."
    - "Fremde Ressourcen werden mit HTTP 404 beantwortet (D-02) — **auch** für `service_admin`: der **Einzelabruf** einer Ressource eines fremden Mandanten endet mit 404 (V-27)."
    - "**Reihenfolge der Prüfungen: erst der Mandant, dann die Rolle.** Eine Ressource eines **fremden** Mandanten ergibt HTTP 404 — auch für `developer` und `service_admin`; die Rolle wird **erst** innerhalb des **eigenen** Mandanten geprüft und ergibt dort HTTP 403 (ADR-015 §3, V-39)."
    - "`service_admin` sieht alle Mandanten — über die schmalen Eigentümerfunktionen des Schemas (ADR-002 §7), **nicht** über eine Rolle mit `BYPASSRLS`. Die mandantenübergreifende Sicht gilt **nur** für die **drei** Listen-/Betriebsoperationen — Endpunktliste, Totenliste und Aufbewahrung (E-01); ein vierter mandantenübergreifender Leseweg wird **nicht** gebaut (V-27). `organisation_id` ist **immer** gefüllt und benennt den **besitzenden Mandanten** der Ressource — im eigenen Mandanten den eigenen, in den mandantenübergreifenden Antworten den Mandanten, zu dem der Datensatz gehört."
  roles:
    - "Die Rollenrechte stehen **vollständig** in der Rollenmatrix in `info.description` (Abschnitt „Rollen“) — normative Fassung: ADR-015 §1. Je Rolle und Recht: Endpunkte verwalten · Ereignisse einliefern · Secret rotieren · Zustellprotokoll lesen · Tote Zustellung erneut auslösen · Totenliste mandantenübergreifend · Kennzahlen · Aufbewahrung erzwingen."
    - "Der `service_admin` verwaltet Endpunkte **nur im eigenen Mandanten** (wie `receiver_admin`), liefert **keine** Ereignisse ein (FR-010), rotiert **kein** Secret und löst **keine** tote Zustellung erneut aus (F-03); seine mandantenübergreifende Sicht gilt **nur** für Endpunktliste, Totenliste und Aufbewahrung (E-01, V-27)."
    - "**Reihenfolge der Prüfungen: erst der Mandant, dann die Rolle** — eine Ressource eines **fremden** Mandanten ergibt HTTP 404 (auch für `service_admin`, V-27), eine Ressource des **eigenen** Mandanten ohne die nötige Rolle ergibt HTTP 403 (V-39, ADR-015 §3)."
  errors:
    - "Alle Fehlerantworten nutzen das Schema `Problem` mit `Content-Type: application/problem+json`."
    - "Die Grenze zwischen **400** (syntaktisch fehlerhaft) und **422** (semantisch ungültig) sowie die Zuordnung Status → `code` stehen im Abschnitt „Fehlersemantik“ in `info.description`."
    - "500-Antworten enthalten weder Stacktrace noch interne Kennungen."
  idempotency:
    - "Der Idempotenzschlüssel gilt je (Mandant, Schlüssel) (D-05)."
    - "Gleiche Nutzlast → HTTP 202 mit `idempotent_replay: true` und der Kennung des ersten Ereignisses."
    - "Abweichende Nutzlast → HTTP 409 (`idempotency_conflict`)."
  pagination:
    - "Alle Listen: `limit` (Default 50, max 200) + `cursor`; Antwort unter `page`. Sortierung, Cursor-Semantik und mandantenübergreifende Listen: siehe Abschnitt „Pagination“ in `info.description`."
    - "Die Filter sind kombinierbar; ein ungültiger Cursor wird mit HTTP 422 abgelehnt."
  delivery:
    - "Der ausgehende Zustellvertrag ist in `x-delivery-protocol` beschrieben und eingefroren."
    - "Änderungen an Signaturverfahren, Header-Namen oder Ablehnungssignal sind breaking changes → neue Hauptversion."

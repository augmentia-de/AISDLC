          description: "Opaques Continuation-Token für die nächste Seite (entspricht `page + 1`). Clients behandeln es als opak; die Navigation im Vertrag bleibt über `page`."

    PagedFindings:
      type: object
      description: "Seite der Fundstellen eines Prüflaufs (FR-037)."
      required: ["items", "page", "size", "totalElements", "totalPages", "hasMore"]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScanFinding"
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: "Gesamtzahl der **gefilterten** Fundstellen der eigenen Organisation."
        totalPages:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
          description: "Weitere Seiten vorhanden."
        nextCursor:
          type: string
          nullable: true
          description: "Opaques Continuation-Token für die nächste Seite (entspricht `page + 1`)."

    AssignTagsRequest:
      type: object
      description: "Tag-Menge eines Prompts. Maximal 10 Tags (FR-015)."
      required: ["tags"]
      properties:
        tags:
          type: array
          maxItems: 10
          description: "Freitext-Tags; die Normalisierung erfolgt serverseitig (lower-case)."
          items:
            type: string
            minLength: 1
            maxLength: 60
      example:
        tags: ["Support", "deutsch"]

    RetentionRun:
      type: object
      description: "Ein Lauf des Aufbewahrungsjobs (FR-060, US-028)."
      required: ["id", "status", "startedAt", "triggeredBy"]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: ["RUNNING", "SUCCEEDED", "FAILED"]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        deletedCounts:
          $ref: "#/components/schemas/RetentionDeletedCounts"
        error:
          type: string
          nullable: true
          description: "Technische Fehlermeldung ohne Inhalt."
        triggeredBy:
          type: string
          description: "Auslöser des Laufs — Zeitplan oder manueller Aufruf."
          example: "schedule"

    RetentionDeletedCounts:
      type: object
      description: "Gelöschte Mengen je Objektklasse eines Laufs — aggregiert, ohne Inhalt."
      properties:
        auditEvents:
          type: integer
          minimum: 0
        notificationDeliveries:
          type: integer
          minimum: 0
        transferAudits:
          type: integer
          minimum: 0
        rawPayloads:
          type: integer
          minimum: 0
        refreshTokens:
          type: integer
          minimum: 0

    PagedRetentionRuns:
      type: object
      required: ["items", "page", "size", "totalElements", "totalPages", "hasMore"]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RetentionRun"
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 200
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true

    TriggerRetentionRequest:
      type: object
      description: "Optionale Steuerung eines manuellen Aufbewahrungslaufs."
      properties:
        dryRun:
          type: boolean
          default: false
          description: "Wenn `true`, wird nichts gelöscht, sondern nur die Mengen berechnet (Nachweis)."

    QualityGateAttestation:
      type: object
      description: "Von der CI gemeldeter Qualitätsnachweis (FR-073, US-031)."
      required: ["commitSha", "threshold", "backendCoverage", "frontendCoverage", "status", "reportedAt"]
      properties:
        commitSha:
          type: string
          minLength: 7
          maxLength: 64
        pipelineUrl:
          type: string
          maxLength: 500
        threshold:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: "Harte Schwelle des Gates (F9: 80 % Line Coverage)."
        backendCoverage:
          type: number
          format: float
          minimum: 0
          maximum: 100
        frontendCoverage:
          type: number
          format: float
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: ["PASSED", "FAILED"]
        reportedAt:
          type: string
          format: date-time

    QualityGateReportRequest:
      type: object
      description: "Einreichung des Qualitätsnachweises durch die CI-Pipeline."
      required: ["commitSha", "threshold", "backendCoverage", "frontendCoverage", "status"]
      properties:
        commitSha:
          type: string
          minLength: 7
          maxLength: 64
        pipelineUrl:
          type: string
          maxLength: 500
        threshold:
          type: number
          format: float
          minimum: 0
          maximum: 100
        backendCoverage:
          type: number
          format: float
          minimum: 0
          maximum: 100
        frontendCoverage:
          type: number
          format: float
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: ["PASSED", "FAILED"]

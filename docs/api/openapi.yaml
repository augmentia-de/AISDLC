openapi: "3.0.3"

info:
  title: "PromptGuard API"
  version: "1.0.0"
  description: |
    # PromptGuard — Zentrale Prompt-Verwaltung & Compliance-Prüfung

    Vollständiger API-Contract für PromptGuard, abgeleitet aus `docs/requirements/PRD.md`
    (97 Anforderungen), 35 User Stories und 108 Akzeptanzkriterien.

    **Status:** eingefrorener Vertrag für Schritt 6 (Implementierung). Abweichungen nach der
    Freigabe (Gate 1) brauchen eine neue Revision dieser Datei — keine stille Änderung im Code.

    ## Sprache

    Dokumentation und Beschreibungen sind **deutsch**, Feldnamen, `operationId`s, Enums und
    Fehlercodes sind **englisch** (camelCase). Das entspricht NFR-018.

    ## Mandantentrennung (Invariante I-2)

    * **Ein Mandant = eine Organisation.** Ein Nutzer gehört genau einer Organisation
      (`organisation_id` im Access-Token, Entscheidung F2).
    * **Jede** Lese- und Schreiboperation ist organisationsgebunden. Das ist im Vertrag an
      zwei Stellen sichtbar: je Operation über die Extension `x-tenant-scope`
      (Wert `organisation_id`) und je Ressource über das Feld `organisationId`.
    * Ressourcen einer fremden Organisation sind **nicht existent**: der Dienst antwortet mit
      `404 Not Found` und einem leeren, inhaltsfreien Problem-Body. Es gibt keine
      Existenzinformation, keinen Titel, keinen Prüfstatus, keine Anzahl, keine Vorschau
      (FR-009, FR-023, SEC-002, US-005).
    * Ausnahme, bewusst und dokumentiert: `DELETE /api/v1/users/{userId}` antwortet bei einem
      Nutzer einer fremden Organisation mit `403` (AC-029-2 nennt 403 explizit). Damit ist die
      Existenz einer User-ID schwach offengelegt. Abhilfe: User-IDs sind UUIDv4 und damit
      nicht erratbar. Siehe `.agent/artifacts/api-review.md`, Befund B-02.

    ## Rollen

    | Rolle | Rechte |
    |---|---|
    | `DEVELOPER` | Eigene Organisation: Prompts anlegen, lesen, bearbeiten, versionieren, suchen, löschen (eigene). |
    | `SECURITY_ADMIN` | Zusätzlich: geflaggte Versionen prüfen und freigeben (Waiver), Warnungen empfangen, Audit lesen, Totmannschaltung wiederholen. |
    | `ORG_ADMIN` | Zusätzlich: Mitglieder und Rollen, Einladungen, Kategorien, Organisationseinstellungen, Alarmempfänger, Recht auf Löschung. |

    Die benötigte Rolle steht je Operation in `x-required-role`.

    ## Fehlerformat

    Alle Fehlerantworten nutzen **ein** Format (RFC 9457 Problem Details, erweitert):

    ```json
    {
      "type": "https://api.promptguard.example/errors/validation-failed",
      "title": "Validation failed",
      "status": 422,
      "detail": "The field 'title' must not be empty. Allowed length: 1-200 characters.",
      "instance": "/api/v1/prompts",
      "correlationId": "01J8Z6M2QK9Y3F7V0C4T5N6P7R",
      "errors": [ { "field": "title", "code": "must_not_be_empty", "message": "..." } ]
    }
    ```

    * `detail` sagt, **was zu tun ist** — niemals nur, was schiefging.
    * `detail` enthält **niemals** Prompt-Inhalt, Secrets, personenbezogene Daten oder
      Stacktraces (FR-062, SEC-009, US-032 AC-032-3).
    * `correlationId` ist die verpflichtende Rückverfolgung zu den strukturierten Logs.
    * `errors` (Feldliste) ist nur bei `400` und `422` gefüllt.

    | Status | Wann |
    |---|---|
    | `400` | syntaktisch fehlerhafte Anfrage (z. B. `size` > 200) |
    | `401` | nicht angemeldet / Token ungültig oder abgelaufen |
    | `403` | angemeldet, aber Rolle oder Mandant erlaubt die Operation nicht |
    | `404` | Ressource existiert nicht **oder** ist für diese Organisation nicht sichtbar |
    | `409` | Konflikt mit dem aktuellen Zustand (z. B. E-Mail belegt, Kategorie referenziert) |
    | `422` | semantisch ungültig (Validierung, Pflichtfeld fehlt) |
    | `429` | Rate-Limit überschritten (Login: 10 Versuche/Min/IP mit Sperre; API: 1 000/Min/Nutzer) |
    | `500` | unerwarteter Fehler — generische Meldung, Korrelation-ID, kein internes Detail |

    ### Fehlerkatalog je Operation

    Der Vertrag dokumentiert **je Operation nur die Fehlerantworten, die diese Operation
    tatsächlich auslösen kann** — nicht pauschal alle acht Codes. Die Zuordnung ist
    regelbasiert und in `docs/api/check_contract.py` maschinell geprüft:

    | Auslöser | Codes |
    |---|---|
    | Jede authentifizierte Operation | `401` (nicht angemeldet), `429` (Rate-Limit), `500` |
    | Operation mit Request-Body **und Pflichtfeldern** | zusätzlich `422` (semantisch ungültig) |
    | Operation mit Query-Parametern | zusätzlich `400` (syntaktisch fehlerhaft, z. B. `size > 200`) |
    | Operation mit eingeschränkter Rolle | zusätzlich `403` (Rolle fehlt) |
    | Operation auf eine Ressource per Pfadparameter | zusätzlich `404` (nicht existent **oder** fremde Organisation) |
    | Schreiboperation mit Zustandskonflikt | zusätzlich `409` (z. B. E-Mail belegt, Kategorie referenziert) |

    `404` bedeutet immer: *nicht existent oder für diese Organisation nicht sichtbar* —
    niemals *existiert, aber verboten* (kein Existenz-Leak, ADR-002).

    ## Pagination, Filterung, Sortierung

    * Alle Sammlungen sind seitenweise. Default `size = 50`, Maximum `size = 200`.
    * Jede Sammlung liefert `page`, `size`, `totalElements`, `totalPages`, `hasMore` und ein
      opakes `nextCursor` (Fortsetzungs-Token für die nächste Seite). Die Navigation im
      Vertrag bleibt `page`; `nextCursor` ist die maschinenlesbare Entsprechung.
    * Ein `size` über 200 wird mit **`400`** abgewiesen (nicht `422`) und nennt das Maximum —
      so von AC-015-3 vorgegeben.
    * `totalElements` / `totalPages` beziehen sich **immer auf die gefilterte** Menge der
      eigenen Organisation, nie auf eine ungefilterte oder fremde (AC-014-3).

    ## Statusmodell

    Der Prüfstatus hängt an der **Version**, nicht am Prompt; der Prompt zeigt den Status
    seiner aktuellen Version. Siehe ADR-003.

    ```
    PENDING → SCANNING → APPROVED | FLAGGED | FAILED
    FAILED → PENDING          (manuelle oder automatische Wiederholung)
    FLAGGED → WAIVED          (nur SECURITY_ADMIN, mit Begründung und Audit-Eintrag)
    ```

    Freigegeben (nutzbar) sind ausschließlich `APPROVED` und `WAIVED` (Invariante I-3).

    ## Live-Status

    Der Transport ist **Server-Sent Events (SSE)**; ein Polling-Endpunkt steht als Fallback
    zur Verfügung. Begründung und Betriebsregeln: ADR-005 (Warteschlange) und ADR-008
    (Live-Transport). Beide Varianten sind Teil dieses Vertrags.

    ## Zeitformat

    Alle Zeitstempel sind ISO-8601 mit Offset, Format `date-time`, Zeitzone UTC.

  contact:
    name: "PromptGuard Architecture"
    url: "https://github.com/example/promptguard"
  license:
    name: "Proprietary"

servers:
  - url: "https://api.promptguard.example/api/v1"
    description: "Produktion (EU-Region europe-west3)"
  - url: "http://localhost:8080/api/v1"
    description: "Lokal (docker-compose)"

tags:
  - name: "Authentication"
    description: "Registrierung, Anmeldung, Token-Lebenszyklus (US-001, US-002, US-003)"
  - name: "Account"
    description: "Eigenes Konto, Profil, Passwort, Datenexport, Recht auf Löschung (US-029, DP-007, DP-008)"
  - name: "Organisation"
    description: "Organisationseinstellungen, Mitglieder, Einladungen, Alarmempfänger (US-004, US-006)"
  - name: "Prompts"
    description: "Prompt-CRUD, Versionierung, Historie, Suche (US-005, US-007, US-008, US-009, US-013, US-014, US-015)"
  - name: "Taxonomy"
    description: "Kategorien und Tags (US-010, US-011)"
  - name: "Scans"
    description: "Prüfläufe, Fundstellen, Freigabe (Waiver), Provider-Verifikation (US-016 … US-023)"
  - name: "Audit"
    description: "Status- und Änderungshistorie (US-025)"
  - name: "Notifications"
    description: "Warn-E-Mail, Zustellversuche, Totmannschaltung (US-026, US-027)"
  - name: "Privacy"
    description: "Datenschutzhinweis DE/EN (US-030)"
  - name: "Operations"
    description: "Health, Metriken, Aufbewahrungsläufe und Qualitätsnachweis für den Betrieb (US-028, US-031, US-032)"

security:
  - bearerAuth: []

# =====================================================================================
# PATHS
# =====================================================================================
paths:

  # ---------------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------------
  /auth/register:
    post:
      operationId: registerUser
      x-stories: [US-002]
      tags: ["Authentication"]
      summary: "Registrierung erzeugt eine neue Organisation"
      description: |
        Legt ein Konto an und erzeugt **immer eine neue Organisation**; der erste Nutzer wird
        `ORG_ADMIN` dieser Organisation. Eine Registrierung kann keiner bestehenden
        Organisation beitreten — eine im Body übergebene `organisationId` wird ignoriert
        (AC-002-3).

        **Nebenwirkungen:** Organisation + Seed-Kategorien (`Customer Support`, `Code Gen`,
        `Data Analysis`, `Documentation`, `Other`) + Nutzerkonto + Access-/Refresh-Token +
        Audit-Eintrag `REGISTERED`.

        **Idempotenz:** nicht idempotent. Wiederholung mit derselben E-Mail-Adresse liefert
        `409 Conflict` und legt **keine** zweite Organisation an (AC-002-2).

        **Mandant:** erzeugt einen neuen Mandanten; die Antwort enthält dessen `id`.
      security: []
      x-tenant-scope: "none (neue Organisation wird erzeugt)"
      x-required-role: "none"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: "alex.sommer@example.com"
              password: "ein-sehr-langes-passwort-2026"
              organisationName: "Abteilung Kundensupport"
              displayName: "Alex Sommer"
      responses:
        "201":
          description: "Konto und neue Organisation angelegt, Tokens ausgestellt."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      operationId: loginUser
      x-stories: [US-001]
      tags: ["Authentication"]
      summary: "Anmeldung mit E-Mail und Passwort"
      description: |
        Prüft die Zugangsdaten und stellt ein Token-Paar aus. Das Passwort verlässt diesen
        Ablauf nie im Klartext; gespeichert wird ausschließlich ein bcrypt/argon2id-Hash
        (Cost ≥ 12, FR-008).

        **Sicherheitsverhalten (AC-001-2):** Unbekannte E-Mail und falsches Passwort liefern
        dieselbe generische Meldung **und dieselbe Antwortzeit**. Es gibt keinen
        „Konto existiert nicht"-Unterschied.

        **Sperre (AC-001-3):** Nach 10 Fehlversuchen je Minute je IP/Adresse wird das Konto
        temporär gesperrt; `429` mit `Retry-After` in Sekunden. Die Sperre läuft automatisch ab.

        **Nebenwirkungen:** Audit-Eintrag `LOGIN_SUCCEEDED` bzw. `LOGIN_FAILED` (ohne Inhalt).
      security: []
      x-tenant-scope: "none"
      x-required-role: "none"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: "alex.sommer@example.com"
              password: "ein-sehr-langes-passwort-2026"
      responses:
        "200":
          description: "Anmeldung erfolgreich, Token-Paar ausgestellt."
          headers:
            Set-Cookie:
              description: "Refresh-Token als `HttpOnly; SameSite=Strict; Secure` (SEC-001)."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/refresh:
    post:
      operationId: refreshTokens
      x-stories: [US-003]
      tags: ["Authentication"]
      summary: "Token-Paar erneuern (Rotation)"
      description: |
        Gibt ein neues Token-Paar aus und **rotiert** den Refresh-Token: der benutzte
        Refresh-Token wird invalidiert.

        **Replay-Erkennung (AC-003-2):** Wird ein bereits rotierter Refresh-Token erneut
        verwendet, antwortet der Dienst mit `401` und invalidiert **die gesamte
        Session-Kette** — alle daraus abgeleiteten Tokens sind danach wertlos.

        **Transport (SEC-001):** Der Refresh-Token wird bevorzugt aus dem `HttpOnly`-Cookie
        gelesen. Für Nicht-Browser-Clients darf er alternativ im Body übergeben werden; der
        Body-Wert hat Vorrang, wenn beide gesetzt sind.

        **Nebenwirkungen:** Alter Refresh-Token invalidiert, neuer Token-Paar ausgestellt,
        Audit-Eintrag `TOKEN_REFRESHED`.
      security: []
      x-tenant-scope: "none (Tokens sind organisationsgebunden, aber nicht mandantenweit sichtbar)"
      x-required-role: "none"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            example:
              refreshToken: "rt_9f2c1d…"
      responses:
        "200":
          description: "Neues Token-Paar ausgestellt; der alte Refresh-Token ist invalidiert."
          headers:
            Set-Cookie:
              description: "Neuer Refresh-Token als `HttpOnly; SameSite=Strict; Secure`."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/logout:
    post:
      operationId: logout
      x-stories: [US-003]
      tags: ["Authentication"]
      summary: "Sitzung beenden"
      description: |
        Invalidiert die Session-Serienkette: der übergebene Refresh-Token und alle daraus
        abgeleiteten Access-Tokens werden ungültig (FR-007). Ein bereits ausgestelltes
        Access-Token bleibt bis zu seinem `exp` (Default 15 Minuten) gültig, weil es stateless
        ist — das ist eine bewusste, dokumentierte Abweichung (siehe
        `.agent/artifacts/api-review.md`, Befund B-04).

        **Idempotenz:** ja. Ein zweiter Logout mit demselben (bereits invalidierten) Token
        liefert ebenfalls `204`.
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "DEVELOPER, SECURITY_ADMIN, ORG_ADMIN"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: "Sitzung beendet. Kein Body."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------------
  # Account (self service)
  # ---------------------------------------------------------------------------------
  /me:
    get:
      operationId: getCurrentUser
      x-stories: [US-001, US-004]
      tags: ["Account"]
      summary: "Angemeldeten Nutzer lesen"
      description: |
        Liefert das eigene Konto inklusive Rolle und `organisationId`. Grundlage für die
        Rollenprüfung in der Oberfläche — die eigentliche Prüfung erfolgt serverseitig auf
        jeder Route (SEC-004).

        **Mandant:** liefert ausschließlich das Konto der eigenen Organisation.
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "DEVELOPER, SECURITY_ADMIN, ORG_ADMIN"
      responses:
        "200":
          description: "Das eigene Konto."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateOwnProfile
      x-stories: [US-029, US-035]
      tags: ["Account"]
      summary: "Eigenes Profil berichtigen"
      description: |
        Berichtigt personenbezogene Daten des eigenen Kontos (DP-007 „Berichtigung").
        Änderbar sind Anzeigename und E-Mail-Adresse; Rolle, Status und `organisationId`
        sind **nicht** änderbar.

        **E-Mail-Wechsel:** Die neue Adresse wird sofort übernommen; ein Bestätigungs-Workflow
        ist im MVP nicht enthalten (dokumentierte Abweichung, siehe
        `.agent/artifacts/api-review.md`, Befund B-05).

        **Nebenwirkungen:** Audit-Eintrag `PROFILE_UPDATED` (ohne Inhalt). Ein E-Mail-Wechsel
        invalidiert keine bestehende Sitzung.
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "DEVELOPER, SECURITY_ADMIN, ORG_ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
            example:
              displayName: "Alex Sommer"
              email: "a.sommer@example.com"
      responses:
        "200":
          description: "Profil berichtigt."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: eraseOwnAccount
      x-stories: [US-029]
      tags: ["Account"]
      summary: "Eigenes Konto löschen (Recht auf Löschung)"
      description: |
        Löscht das eigene Konto auf Anforderung (FR-063, DP-004): Konto, Tokens und Sitzungen
        werden gelöscht, die Autorschaft in bestehenden Versionen wird **anonymisiert**, der
        Prompt-Bestand **bleibt bestehen** und wird erneut zur Prüfung eingereiht.

        **Nebenwirkungen:** Anonymisierung der Autorschaft, Neuanstoß der Prüfung aller
        eigenen Versionen, Audit-Einträge bleiben mit Zeitpunkt und Aktion erhalten, aber ohne
        personenbezogenen Bezug (AC-029-3).

        **Idempotenz:** wiederholte Aufrufe liefern `404`, sobald das Konto gelöscht ist.
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "DEVELOPER, SECURITY_ADMIN, ORG_ADMIN"
      responses:
        "204":
          description: "Konto gelöscht, Autorschaft anonymisiert. Kein Body."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/password:
    post:
      operationId: changeOwnPassword
      x-stories: [US-001]
      tags: ["Account"]
      summary: "Eigenes Passwort ändern"
      description: |
        Ändert das Passwort des eigenen Kontos. Setzt bcrypt/argon2id mit Cost ≥ 12 neu
        (FR-008). Das neue Passwort verlässt den Dienst nie im Klartext.

        **Nebenwirkungen:** Alle anderen Sitzungen des Kontos werden invalidiert; Audit-Eintrag
        `PASSWORD_CHANGED`. Die aktuelle Sitzung bleibt bestehen.

        **Idempotenz:** nein — eine Wiederholung schlägt mit `401` fehl, weil das alte
        Passwort nach der ersten Änderung nicht mehr stimmt.
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "DEVELOPER, SECURITY_ADMIN, ORG_ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
            example:
              currentPassword: "ein-sehr-langes-passwort-2026"
              newPassword: "noch-ein-langes-passwort-2026"
      responses:
        "204":
          description: "Passwort geändert. Kein Body."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /me/export:
    get:
      operationId: exportOwnData
      x-stories: [US-029]
      tags: ["Account"]
      summary: "Eigene personenbezogene Daten exportieren"
      description: |
        Liefert die personenbezogenen Daten des eigenen Kontos in einem maschinenlesbaren
        JSON-Dokument (DP-007, DP-008): Konto, Mitgliedschaft, Rollen, Erstellungs- und
        Änderungsdaten, Zugehörigkeit zu Prompts und Versionen **ohne Prompt-Inhalt**.

        **Zweck:** Auskunftsrecht. Der Export enthält bewusst **keine** Prompt-Inhalte und
        keine Fundstellen-Ausschnitte — diese gehören nicht zu den personenbezogenen Daten
        des anfragenden Nutzers.

        **Mandant:** ausschließlich Daten des angemeldeten Kontos.
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "DEVELOPER, SECURITY_ADMIN, ORG_ADMIN"
      responses:
        "200":
          description: "Export der eigenen personenbezogenen Daten."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalDataExport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------------
  # Organisation
  # ---------------------------------------------------------------------------------
  /organisations/current:
    get:
      operationId: getCurrentOrganisation
      x-stories: [US-006]
      tags: ["Organisation"]
      summary: "Eigene Organisation lesen"
      description: |
        Liefert die eigene Organisation mit den wirksamen Prüfparametern: Schwelle für
        `FLAGGED` (Default `MEDIUM`), Duplikatschwelle (Default `0.90`), Tag-Limits und den
        Status der Provider-Verifikation.

        **Mandant:** liefert ausschließlich die Organisation des angemeldeten Nutzers.
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "DEVELOPER, SECURITY_ADMIN, ORG_ADMIN"
      responses:
        "200":
          description: "Die eigene Organisation."
          content:
            application/json:
              schema:

  # ---------------------------------------------------------------------------------
  # Prompts
  # ---------------------------------------------------------------------------------
  /prompts:
    get:
      operationId: listPrompts
      x-stories: [US-005, US-013, US-014, US-015]
      tags: ["Prompts"]
      summary: "Prompts suchen, filtern, sortieren und paginieren"
      description: |
        Volltextsuche über Titel, Beschreibung und Inhalt **innerhalb der eigenen
        Organisation** (FR-020). Mindestens-Präfix- und Substring-Treffer; gelöschte Objekte
        sind nie enthalten.

        **Filter (FR-021):** Kategorie, Tag und Prüfstatus — jeweils Mehrfachauswahl und
        kombinierbar. Fremde Kategorie-IDs liefern eine leere Liste **ohne** Hinweis auf die
        Existenz (AC-014-2).

        **Sortierung (FR-022):** `updatedAt` (Default), `createdAt`, `title`, `status` —
        auf- oder absteigend über `direction`.

        **Pagination (FR-022):** `page` ab 1, `size` Default 50, Maximum 200. `size` > 200
        liefert `400` mit Nennung des Maximums (AC-015-3). Eine Seite jenseits des
        Ergebnisbereichs liefert `200` mit leerem `items` und korrekter `totalElements`
        (AC-015-2).

        **Mandant:** Ergebnisse enthalten niemals Daten einer anderen Organisation — auch
        nicht als Anzahl, Vorschau, Fundstelle oder Existenzhinweis (FR-023, AC-005-3).
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "DEVELOPER, SECURITY_ADMIN, ORG_ADMIN"
      parameters:
        - name: "q"
          in: "query"
          description: "Volltextsuchbegriff über Titel, Beschreibung und Inhalt."
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: "Refundierungsrichtlinie"
        - name: "categoryId"
          in: "query"
          description: "Optional: Mehrfachauswahl von Kategorie-IDs (FR-021)."
          required: false
          style: "form"
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              format: uuid
        - name: "tag"
          in: "query"
          description: "Optional: Mehrfachauswahl von Tag-Namen; die Zuordnung ist case-insensitiv."
          required: false
          style: "form"
          explode: true
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 60

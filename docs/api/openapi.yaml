        Rollen- und Mitgliedänderungen, Einladungen, Prompt-Löschung, Waiver, manuelle
        Prüfwiederholung, Statuswechsel, Zustellversuche, Löschvorgänge (SEC-010, FR-041).

        **Kein Inhalt:** Audit-Einträge enthalten niemals Prompt-Inhalt, Fundstellen-Ausschnitte
        oder personenbezogene Daten; nur Actor, Zeitpunkt, Aktion, Entität und technische
        Metadaten (FR-062, AC-029-3).


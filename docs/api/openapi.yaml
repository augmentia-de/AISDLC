            enum: ["ORGANISATION", "USER", "MEMBERSHIP", "INVITATION", "PROMPT", "PROMPT_VERSION", "SCAN", "NOTIFICATION", "CATEGORY"]
        - name: "entityId"
          in: "query"
          description: "Optional: nach Entitäts-ID filtern."
          required: false
          schema:
            type: string
            format: uuid
        - name: "actorId"
          in: "query"
          description: "Optional: nach Akteur filtern."
          required: false
          schema:
            type: string
            format: uuid
        - name: "from"
          in: "query"
          description: "Optional: untere Grenze des Zeitfensters (inklusive)."
          required: false
          schema:
            type: string
            format: date-time
        - name: "to"
          in: "query"
          description: "Optional: Obergrenze des Zeitfensters (exklusive)."
          required: false

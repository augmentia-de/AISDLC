  /api/v1/deliveries:
    get:
      operationId: listDeliveries
      tags: [Zustellung]
      summary: Zustellprotokoll lesen
      description: >-
        Liest das Zustellprotokoll (FR-030). Je Eintrag werden **Zustand**,
        **Anzahl der Versuche**, **Zeitpunkt des letzten Versuchs**,
        **Antwortcode des Empfängers** und **nächster Versuchszeitpunkt**
        ausgewiesen. Bei endgültigen Zuständen (`sent`, `abandoned`, `rejected`,
        `cancelled`, `no_subscriber`) ist `next_attempt_at` **leer** — es wird kein
        Zeitpunkt in der Vergangenheit oder in der Zukunft angezeigt.

        Die Filter (Endpunkt, Status, Ereignistyp, Ereignis-ID, Zeitraum) sind
        **kombinierbar** (AC-015-4). Die Liste ist **cursor-basiert
        paginiert**. Die Suche läuft ausschließlich über Metadaten (D-11).

        **Zeitraumfilter:** `from`/`to` beziehen sich auf den **Anlegezeitpunkt**
        des Zustelllaufs (`created_at`) — **denselben** Schlüssel, nach dem die
        Liste sortiert (ADR-017 §4, V-40). Die **Totenliste** filtert dagegen
        nach dem **Aufgabezeitpunkt** (`abandoned_at`).

        Ein Ereignis ohne Abnehmer erscheint mit dem Zustand `no_subscriber` —
        nichts verschwindet still (D-04).

        **Dies ist die Suche über Metadaten (AC-007-5):** Ereignis-ID,
        Ereignistyp, Endpunkt, Status und Zeitraum sind filterbar; eine Suche
        nach Nutzlastinhalt existiert nicht (D-11, FR-012). Jedes Ereignis ist
        über seinen Zustelllauf im Protokoll auffindbar — auch ein Ereignis
        ohne Abnehmer (Status `no_subscriber`).

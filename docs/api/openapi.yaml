openapi: 3.0.3

info:
  title: EchoBox — Ereignis-Briefkasten mit Zustellgarantie
  version: 1.0.0
  description: |
    # EchoBox — Ereignis-Briefkasten mit Zustellgarantie

    EchoBox nimmt Ereignisse entgegen und liefert sie per HTTP an registrierte
    Empfänger-URLs weiter (Webhook-Zustell-Wrapper). Kein Message-Broker, kein
    Event-Store. Der Dienst hält nur, was er für die Zustellung braucht, und das
    so kurz wie möglich.

    ## Vertrag und Versionierung

    Dieser Vertrag ist die **Single Source of Truth**. Er wird **nach Schritt 4
    (Grill-Me-Stresstest) eingefroren**; bis dahin ist er ein stabiler Entwurf.
    Eine Änderung am Signaturverfahren, an Header-Namen oder am Ablehnungssignal
    (Abschnitt `x-delivery-protocol`) ist ein **breaking change** und braucht
    eine neue Hauptversion (`/api/v2`).

    ## Mandant

    Der Mandant stammt **ausschließlich aus der Identität** (JWT-Claim
    `organisation_id`) und ist **kein** Filter- oder Request-Parameter (D-01).
    Ein mitgelieferter Mandantenparameter wird mit **HTTP 422** abgelehnt.
    Fremde Ressourcen werden mit **HTTP 404** beantwortet, damit die Existenz
    fremder Objekte nicht preisgegeben wird (D-02).

    ## Rollen

    | Rolle | Rechte |
    |---|---|
    | `developer` | Ereignisse einliefern, Zustellprotokoll einsehen |
    | `receiver_admin` | Endpunkte registrieren/ändern/pausieren/reaktivieren, Secret rotieren, tote Zustellung erneut auslösen |
    | `service_admin` | Endpunkte aller Mandanten sehen, Tote-Zustellungsliste mandantenübergreifend, Kennzahlen, Aufbewahrung erzwingen |

    ## Fehlersemantik

    Alle Fehlerantworten nutzen **ein** Schema (`Problem`, RFC-7807-artig) mit
    dem maschinenlesbaren Feld `code`:

    | Status | `code` | Wann |
    |---|---|---|
    | 400 | `malformed_request` | syntaktisch fehlerhafte Anfrage (kein gültiges JSON) |
    | 401 | `unauthorized` | kein oder ungültiges Token |
    | 403 | `forbidden` | angemeldet, aber Rolle/Mandant darf es nicht |
    | 404 | `not_found` | Ressource existiert nicht **oder** ist für diesen Mandanten nicht sichtbar |
    | 409 | `idempotency_conflict` | gleicher Idempotenzschlüssel mit abweichender Nutzlast (D-05) |
    | 413 | `payload_too_large` | Nutzlast > 1.048.576 Byte (NFR-001, D-13) |
    | 422 | `validation_failed` / `tenant_parameter_rejected` | semantisch ungültig (Validierung, D-01) |
    | 429 | `rate_limit_exceeded` | API-seitiges Anfragelimit (nicht das Endpunkt-Limit aus FR-033) |
    | 500 | `internal_error` | unerwarteter Fehler — kein Stacktrace, kein internes Detail |
    | 503 | `service_unavailable` | Dienst nicht bereit (Readiness) |

    ## Pagination

    Alle Listen sind **cursor-basiert** (`limit` + `cursor`, Antwort unter
    `page.nextCursor` / `page.hasMore`). `total` wird bewusst **nicht**
    ausgewiesen: eine Zählung über die verschlüsselten, zeitlich geordneten
    Zustelltabellen wäre teuer und im Protokoll nicht nötig.

    ## Suchbarkeit

    Die Protokollsuche läuft **ausschließlich über Metadaten** (Ereignis-ID,
    Ereignistyp, Endpunkt, Status, Zeitraum). Eine Suche nach Nutzlastinhalt
    existiert **nicht** — das wäre mit der Verschlüsselung im Ruhezustand
    unvereinbar (FR-012, D-11).

  contact:
    name: Plattform-Team Interne Systeme
    email: platform-eng@example.invalid
  license:
    name: Proprietary — internes Plattformprojekt

servers:
  - url: https://echobox.example
    description: Produktion (EU-Hosting). Staging und Produktion nutzen getrennte Konfigurationen und getrennte Secrets (AC-023-5).

tags:
  - name: Endpunkte
    description: Registrierung, Pause, Reaktivierung und Secret-Rotation (FR-001…FR-004).
  - name: Ereignisse
    description: Annahme, Idempotenz und Verschlüsselung im Ruhezustand (FR-010…FR-013).
  - name: Zustellung
    description: Zustellprotokoll, tote Zustellungen, Replay, Kennzahlen (FR-024, FR-030…FR-032).
  - name: Betrieb
    description: Health, Readiness, Rate-Limit-Zählung, Aufbewahrung (FR-031, FR-033, NFR-006).

security:
  - bearerAuth: []

# =============================================================================
# Ausgehender Zustellvertrag (eingefroren)
# -----------------------------------------------------------------------------
# Dieser Abschnitt beschreibt den HTTP-Vertrag, den EchoBox gegen die
# registrierte Empfänger-URL ausübt. Er ist **kein** Teil der eingehenden
# REST-Schnittstelle, gehört aber in denselben Vertrag: Verfahren und
# Header-Name der Signatur sowie das Ablehnungssignal dürfen sich danach
# nicht mehr ändern (FR-020, D-07, D-08).
# =============================================================================
x-delivery-protocol:
  title: Ausgehender Zustellvertrag (Version 1)
  status: eingefroren
  applies_to: Jede HTTP-Zustellung an eine registrierte Endpunkt-URL.
  x-ac-id:
    - US-009/AC-009-1
    - US-009/AC-009-2
    - US-009/AC-009-3
    - US-009/AC-009-4
    - US-009/AC-009-5
    - US-010/AC-010-1
    - US-010/AC-010-2
    - US-010/AC-010-3
    - US-010/AC-010-4
    - US-014/AC-014-1
    - US-014/AC-014-2
    - US-014/AC-014-3
    - US-014/AC-014-4

  request:
    method: POST
    url: "{target_url}"
    x-ac-id:
      - US-010/AC-010-1
    headers:
      - name: Content-Type
        required: true
        value: "application/json"
        description: "Medientyp der Nutzlast. Entspricht `payload_media_type` des Ereignisses."
      - name: X-EchoBox-Event-Id
        required: true
        value: "<UUID>"
        description: >-
          **Ereignis-ID.** Stabil über alle Zustellläufe und alle Endpunkte
          hinweg. Der Empfänger nutzt sie als fachlichen Deduplizierungsschlüssel
          (FR-021, D-06).
        x-ac-id:
          - US-010/AC-010-1
          - US-010/AC-010-4
      - name: X-EchoBox-Delivery-Run-Id
        required: true
        value: "<UUID>"
        description: >-
          **Zustelllauf-ID.** Über alle Versuche eines Laufs identisch. Ein
          Replay erzeugt einen **neuen** Zustelllauf mit neuer ID (FR-024, D-06).
        x-ac-id:
          - US-010/AC-010-1
          - US-010/AC-010-2
          - US-013/AC-013-5
      - name: X-EchoBox-Attempt-Id
        required: true
        value: "<UUID>"
        description: >-
          **Versuchs-ID.** Für jeden HTTP-Versuch eindeutig. Zwei Versuche
          desselben Zustelllaufs haben unterschiedliche Versuchs-IDs, gleiche
          Ereignis-ID und gleiche Zustelllauf-ID (FR-021, D-06).
        x-ac-id:
          - US-010/AC-010-1
          - US-010/AC-010-2
      - name: X-EchoBox-Attempt-Number
        required: true
        value: "<1-basiert>"
        description: "Versuchsnummer innerhalb des Zustelllaufs. Beginnt nach einem Replay wieder bei 1 (FR-024)."
        x-ac-id:
          - US-010/AC-010-2
          - US-013/AC-013-1
      - name: X-EchoBox-Event-Type
        required: true
        value: "<Ereignistyp>"
        description: "Ereignistyp des zugestellten Ereignisses (Filter des Empfängers)."
      - name: X-EchoBox-Timestamp
        required: true
        value: "<ISO-8601 UTC, z. B. 2026-10-21T09:15:22.481Z>"
        description: >-
          Zeitpunkt der Zustellung in UTC. **Exakt dieser Wert** geht in die
          Signier-Eingabe ein. Der Empfänger darf einen Zeitstempel, der mehr
          als `signature_tolerance_seconds` (Konfiguration, Default 300) von der
          eigenen Uhr abweicht, ablehnen (Replay-Schutz).
        x-ac-id:
          - US-009/AC-009-5
      - name: X-EchoBox-Signature
        required: true
        value: "v1=<hex-lowercase-hmac-sha256>"
        description: >-
          **Signatur der Zustellung.** Verfahren und Header-Name sind
          eingefroren (FR-020, D-07).
        x-ac-id:
          - US-009/AC-009-1
          - US-009/AC-009-2
          - US-009/AC-009-3
          - US-009/AC-009-4
      - name: User-Agent
        required: true
        value: "EchoBox-Delivery/1.0"
        description: "Ermöglicht dem Empfänger, EchoBox-Zustellungen zu erkennen."
    body:
      description: >-
        **Der Request-Body sind exakt die Nutzlastbytes des Ereignisses** —
        keine Hülle, kein Envelope. Alle Metadaten stehen in den Headern. Das
        ist zwingend, weil die zugestellten Bytes byteidentisch mit den
        eingelieferten Klartextbytes sein müssen (AC-007-3) und weil die
        Signatur über genau diese Bytes berechnet wird (D-07).
      media_type: "application/json (bzw. payload_media_type des Ereignisses)"
      x-ac-id:
        - US-007/AC-007-3
        - US-008/AC-008-1
      example: '{"order_id": 4711, "state": "shipped"}'

  signature:
    algorithm: HMAC-SHA256
    header_name: X-EchoBox-Signature
    header_value_format: "v1=<hex-lowercase>"
    secret: "Das Endpunkt-Secret des Empfängers (Klartext, nie im Klartext ausgegeben)."
    signing_input: "<timestamp>.<payload_bytes>"
    signing_input_detail: >-
      ASCII-Darstellung des exakten `X-EchoBox-Timestamp`-Werts, gefolgt von
      einem einzelnen Punkt `.`, gefolgt von den **exakt gesendeten Body-Bytes**
      (UTF-8, ohne weitere Normalisierung). Bei vorverschlüsselten Ereignissen
      (FR-013) sind die gesendeten Bytes die Chiffre — der Empfänger prüft die
      Signatur über die empfangenen Bytes und entschlüsselt erst danach.
    verification: >-
      Der Empfänger berechnet `hex(HMAC-SHA256(secret, signing_input))` und
      vergleicht **zeitkonstant** mit dem Hexanteil aus `X-EchoBox-Signature`.
      Bei Abweichung gilt die Zustellung als **nicht erfolgreich zugestellt**.
    canonicalisation: "keine — die Bytes werden unverändert signiert."
    version_marker: >-
      Der Präfix `v1=` im Headerwert ist Teil der Signier-Eingabe-Konvention.
      Ein neues Verfahren erhält einen neuen Präfix und eine neue Hauptversion
      des ausgehenden Vertrags; der alte Präfix bleibt parallel unterstützt.
    x-ac-id:
      - US-009/AC-009-1
      - US-009/AC-009-2
      - US-009/AC-009-5

  response:
    description: >-
      Der Empfänger antwortet mit einem HTTP-Statuscode. Ein Antwort-Body wird
      nicht ausgewertet.
    outcomes:
      - status_range: "2xx"
        meaning: "Erfolgreich zugestellt. Es erfolgt **kein** weiterer Versuch für dieses Ereignis an diesen Endpunkt."
        x-ac-id:
          - US-010/AC-010-3
          - US-011/AC-011-4
      - status_code: 410
        meaning: >-
          **Ablehnungssignal** (dauerhaft nicht gewünscht). Der Empfänger signalisiert
          damit ausdrücklich, dass er das Ereignis **nicht** mehr möchte. Die Zustellung
          wird sofort ohne weitere Versuche aufgegeben, Status `rejected` (FR-025, D-08).
        required_headers:
          - name: X-EchoBox-Rejection
            required: false
            value: "permanent"
            description: "Kennzeichnet die Antwort als dauerhafte Ablehnung."
        body:
          description: "Das exakte Format des Ablehnungssignals (JSON)."
          media_type: "application/json"
          schema:
            $ref: "#/components/schemas/DeliveryRejection"
          example:
            rejection: permanent
            reason: event_type_not_subscribed
            message: "Dieser Endpunkt verarbeitet den Ereignistyp order.changed nicht."
            rejected_event_types:
              - order.changed
        x-ac-id:
          - US-014/AC-014-1
          - US-014/AC-014-2
      - status_range: "5xx, 408, 429"
        meaning: "Wiederholbarer Fehler. Es wird ein weiterer Versuch nach Backoff geplant."
        x-ac-id:
          - US-011/AC-011-3
          - US-014/AC-014-3
      - status_range: "übrige 4xx (außer 410)"
        meaning: >-
          Kein Wiederholen. Die Zustellung wird ohne weitere Versuche aufgegeben und
          als `rejected` protokolliert (D-08). Der Empfänger bekommt damit eine
          dauerhafte Absage, auch ohne das ausdrückliche Ablehnungssignal.
        x-ac-id:
          - US-014/AC-014-4
      - transport_error: true
        meaning: >-
          Netzwerkfehler, DNS-Fehler, Verbindungs-Timeout, Lese-Timeout. Wird wie
          ein 5xx behandelt: Wiederholung nach Backoff. Die Summe aus
          Verbindungs- und Lese-Timeout je Versuch bleibt unter 30 s (Abschnitt 11
          der Anforderung, ADR-014).
        x-ac-id:
          - US-011/AC-011-3
          - US-014/AC-014-3

  duplicate_handling:
    guarantee: at-least-once
    description: >-
      EchoBox garantiert **at-least-once**: ein Ereignis kann mehrfach beim
      Empfänger ankommen. Der Dienst garantiert **nicht** at-most-once — ein
      Timeout, bei dem der Empfänger bereits verarbeitet hat, ist vom Dienst
      nicht unterscheidbar.
    receiver_deduplication_key: >-
      **X-EchoBox-Event-Id** — fachliche Deduplizierung (dasselbe Ereignis).
      Für die Erkennung einer **Wiederholung desselben Zustelllaufs** (Timeout-
      Dublette) dienen **X-EchoBox-Delivery-Run-Id** (gleich) und
      **X-EchoBox-Attempt-Id** / **X-EchoBox-Attempt-Number** (verschieden).
    x-ac-id:
      - US-010/AC-010-1
      - US-010/AC-010-2
      - US-010/AC-010-4

  retry_policy:
    description: >-
      Wiederholung nach fehlgeschlagenem Versuch mit **wachsendem Abstand**
      (Verdopplung) und **Streuung**, damit nicht alle Endpunkte eines
      Ausfalls gleichzeitig wieder versucht werden (FR-022). Nach erschöpften
      Versuchen wird die Zustellung aufgegeben und landet in der Liste der
      toten Zustellungen (FR-023).
    configuration:
      max_attempts: "Konfigurierbar. Ohne die Festlegung aus O-06 wird kein Wert vorbelegt; Vorschlag zur Freigabe bei Gate 1: 8."
      base_delay: "Konfigurierbar. Vorschlag zur Freigabe bei Gate 1: 1 Minute."
      multiplier: "Konfigurierbar. Vorschlag zur Freigabe bei Gate 1: 2 (Verdopplung)."
      max_delay: "Konfigurierbar. Vorschlag zur Freigabe bei Gate 1: 60 Minuten."
      jitter: "Konfigurierbar. Vorschlag zur Freigabe bei Gate 1: ± 20 %."
      attempt_timeout:
        connect_timeout: "Konfigurierbar. Festlegung der Architektur (ADR-014): Default 5 s."
        read_timeout: "Konfigurierbar. Festlegung der Architektur (ADR-014): Default 10 s."
    x-ac-id:
      - US-011/AC-011-1
      - US-011/AC-011-2
      - US-011/AC-011-3
      - US-011/AC-011-5
      - US-012/AC-012-1
      - US-012/AC-012-3
      - US-012/AC-012-4

  rate_limit:
    description: >-
      Jeder Endpunkt ist gegen zu viele Zustellversuche in kurzer Zeit
      geschützt (FR-033). Der Mechanismus ist gebaut und konfigurierbar; der
      **Grenzwert ist bewusst nicht vorbelegt**, solange O-01 offen ist. Bis zur
      Festlegung erhebt der Dienst nur die Zählung der Zustellversuche je
      Endpunkt und Zeitfenster als Datenbasis (D-14).
    strategy_options:
      - name: delay
        meaning: "Der Versuch wird verschoben (nicht verworfen, nicht blockiert). Der Zustelllauf trägt den Zustand `delayed` und einen nächsten Versuchszeitpunkt."
      - name: block
        meaning: "Der Versuch wird zurückgestellt, bis das Zeitfenster wieder frei ist. Das Ereignis geht nicht verloren."
    default_strategy: "delay"
    default_limit: null
    observability: >-
      Die Zählung je Endpunkt und Zeitfenster ist über
      `GET /api/v1/endpoints/{endpointId}/metrics` im Feld `rate_limit` abrufbar.
    x-ac-id:
      - US-018/AC-018-1
      - US-018/AC-018-2
      - US-018/AC-018-3

# =============================================================================
# Pfade
# =============================================================================
paths:

  # ------------------------------------------------------------------ Endpunkte
  /api/v1/endpoints:
    post:
      operationId: createEndpoint
      tags: [Endpunkte]
      summary: Endpunkt registrieren
      description: >-
        Registriert eine Empfänger-URL mit Secret und den gewünschten
        Ereignistypen (FR-001). Der Endpunkt wird mit dem Status `aktiv`
        angelegt und dem Mandanten der Identität zugewiesen. Das Secret wird
        verschlüsselt abgelegt und **nie** im Klartext ausgegeben.
      x-ac-id:
        - US-001/AC-001-1
        - US-001/AC-001-2
        - US-001/AC-001-3
        - US-001/AC-001-4
        - US-001/AC-001-5
      x-requirement-ids: [FR-001, NFR-004]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointCreateRequest"
            example:
              target_url: https://orders.example.invalid/hooks/echobox
              secret: "s3cr3t-rotationswert"
              event_types:
                - order.changed
                - order.cancelled
      responses:
        "201":
          description: Endpunkt angelegt.
          headers:
            Location:
              description: "URL des neu angelegten Endpunkts."
              schema:
                type: string
                format: uri
                example: https://echobox.example/api/v1/endpoints/8f1c2f0e-2f4a-4a0e-9d5b-6a1c2e3f4a5b
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
              example:
                endpoint_id: 8f1c2f0e-2f4a-4a0e-9d5b-6a1c2e3f4a5b
                organisation_id: m-1
                target_url: https://orders.example.invalid/hooks/echobox
                status: active
                event_types: [order.changed, order.cancelled]
                secret_version: 1
                secret_rotated_at: null
                paused_at: null
                created_at: "2026-10-21T09:10:00.000Z"
                updated_at: "2026-10-21T09:10:00.000Z"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listEndpoints
      tags: [Endpunkte]
      summary: Endpunkte auflisten
      description: >-
        Listet die Endpunkte. Ein `receiver_admin` sieht **nur** die Endpunkte
        seines Mandanten; ein `service_admin` sieht die Endpunkte **aller**
        Mandanten, jeweils mit dem Mandantenkennzeichen `organisation_id`
        (FR-004). Mandant ohnehin aus der Identität — ein `organisation_id`-Filter
        ist nicht Teil des Vertrags (D-01).
      x-ac-id:
        - US-004/AC-004-1
        - US-004/AC-004-2
      x-requirement-ids: [FR-004]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Endpunktliste (mandantengefiltert).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointList"
              example:
                items:
                  - endpoint_id: 8f1c2f0e-2f4a-4a0e-9d5b-6a1c2e3f4a5b
                    organisation_id: m-1
                    target_url: https://orders.example.invalid/hooks/echobox
                    status: active
                    event_types: [order.changed, order.cancelled]
                    secret_version: 1
                    secret_rotated_at: null
                    paused_at: null
                    created_at: "2026-10-21T09:10:00.000Z"
                    updated_at: "2026-10-21T09:10:00.000Z"
                page:
                  limit: 50
                  has_more: false
                  next_cursor: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/endpoints/{endpointId}:
    parameters:
      - $ref: "#/components/parameters/EndpointId"
    get:
      operationId: getEndpoint
      tags: [Endpunkte]
      summary: Endpunkt lesen
      description: >-
        Liefert einen einzelnen Endpunkt. Ein Endpunkt eines fremden Mandanten
        wird mit **HTTP 404** beantwortet — die Existenz fremder Objekte wird
        nicht preisgegeben (D-02). Das Secret wird nie ausgegeben.
      x-ac-id:
        - US-004/AC-004-3
        - US-019/AC-019-1
      x-requirement-ids: [FR-001, FR-004]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Endpunkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateEndpoint
      tags: [Endpunkte]
      summary: Endpunkt aktualisieren
      description: >-
        Teilaktualisierung von Ziel-URL und Ereignistypen. Es werden **nur** die
        mitgeschickten Felder geändert. Das Secret wird **nicht** über diesen
        Weg geändert — dafür gibt es die Secret-Rotation. Die Validierung der
        Ziel-URL ist identisch zur Registrierung (https-Pflicht, keine
        eingebetteten Zugangsdaten) (FR-001).
      x-ac-id:
        - US-001/AC-001-2
        - US-001/AC-001-3
        - US-019/AC-019-2
      x-requirement-ids: [FR-001]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointUpdateRequest"
            example:
              target_url: https://orders.example.invalid/hooks/echobox-v2
              event_types:
                - order.changed
      responses:
        "200":
          description: Endpunkt aktualisiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/endpoints/{endpointId}/pause:
    parameters:
      - $ref: "#/components/parameters/EndpointId"
    post:
      operationId: pauseEndpoint
      tags: [Endpunkte]
      summary: Endpunkt pausieren
      description: >-

        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /prompt-versions/{versionId}/rescan:
    parameters:
      - $ref: "#/components/parameters/VersionIdPathParam"
    post:
      operationId: rescanPromptVersion
      x-stories: [US-022, US-033]
      tags: ["Scans"]
      summary: "Fehlgeschlagenen Prüflauf erneut auslösen"
      description: |
        Löst einen neuen Prüflauf für eine Version aus, deren Status `FAILED` ist (FR-071,
        FR-042, US-033 AC-033-3). Die Version wechselt auf `PENDING` und erhält ein neues
        Scan-Ergebnis; der alte Fehler wird im Audit protokolliert.

        **Zustandsbedingung:** Zulässig ist ausschließlich `FAILED`. Für alle anderen Status
        antwortet der Dienst mit `409 Conflict` und nennt den aktuellen Status. Grund: eine
        erneute Prüfung einer bereits freigegebenen Version würde eine bestehende Freigabe
        (Invariante I-1, I-3) auflösen, ohne dass sich der Inhalt geändert hat.

        **Nebenwirkungen:** Neuer Scan-Job in der Warteschlange, Statuswechsel
        `FAILED → PENDING`, Audit-Eintrag `SCAN_RETRY_REQUESTED` mit Actor und Zeitpunkt
        (SEC-010).

        **Idempotenz:** nein — jeder Aufruf erzeugt einen neuen Job.
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "DEVELOPER, SECURITY_ADMIN, ORG_ADMIN"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescanRequest"
            example:
              reason: "Provider war nicht erreichbar, erneuter Versuch."
      responses:
        "202":
          description: "Neuer Prüflauf eingereiht; die Version steht auf `PENDING`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /prompt-versions/{versionId}/waiver:
    parameters:
      - $ref: "#/components/parameters/VersionIdPathParam"
    post:
      operationId: createWaiver
      x-stories: [US-004, US-023]
      tags: ["Scans"]
      summary: "Geflaggte Version als Ausnahme freigeben"
      description: |
        `SECURITY_ADMIN` gibt eine geflaggte Version als Ausnahme frei; der Status wechselt
        auf `WAIVED` und die Version ist damit nutzbar (FR-039, F4, I-3, AC-023-1).

        **Pflicht:** eine Begründung. Ohne Begründung → `422`, der Status bleibt `FLAGGED`
        und es wird **kein** Audit-Eintrag geschrieben (AC-023-3).

        **Berechtigung:** Ein `DEVELOPER` erhält `403`; der Status bleibt `FLAGGED`
        (AC-023-2, AC-004-3). Beide Versuche werden im Audit protokolliert.

        **Zustandsbedingung:** Zulässig ist ausschließlich `FLAGGED`; für andere Status
        `409 Conflict`.

        **Nebenwirkungen:** Statuswechsel `FLAGGED → WAIVED`, Audit-Eintrag `WAIVER_GRANTED`
        mit Actor, Zeitpunkt und Begründung (SEC-010).

        **Idempotenz:** nein — ein zweiter Aufruf liefert `409` (Status ist nicht mehr
        `FLAGGED`).
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "SECURITY_ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaiverRequest"
            example:
              reason: "Platzhalter-Schlüssel, kein echtes Geheimnis; mit Plattformteam abgestimmt."
      responses:
        "200":
          description: "Version freigegeben, Status `WAIVED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Waiver"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /provider/verification:
    get:
      operationId: getProviderVerification
      x-stories: [US-022, US-034]
      tags: ["Scans"]
      summary: "Status der Provider-Verifikation lesen"
      description: |
        Liefert den Verifikationsstand der KI-Provider-Konfiguration (FR-038, FR-065, DP-005,
        US-022). Geprüft werden: Auftragsverarbeitungsvertrag hinterlegt, EU-Region
        (`europe-west3`), kein Training auf Eingangsdaten, keine dauerhafte Speicherung.

        Solange die Verifikation nicht positiv ausfällt, **bricht der Scan ab**, ohne dass
        Prompt-Inhalt das System verlässt. Der Status ist deshalb ein **Betriebs-Gate** des
        Prüflaufs, keine reine Anzeige.

        **Mandant:** Die Verifikation ist eine plattformweite Betriebseigenschaft. Die
        Antwort enthält **keine** organisationsbezogenen Daten.
      security:
        - bearerAuth: []
      x-tenant-scope: "none (plattformweite Betriebseigenschaft, keine Fachdaten)"
      x-required-role: "SECURITY_ADMIN, ORG_ADMIN"
      responses:
        "200":
          description: "Der Verifikationsstand."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderVerification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: verifyProviderConfiguration
      x-stories: [US-022, US-034]
      tags: ["Scans"]
      summary: "Provider-Konfiguration erneut verifizieren"
      description: |
        Löst die erneute Prüfung der Provider-Konfiguration aus (z. B. nach einer
        Konfigurationsänderung oder einem Provider-Wechsel). Das Ergebnis entscheidet, ob
        Inhalte das System verlassen dürfen.

        **Nebenwirkungen:** Neuer Verifikationslauf, Audit-Eintrag
        `PROVIDER_VERIFICATION` (Metadaten ohne Inhalt), Aktualisierung von
        `lastCheckedAt`.

        **Idempotenz:** ja — der Lauf liefert denselben Zustand, wenn sich die Konfiguration
        nicht geändert hat.
      security:
        - bearerAuth: []
      x-tenant-scope: "none (plattformweite Betriebseigenschaft, keine Fachdaten)"
      x-required-role: "SECURITY_ADMIN, ORG_ADMIN"
      responses:
        "200":
          description: "Ergebnis der erneuten Verifikation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderVerification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"


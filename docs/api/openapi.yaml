  /prompts/{promptId}/status-stream:
    parameters:
      - $ref: "#/components/parameters/PromptIdPathParam"
    get:
      operationId: streamPromptStatus
      x-stories: [US-024]
      tags: ["Prompts"]
      summary: "Prüfstatus live verfolgen (Server-Sent Events)"
      description: |
        Streamt Statusänderungen des Prompts als Server-Sent-Events (FR-040, NFR-003,
        AC-024-1). Der gewählte Transport ist in **ADR-005** begründet; der Polling-Fallback
        steht unter `GET /prompts/{promptId}/status`.

        **Ablauf:**
        1. Direkt nach dem Verbindungsaufbau sendet der Server ein `status`-Ereignis mit dem
           **aktuellen** Zustand (Snapshot) — das ist die Wiederherstellung nach einem
           Verbindungsabbruch (AC-024-3).
        2. Danach folgt bei jeder Statusänderung ein weiteres `status`-Ereignis.
        3. Jedes Ereignis trägt `sequence` (monoton steigend je Prompt) und `id`. Der Client
           verwirft Ereignisse mit `sequence <=` dem zuletzt gesehenen Wert — so wird
           niemals ein veralteter Zwischenstand geliefert (AC-024-3).

        **Autorisierung:** Der Kanal ist **nicht** anonym. Ohne gültiges Token wird die
        Verbindung mit `401` abgelehnt und es werden **keine** Statusdaten übertragen
        (AC-024-2). Da der native Browser-`EventSource` keinen `Authorization`-Header setzen
        kann, verwendet der Client `fetch()` mit Header und liest den Stream
        (`ReadableStream`).

        **Betrieb:** Der Stream wird serverseitig nach spätestens 60 Minuten beendet
        (Betriebsgrenze des Containers); der Client verbindet sich neu und erhält über den
        Snapshot-Schritt den aktuellen Stand.

        **Idempotenz:** ja — der Stream ist eine reine Leseoperation.
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "DEVELOPER, SECURITY_ADMIN, ORG_ADMIN"
      responses:
        "200":
          description: "Ereignisstrom der Statusänderungen."
          headers:
            Cache-Control:
              description: "Immer `no-cache` — der Stream ist nicht zwischenspeicherbar."
              schema:
                type: string
                example: "no-cache"
            X-Accel-Buffering:
              description: "`no` — verhindert Puffern durch einen Reverse Proxy."
              schema:
                type: string
                example: "no"
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE-Frames im Format `event`, `id`, `data`."
              example: |
                event: status
                id: 42
                data: {"promptId":"1f2e3d4c-5b6a-7988-9a0b-1c2d3e4f5a6b","status":"SCANNING","sequence":41,"occurredAt":"2026-10-20T09:14:02Z"}

                event: status
                id: 43
                data: {"promptId":"1f2e3d4c-5b6a-7988-9a0b-1c2d3e4f5a6b","status":"APPROVED","sequence":42,"occurredAt":"2026-10-20T09:14:27Z"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"


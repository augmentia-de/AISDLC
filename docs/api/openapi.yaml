    get:
      operationId: getEndpointMetrics
      tags: [Betrieb]
      summary: Erfolgsquote und Zustelllatenz je Endpunkt
      description: >-
        Liefert je Endpunkt die **Erfolgsquote** (erfolgreiche Versuche / alle
        Versuche) und die **Zustelllatenz** (p95 der Dauer von der Annahme bis
        zur erfolgreichen Antwort) im Auswertungsfenster (FR-032).

        Ist im Fenster **kein** Zustellvorgang vorhanden, wird `data_available:
        false` ausgewiesen — **nicht** 0 % und **nicht** 100 %.

        Der Abschnitt `rate_limit` liefert die Zählung der Zustellversuche je
        Endpunkt und Zeitfenster und den **wirksamen** Grenzwert. Vorgabewert
        ist **60 Versuche je Endpunkt und Minute** mit Strategie `delay`
        (bestätigt am 2026-10-21 mit F-01); der Wert ist je Endpunkt
        überschreibbar (D-14). `rate_limit.limit` ist **immer** der wirksame
        Grenzwert; `rate_limit.limited: false` bedeutet: die Begrenzung ist für
        diesen Endpunkt **abgeschaltet** (`limit: 0`). Der Abschnitt ist
        **immer** Teil der Antwort — die Zählung läuft **unabhängig** vom
        Grenzwert (AC-018-4, V-42).

        **Auswertungsfenster:** Ohne `from`/`to` gilt das Fenster der letzten
        **7 Tage** bis jetzt (ADR-011, bestätigt am 2026-10-21).

        Ein Endpunkt eines **fremden** Mandanten wird mit **HTTP 404**
        beantwortet (D-02) — **auch** für `service_admin`: die
        mandantenübergreifende Sicht gilt **nur** für Endpunktliste, Totenliste
        und Aufbewahrung (E-01, V-27).

# -----------------------------------------------------------------------------
# Jedes Akzeptanzkriterium aus docs/requirements/stories/US-0xx.json ist im
# Vertrag auffindbar: entweder als `x-ac-id` an einer Operation, als `x-ac-id`
# am ausgehenden Zustellvertrag (x-delivery-protocol) oder in dieser Liste.

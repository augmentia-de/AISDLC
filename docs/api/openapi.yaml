  # ---------------------------------------------------------------------------------
  # Scans
  # ---------------------------------------------------------------------------------
  /prompt-versions/{versionId}/scan:
    parameters:
      - $ref: "#/components/parameters/VersionIdPathParam"
    get:
      operationId: getScanResult
      x-stories: [US-016, US-017, US-021]
      tags: ["Scans"]
      summary: "Scan-Ergebnis mit Fundstellen lesen"
      description: |
        Liefert den Prüflauf der Version: Gesamturteil, angewandte Schwellen, Fundstellen und
        Duplikatwarnung (FR-036, FR-037, FR-032, AC-021-1).

        **Fundstellen (FR-037):** je Fundstelle Kategorie, Schweregrad, **maskierter**
        Ausschnitt, Position (Zeile/Spalte und Zeichenoffset), Begründung und auslösende Regel
        bzw. Modellurteil. Der rohe Prompt-Inhalt wird **nicht** über den Ausschnitt hinaus
        reproduziert.

        **Duplikatwarnung (FR-032):** bis zu 5 ähnliche Prompts **derselben Organisation** mit
        Titel, Score und Verweis. Die Warnung ist beratend.

        **Kein Fund (AC-021-3):** `findings` ist leer, `findingCount` ist 0; die angewandten
        Schwellen stehen in `threshold` und `duplicateThreshold`.

        **Mandant:** Ein Scan zu einer Version eines fremden Prompts liefert `404` und keine
        Funddaten (AC-021-2).
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "DEVELOPER, SECURITY_ADMIN, ORG_ADMIN"
      responses:
        "200":
          description: "Das Scan-Ergebnis."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /prompt-versions/{versionId}/findings:
    parameters:
      - $ref: "#/components/parameters/VersionIdPathParam"
    get:
      operationId: listFindings
      x-stories: [US-018, US-019, US-020, US-021]
      tags: ["Scans"]
      summary: "Fundstellen einer Version auflisten"
      description: |
        Liefert die Fundstellen des Prüflaufs über genau eine Version: Kategorie,
        Schweregrad, maskierter Ausschnitt, Position (Zeile/Spalte/Offset), Begründung
        und auslösende Regel bzw. Modellurteil (FR-037).

        **Filter:** `category` grenzt auf eine Erkennungskategorie ein —
        `PROMPT_INJECTION` und `JAILBREAK` (US-018), `SECRET` (US-019), `PII` (US-020).
        `severity` filtert zusätzlich nach Schweregrad. Die Filter sind kombinierbar und
        beziehen sich **immer nur** auf die eigene Organisation.

        **Maskierung:** `redactedExcerpt` ist maskiert (FR-037). Der Originalinhalt wird
        weder hier noch in Fehlern, Logs oder Metriken ausgegeben (SEC-006, FR-062).

        **Kein Rohtext:** Der Prompt-Inhalt wird nicht reproduziert; nur die maskierten
        Fundstellen-Ausschnitte (AC-021-1).

        **Mandant:** eine Version einer fremden Organisation ist nicht existent → `404`
        ohne Funddaten (AC-021-2).
      security:
        - bearerAuth: []
      x-tenant-scope: "organisation_id"
      x-required-role: "DEVELOPER, SECURITY_ADMIN, ORG_ADMIN"
      parameters:
        - name: "category"
          in: "query"
          description: "Optional: nach Erkennungskategorie filtern."
          required: false
          schema:
            $ref: "#/components/schemas/FindingCategory"
        - name: "severity"
          in: "query"
          description: "Optional: nach Schweregrad filtern."
          required: false
          schema:
            $ref: "#/components/schemas/Severity"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/SizeParam"
      responses:
        "200":
          description: "Seite der Fundstellen."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedFindings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":

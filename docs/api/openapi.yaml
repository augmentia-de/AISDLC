  # ------------------------------------------------------------------- Ereignisse
  /api/v1/events:
    post:
      operationId: submitEvent
      tags: [Ereignisse]
      summary: Ereignis einliefern
      description: >-
        Nimmt ein Ereignis an (FR-010). Die Annahme ist **asynchron**: die
        Zustellung startet erst **nach** der Antwort, der Annahme-Request wird
        nie blockiert (NFR-002, D-10).

        **Idempotenz:** Der Gültigkeitsbereich des Idempotenzschlüssels ist das
        Paar (Mandant, Schlüssel) (D-05). Eine Wiederholung mit gleicher
        Nutzlast ist **erfolgreich** (HTTP 202) und liefert die Kennung des
        **ersten** Ereignisses (`idempotent_replay: true`). Dieselbe Nutzlast wird
        **nie** überschrieben. Derselbe Schlüssel mit **abweichender** Nutzlast
        wird mit **HTTP 409** abgelehnt.

        **Größengrenze:** Die Nutzlast ist auf 1.048.576 Byte (1 MB) begrenzt
        (NFR-001). Gemessen werden die **Nutzlastbytes** — bei vorverschlüsselter
        Einlieferung also die Chiffre, nicht der Klartext (D-13). 1 Byte darüber
        → HTTP 413.

        **Verschlüsselung:** Die Nutzlast wird verschlüsselt gespeichert und nur
        für den Zustellvorgang entschlüsselt (FR-012, NFR-004).
      x-ac-id:
        - US-005/AC-005-1
        - US-005/AC-005-2
        - US-005/AC-005-3
        - US-005/AC-005-4
        - US-005/AC-005-5
        - US-005/AC-005-6
        - US-006/AC-006-1
        - US-006/AC-006-2
        - US-006/AC-006-3
        - US-006/AC-006-4
        - US-008/AC-008-1
        - US-008/AC-008-2
        - US-008/AC-008-3
      x-requirement-ids: [FR-010, FR-011, FR-012, FR-013, NFR-001, NFR-002]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventIntakeRequest"
            example:
              event_type: order.changed
              idempotency_key: order-4711-changed-2026-10-21T09:00:00Z
              payload:
                order_id: 4711
                state: shipped
              payload_encoding: plaintext
              payload_media_type: application/json
      responses:
        "202":
          description: >-
            Ereignis angenommen. Die Zustellung läuft im Hintergrund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventIntakeResponse"
              example:
                event_id: 3c9a7d21-8e4b-4a1f-9c2d-5e6f7a8b9c0d
                event_type: order.changed
                idempotency_key: order-4711-changed-2026-10-21T09:00:00Z
                status: accepted
                idempotent_replay: false
                subscribed_endpoint_count: 2
                payload_size_bytes: 34
                accepted_at: "2026-10-21T09:15:22.481Z"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

    get:
      operationId: listEvents
      tags: [Ereignisse]
      summary: Ereignisse auflisten (Metadaten)
      description: >-
        Listet die Ereignisse des Mandanten **über ihre Metadaten**. Die
        Nutzlast wird **nie** ausgegeben — sie ist im Ruhezustand verschlüsselt
        (FR-012). Eine Suche nach Nutzlastinhalt existiert nicht (D-11).
      x-ac-id:
        - US-007/AC-007-5
      x-requirement-ids: [FR-012, FR-030]
      security:
        - bearerAuth: []
      parameters:
        - name: event_type
          in: query

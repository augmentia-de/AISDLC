        Liefert den aktuellen Prüfstatus des Prompts samt monoton steigender `sequence`. Das ist
        der **Polling-Fallback** zum SSE-Kanal `GET /prompts/{promptId}/status-stream` und
        dient zugleich als Wiederherstellungs-Abfrage nach einem Verbindungsabbruch
        (AC-024-3).

        **Idempotenz:** ja — reine Leseoperation.

        **Mandant:** Status eines fremden Prompts → `404`.
      security:

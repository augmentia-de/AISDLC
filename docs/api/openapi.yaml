        Legt einen Prompt an und erzeugt automatisch **Version 1** mit Status `PENDING`
        (FR-011). Die API antwortet **unabhängig** vom Prüfergebnis — die Prüfung läuft
        asynchron über die persistente Warteschlange (FR-030, CON-009). Die Antwort enthält
        **kein** Scan-Ergebnis (AC-007-1).

        **Feldregeln (FR-010):** Titel 1–200 Zeichen (Pflicht), Beschreibung optional bis
        2 000 Zeichen, Inhalt 1–50 000 Zeichen (Pflicht), genau eine Kategorie, 0–n Tags

    post:
      operationId: replayDelivery
      tags: [Zustellung]
      summary: Tote Zustellung erneut auslösen
      description: >-
        Löst eine aufgegebene Zustellung erneut aus (FR-024). Es entsteht ein
        **neuer Zustelllauf** mit **neuer Zustelllauf-ID**, aber **derselben
        Ereignis-ID**; die Versuchsanzahl beginnt wieder bei 1. Der
        ursprüngliche Datensatz bleibt im Protokoll **unverändert** erhalten
        (Historie).

        **Berechtigung:** Bis zur Entscheidung aus O-03 ist ausschließlich der
        **Empfänger-Admin des betroffenen Endpunkts** berechtigt (D-15). Alle
        anderen Rollen erhalten HTTP 403.

        **Pause:** Ist der Endpunkt pausiert, startet **kein** Versuch; die
        Zustellung endet erneut ohne Zustellung (D-03).
      x-ac-id:

    get:
      operationId: listDeadDeliveries
      tags: [Zustellung]
      summary: Tote Zustellungen abholen
      description: >-
        Liefert die Liste der **toten Zustellungen** (FR-031) — Zustellungen,
        die nach erschöpften Versuchen aufgegeben wurden.

        **Nur `service_admin`**: Ein `receiver_admin` erhält HTTP 403. Eine leere
        Trefferliste ist ein **HTTP 200 mit leerem `items`-Array**, kein Fehler.
        Die Filter (Endpunkt, Status, Ereignistyp, Zeitraum) sind kombinierbar,
        die Liste ist seitenweise abrufbar.

        **Inhalt:** Die Totenliste enthält **ausschließlich aufgegebene
        Zustellungen** — Status `abandoned` mit gesetztem `abandoned_at`
        (GLOSSARY „Tote Zustellung“). Endgültig beendete, aber **nicht**
        aufgegebene Zustellungen stehen im Zustellprotokoll
        (`GET /api/v1/deliveries`). Der Zeitraumfilter bezieht sich auf den
        **Aufgabezeitpunkt** (`abandoned_at`) — **nicht** auf `created_at`; das
        **Zustellprotokoll** filtert nach `created_at` (V-40).

        **Mandantenübergreifende Sicht:** Die Liste zeigt die toten Zustellungen
        **aller** Mandanten. Sie wird über die schmale Eigentümerfunktion des
        Schemas hergestellt (ADR-002 §7) — **nicht** über eine Laufzeitrolle mit
        `BYPASSRLS`. `organisation_id` ist in **jedem** Datensatz gefüllt, damit
        der Client die Herkunft erkennt (AC-016-1).

        **IDs fremder Mandanten:** Die mandantenübergreifende Liste liefert auch
        Zustelllauf-IDs **fremder** Mandanten. Der **Detailabruf**
        (`GET /api/v1/deliveries/{deliveryRunId}`) einer solchen ID endet mit
        **HTTP 404** — **auch** für den `service_admin` (D-02, V-27).

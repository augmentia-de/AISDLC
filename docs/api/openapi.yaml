              example:
                previous_delivery_run_id: 7d2b1c9a-5e6f-4a0b-8c7d-1e2f3a4b5c6d
                delivery_run_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                event_id: 3c9a7d21-8e4b-4a1f-9c2d-5e6f7a8b9c0d
                status: scheduled
                attempt_count: 0
                next_attempt_at: "2026-10-21T12:30:00.000Z"
                replayed_at: "2026-10-21T12:29:58.100Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/DeliveryStateConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/endpoints/{endpointId}/metrics:
    parameters:
      - $ref: "#/components/parameters/EndpointId"
    get:
      operationId: getEndpointMetrics
      tags: [Betrieb]
      summary: Erfolgsquote und Zustelllatenz je Endpunkt
      description: >-
        Liefert je Endpunkt die **Erfolgsquote** (erfolgreiche Versuche / alle
        Versuche) und die **Zustelllatenz** (p95 der Dauer von der Annahme bis
        zur erfolgreichen Antwort) im Auswertungsfenster (FR-032).

        Ist im Fenster **kein** Zustellvorgang vorhanden, wird `data_available:
        false` ausgewiesen — **nicht** 0 % und **nicht** 100 %.

        Der Abschnitt `rate_limit` liefert die Zählung der Zustellversuche je
        Endpunkt und Zeitfenster als Datenbasis für die noch offene Festlegung
        O-01. Der Grenzwert ist `null`, solange er nicht festgelegt ist (D-14).

        Ein Endpunkt eines **fremden** Mandanten wird mit **HTTP 404**
        beantwortet (D-02).
      x-ac-id:
        - US-017/AC-017-1
        - US-017/AC-017-2
        - US-017/AC-017-3
        - US-017/AC-017-4
        - US-018/AC-018-4
      x-requirement-ids: [FR-032, FR-033]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Kennzahlen je Endpunkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointMetrics"
              example:
                endpoint_id: 8f1c2f0e-2f4a-4a0e-9d5b-6a1c2e3f4a5b
                window:
                  from: "2026-10-14T00:00:00.000Z"
                  to: "2026-10-21T00:00:00.000Z"
                data_available: true
                attempts_total: 120
                attempts_successful: 100
                success_rate: 0.8333
                delivery_latency_p95_ms: 412
                rate_limit:
                  limit: null
                  window_seconds: 60
                  strategy: delay
                  observed_attempts: 12
                  delayed_attempts: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/retention/enforcement:
    post:
      operationId: enforceRetention
      tags: [Betrieb]
      summary: Aufbewahrung durchsetzen
      description: >-
        Erzwingt die Aufbewahrung: Ereignisse, Zustellläufe, Versuche und
        Protokolleinträge, die älter als die konfigurierte Frist sind, werden
        gelöscht; jüngere bleiben erhalten (FR-031, D-12).

        Die Frist ist ein **konfigurierbarer Parameter** und wird erst mit der
        Festlegung aus O-02 belegt. Im Betrieb ohne gesetzte Frist ist dieser
        Aufruf ein **No-Op** und meldet `deleted_* = 0` — es wird **kein**
        Fristwert vorbelegt.

        **Nur `service_admin`**. Ein `receiver_admin` erhält HTTP 403.
      x-ac-id:
        - US-016/AC-016-5
      x-requirement-ids: [FR-031]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionEnforcementRequest"
            example:
              dry_run: true
      responses:
        "200":
          description: Aufbewahrung durchgesetzt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionEnforcementResponse"
              example:
                dry_run: true
                retention_days: 30
                cutoff: "2026-09-21T00:00:00.000Z"
                deleted_events: 128
                deleted_delivery_runs: 640
                deleted_attempts: 3120
                executed_at: "2026-10-21T13:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  # --------------------------------------------------------------------- Betrieb
  /health:
    get:
      operationId: getHealth
      tags: [Betrieb]
      summary: Health (Liveness)
      description: >-
        Liveness-Prüfung. Antwortet **ohne** Authentifizierung, damit Container-
        Runtime und Load-Balancer den Dienst prüfen können (AC-023-1).
      x-ac-id:
        - US-023/AC-023-1
      x-requirement-ids: [NFR-006]
      security: []
      responses:
        "200":
          description: Dienst läuft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                status: up
                service: echobox
                version: 1.0.0
                checked_at: "2026-10-21T13:05:00.000Z"
        "500":
          $ref: "#/components/responses/InternalError"

  /health/ready:
    get:
      operationId: getReadiness
      tags: [Betrieb]
      summary: Readiness
      description: >-
        Readiness-Prüfung: Datenbank erreichbar, Mandantenkontext gesetzt,
        Hintergrundprozess aktiv. Ohne Authentifizierung, damit der Container
        erst nach erfolgreicher Bereitschaft Traffic annimmt.
      x-ac-id:
        - US-023/AC-023-1
      x-requirement-ids: [NFR-006]
      security: []
      responses:
        "200":
          description: Dienst ist bereit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
              example:
                status: ready
                checks:
                  database: ok
                  delivery_worker: ok
                  tenant_context: ok
                checked_at: "2026-10-21T13:05:00.000Z"
        "503":
          description: Dienst ist nicht bereit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
              example:
                status: not_ready
                checks:
                  database: ok
                  delivery_worker: unavailable
                  tenant_context: ok
                checked_at: "2026-10-21T13:05:00.000Z"
        "500":
          $ref: "#/components/responses/InternalError"

# =============================================================================
# Komponenten
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT mit dem Claim `organisation_id` (Mandant) und den Rollen
        `developer`, `receiver_admin`, `service_admin`. Der Mandant stammt
        ausschließlich aus dem Token (D-01).

  parameters:
    EndpointId:
      name: endpointId
      in: path
      required: true
      description: "Endpunkt-ID (UUID)."
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      description: "Ereignis-ID (UUID)."
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: "Maximale Zahl der Einträge je Seite."
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaqer Fortsetzungs-Cursor aus `page.next_cursor` der vorigen Seite.
        Ein ungültiger Cursor wird mit HTTP 422 abgelehnt.
      schema:
        type: string
        maxLength: 512
    From:
      name: from
      in: query
      required: false
      description: "Beginn des Zeitraums (UTC, RFC 3339), inklusive."
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: "Ende des Zeitraums (UTC, RFC 3339), exklusive."
      schema:
        type: string
        format: date-time
    StatusFilter:
      name: status
      in: query
      required: false
      description: "Filter auf den Endpunktstatus."
      schema:
        type: array
        items:
          $ref: "#/components/schemas/EndpointStatus"
      style: form
      explode: false
      example: active

  headers:
    RetryAfter:
      description: "Wartezeit in Sekunden bis zum nächsten erlaubten Versuch."
      schema:
        type: integer
        minimum: 1

  responses:
    MalformedRequest:
      description: "Syntaxfehler in der Anfrage (z. B. ungültiges JSON)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/malformed-request
            title: Malformed request
            status: 400
            code: malformed_request
            detail: "Der Request-Body ist kein gültiges JSON."
            instance: /api/v1/events
    Unauthorized:
      description: "Kein oder ungültiges Token."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/unauthorized
            title: Unauthorized
            status: 401
            code: unauthorized
            detail: "Das Bearer-Token fehlt oder ist ungültig."
            instance: /api/v1/endpoints
    Forbidden:
      description: "Angemeldet, aber die Rolle oder der Mandant darf die Operation nicht ausführen."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/forbidden
            title: Forbidden
            status: 403
            code: forbidden
            detail: "Diese Rolle darf die Operation für diesen Mandanten nicht ausführen."
            instance: /api/v1/dead-deliveries
    NotFound:
      description: "Die Ressource existiert nicht oder ist für diesen Mandanten nicht sichtbar (D-02)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/not-found
            title: Not found
            status: 404
            code: not_found
            detail: "Die Ressource wurde nicht gefunden."
            instance: /api/v1/endpoints/8f1c2f0e-2f4a-4a0e-9d5b-6a1c2e3f4a5b
    IdempotencyConflict:
      description: >-
        Der Idempotenzschlüssel existiert im Mandanten bereits, aber mit
        **abweichender** Nutzlast (D-05).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/idempotency-conflict
            title: Idempotency conflict
            status: 409
            code: idempotency_conflict
            detail: "Der Idempotenzschlüssel wurde bereits mit einer abweichenden Nutzlast verwendet."
            instance: /api/v1/events
    DeliveryStateConflict:
      description: "Der Zustelllauf ist in einem Zustand, in dem die Operation nicht zulässig ist (z. B. Replay einer nicht aufgegebenen Zustellung)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/delivery-state-conflict
            title: Delivery state conflict
            status: 409
            code: delivery_state_conflict
            detail: "Nur aufgegebene Zustellungen können erneut ausgelöst werden."
            instance: /api/v1/deliveries/7d2b1c9a-5e6f-4a0b-8c7d-1e2f3a4b5c6d/replay
    PayloadTooLarge:
      description: "Die Nutzlast überschreitet 1.048.576 Byte (NFR-001, D-13)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/payload-too-large
            title: Payload too large
            status: 413
            code: payload_too_large
            detail: "Die Nutzlast beträgt 1048577 Byte; erlaubt sind höchstens 1048576 Byte."
            instance: /api/v1/events
    ValidationFailed:
      description: >-
        Semantisch ungültige Anfrage. Das schließt einen mitgelieferten
        **Mandantenparameter** ein — er wird mit HTTP 422 abgelehnt, weil der
        Mandant ausschließlich aus der Identität stammt (D-01).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/validation-failed
            title: Validation failed
            status: 422
            code: validation_failed
            detail: "Die Anfrage ist semantisch ungültig."
            instance: /api/v1/endpoints
            violations:
              - field: target_url
                code: scheme_not_allowed
                message: "Die Ziel-URL muss das Schema https verwenden."
    RateLimitExceeded:
      description: "Das Anfragelimit der API ist überschritten (nicht das Endpunkt-Limit aus FR-033)."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/rate-limit-exceeded
            title: Too many requests
            status: 429
            code: rate_limit_exceeded
            detail: "Zu viele Anfragen. Bitte später erneut versuchen."
            instance: /api/v1/events
    InternalError:
      description: "Unerwarteter Fehler. Es werden keine internen Details preisgegeben."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/internal-error
            title: Internal server error
            status: 500
            code: internal_error
            detail: "Die Anfrage konnte nicht verarbeitet werden."
            instance: /api/v1/events
    ServiceUnavailable:
      description: "Der Dienst ist vorübergehend nicht bereit."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://echobox.example/errors/service-unavailable
            title: Service unavailable
            status: 503
            code: service_unavailable
            detail: "Der Dienst ist derzeit nicht bereit."
            instance: /api/v1/events

  schemas:

    # ------------------------------------------------------------- Fehlerformat
    Problem:
      type: object
      description: >-
        Einheitliches Fehlerschema für **alle** Fehlerantworten
        (RFC-7807-artig). Das Feld `code` ist der maschinenlesbare
        Schlüssel; `type` ist die stabile, dokumentierte Fehlerklasse.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: "Stabile URI der Fehlerklasse."
          example: https://echobox.example/errors/validation-failed
        title:
          type: string
          description: "Kurze, nichttechnische Überschrift."
          example: Validation failed
        status:
          type: integer
          description: "HTTP-Statuscode, identisch mit dem Response-Status."
          example: 422
        code:
          type: string
          description: "Maschinenlesbarer Fehlercode."
          enum:
            - malformed_request
            - unauthorized
            - forbidden
            - not_found
            - idempotency_conflict
            - delivery_state_conflict
            - payload_too_large
            - validation_failed
            - tenant_parameter_rejected
            - rate_limit_exceeded
            - internal_error
            - service_unavailable
        detail:
          type: string
          nullable: true
          description: "Was zu tun ist — nicht nur, was schiefging."
          example: "Die Ziel-URL muss das Schema https verwenden."
        instance:
          type: string
          nullable: true
          description: "Pfad der Anfrage."
          example: /api/v1/endpoints
        violations:
          type: array
          nullable: true
          description: "Feldbezogene Verstoesse (nur bei `validation_failed`)."
          items:
            $ref: "#/components/schemas/ValidationViolation"

    ValidationViolation:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: "JSON-Pointer auf das betroffene Feld."
          example: target_url
        code:
          type: string
          description: "Maschinenlesbarer Verstoßcode."
          example: scheme_not_allowed
        message:
          type: string
          description: "Verständliche Meldung für den Aufrufer."
          example: "Die Ziel-URL muss das Schema https verwenden."

    # ------------------------------------------------------------------- Aufzählungen
    EndpointStatus:
      type: string
      description: "Zustand eines Endpunkts."
      enum: [active, paused]

    EventStatus:
      type: string
      description: >-
        Zustand eines Ereignisses. `no_subscriber` bedeutet: angenommen und
        gespeichert, aber **kein** Endpunkt hat den Ereignistyp abonniert — der
        Zustand ist sichtbar, damit nichts still verschwindet (D-04).
      enum: [accepted, no_subscriber]

    DeliveryStatus:
      type: string
      description: >-
        Zustand eines Zustelllaufs. `sent` = erfolgreich zugestellt,
        `abandoned` = nach erschöpften Versuchen aufgegeben (tote Zustellung),
        `rejected` = vom Empfänger endgültig abgelehnt, `cancelled` = durch
        Pause abgebrochen, `delayed` = durch das Endpunkt-Limit verschoben,
        `no_subscriber` = Ereignis ohne Abnehmer.
      enum:
        - pending
        - scheduled
        - delayed
        - sent
        - failed
        - abandoned
        - rejected
        - cancelled
        - no_subscriber

    AttemptOutcome:
      type: string
      description: "Ergebnis eines einzelnen HTTP-Versuchs."
      enum:
        - success
        - retryable_failure
        - permanent_rejection
        - client_error
        - network_error
        - timeout
        - cancelled

    RejectionReason:
      type: string
      nullable: true
      description: "Grund der endgültigen Ablehnung."
      enum:
        - permanent_rejection
        - client_error
        - null

    # ------------------------------------------------------------------- Endpunkt
    EndpointCreateRequest:
      type: object
      additionalProperties: false
      required: [target_url, secret, event_types]
      properties:
        target_url:
          type: string
          format: uri
          maxLength: 2000
          description: >-
            Ziel-URL des Empfängers. **Muss** das Schema `https` tragen. Eingebettete
            Zugangsdaten (`https://user:pass@host/`) sind **verboten** — Zugangsdaten
            laufen ausschließlich über das Secret.
          example: https://orders.example.invalid/hooks/echobox
        secret:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
          description: >-
            Gemeinsames Secret des Endpunkts. Wird verschlüsselt abgelegt und
            **nie** im Klartext ausgegeben (AC-001-4). Mindestlänge 16 Zeichen.
          example: s3cr3t-rotationswert
        event_types:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: "Die Ereignistypen, die der Endpunkt abonniert."
          items:
            type: string
            minLength: 1
            maxLength: 200
          example: [order.changed, order.cancelled]
      x-validation-rules:
        - id: target_url_https_only
          description: "Nur `https` ist erlaubt (AC-001-2). Verstoß → HTTP 422."
        - id: target_url_no_credentials
          description: "Keine eingebetteten Zugangsdaten (AC-001-3). Verstoß → HTTP 422."
        - id: no_tenant_parameter
          description: "Ein `organisation_id` (oder jeder andere Mandantenparameter) im Body wird mit HTTP 422 abgelehnt (AC-001-5, D-01)."

    EndpointUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        target_url:
          type: string
          format: uri
          maxLength: 2000
          description: "Neue Ziel-URL. Gleiche Validierung wie bei der Registrierung."
        event_types:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: "Neue Liste der abonnierten Ereignistypen."
          items:
            type: string
            minLength: 1
            maxLength: 200
      x-validation-rules:
        - id: no_tenant_parameter
          description: "Ein Mandantenparameter wird mit HTTP 422 abgelehnt (D-01)."

    Endpoint:
      type: object
      description: >-
        Ein registrierter Empfänger. Das Secret wird **nie** ausgegeben;
        `secret_version` und `secret_rotated_at` zeigen nur den Zustand der
        Rotation (AC-001-4).
      required:
        - endpoint_id
        - target_url
        - status
        - event_types
        - secret_version
        - created_at
        - updated_at
      properties:
        endpoint_id:
          type: string
          format: uuid
        organisation_id:
          type: string
          nullable: true
          description: >-
            Mandant des Endpunkts. **Nur** für `service_admin` gefüllt; für
            andere Rollen ist das Feld `null`, weil der Mandant bereits aus der
            Identität bekannt ist.
        target_url:
          type: string
          format: uri
        status:
          $ref: "#/components/schemas/EndpointStatus"
        event_types:
          type: array
          items:
            type: string
        secret_version:
          type: integer
          format: int32
          minimum: 1
          description: "Nummer der Secret-Generation (Startwert 1)."
        secret_rotated_at:
          type: string
          format: date-time
          nullable: true
        paused_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EndpointList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Endpoint"
        page:
          $ref: "#/components/schemas/Page"

    SecretRotationRequest:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
          description: "Das neue Secret. Ab dem nächsten Zustellversuch gilt ausschließlich dieses Secret."
          example: neues-s3cr3t

    SecretRotationResponse:
      type: object
      required: [endpoint_id, secret_version, rotated_at, rotated_by]
      properties:
        endpoint_id:
          type: string
          format: uuid
        secret_version:
          type: integer
          format: int32
          minimum: 2
        rotated_at:
          type: string
          format: date-time
        rotated_by:
          type: string
          description: "Identität der auslösenden Rolle (Audit)."

    # ------------------------------------------------------------------- Ereignis
    EventIntakeRequest:
      type: object
      additionalProperties: false
      required: [event_type, idempotency_key]
      description: >-
        Einlieferung eines Ereignisses. **Genau eine** der Eigenschaften
        `payload` und `payload_base64` muss gesetzt sein.

        `payload` nimmt einen beliebigen JSON-Wert entgegen; der Dienst
        materialisiert ihn **kanonisch** (RFC 8785, UTF-8, sortierte
        Schlüssel, ohne bedeutungslose Leerzeichen) und stellt **genau diese
        Bytes** zu. `payload_base64` erlaubt eine bytegenaue Übernahme.

        Bei `payload_encoding = pre_encrypted` ist `payload_base64` **Pflicht**
        und `payload` **verboten** — eine als verschlüsselt gekennzeichnete
        Einlieferung mit erkennbarer Klartextnutzlast wird mit HTTP 422
        abgelehnt (AC-008-2).
      properties:
        event_type:
          type: string
          minLength: 1
          maxLength: 200
          description: "Ereignistyp. Bestimmt, welche Endpunkte zustellen."
          example: order.changed
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Idempotenzschlüssel. Gültigkeitsbereich ist das Paar (Mandant,
            Schlüssel) (D-05).
          example: order-4711-changed-2026-10-21T09:00:00Z
        payload:
          description: >-
            Nutzlast als JSON-Wert. Nicht gleichzeitig mit `payload_base64`
            setzen.
          example:
            order_id: 4711
            state: shipped
        payload_base64:
          type: string
          contentEncoding: base64
          description: >-
            Nutzlast als Base64 — für bytegenaue Übernahme, insbesondere bei
            vorverschlüsselten Ereignissen. Nicht gleichzeitig mit `payload`
            setzen.
          example: T1AtU0VDUkVULVBBWUxPQURfQkFTRTY0
        payload_encoding:
          type: string
          enum: [plaintext, pre_encrypted]
          default: plaintext
          description: >-
            `plaintext` = der Dienst verschlüsselt die Nutzlast selbst
            (FR-012). `pre_encrypted` = die Bytes sind bereits verschlüsselt
            und werden **unverändert** gespeichert und zugestellt; vor der
            Zustellung findet **kein** Entschlüsseln statt (FR-013).
        payload_media_type:
          type: string
          default: application/json
          maxLength: 100
          description: "Medientyp der Nutzlast. Wird als `Content-Type` der Zustellung gesetzt."
      x-validation-rules:
        - id: exactly_one_payload
          description: "Genau eine von `payload` / `payload_base64` muss vorhanden sein. Verstoß → HTTP 422."
        - id: pre_encrypted_requires_base64
          description: "`payload_encoding = pre_encrypted` erfordert `payload_base64` und verbietet `payload`. Verstoß → HTTP 422 (AC-008-2)."
        - id: payload_size_limit
          description: "Die Nutzlastbytes dürfen höchstens 1048576 Byte betragen. Verstoß → HTTP 413 (AC-005-2, AC-005-3, NFR-001)."
        - id: no_tenant_parameter
          description: "Ein Mandantenparameter wird mit HTTP 422 abgelehnt (D-01)."

    EventIntakeResponse:
      type: object
      required: [event_id, event_type, idempotency_key, status, idempotent_replay, accepted_at]
      properties:
        event_id:
          type: string
          format: uuid
          description: "Kennung des Ereignisses. Bei einer idempotenten Wiederholung die Kennung des **ersten** Ereignisses (AC-006-1)."
        event_type:
          type: string
        idempotency_key:
          type: string
        status:
          $ref: "#/components/schemas/EventStatus"
        idempotent_replay:
          type: boolean
          description: >-
            `true`, wenn die Einlieferung eine Wiederholung unter demselben
            Idempotenzschlüssel war. Die erste Nutzlast bleibt unverändert
            (AC-006-2).
        subscribed_endpoint_count:
          type: integer
          minimum: 0
          description: "Zahl der Endpunkte, die den Ereignistyp abonniert haben. 0 ⇒ Status `no_subscriber` (D-04)."
        payload_size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: "Größe der eingelieferten Nutzlastbytes."
        accepted_at:
          type: string
          format: date-time

    Event:
      type: object
      description: >-
        Metadaten eines Ereignisses. Die **Nutzlast wird nie ausgegeben** —
        sie ist im Ruhezustand verschlüsselt (FR-012).
      required: [event_id, event_type, idempotency_key, status, payload_encoding, payload_size_bytes, accepted_at, created_at, updated_at]
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        idempotency_key:
          type: string
        status:
          $ref: "#/components/schemas/EventStatus"
        payload_encoding:
          type: string
          enum: [plaintext, pre_encrypted]
        payload_media_type:
          type: string
          nullable: true
        payload_size_bytes:
          type: integer
          format: int64
          minimum: 0
        subscribed_endpoint_count:
          type: integer
          minimum: 0
        accepted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: "Gesetzt, wenn das Ereignis durch die Aufbewahrung gelöscht wurde."

    EventList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        page:
          $ref: "#/components/schemas/Page"

    # ------------------------------------------------------------------ Zustellung
    DeliveryRun:
      type: object
      description: >-
        Ein Zustelllauf: das Zustellprotokoll **eines** Ereignisses an
        **einem** Endpunkt. Die Versuche selbst stehen in
        `DeliveryRunDetail.attempts`.
      required:
        - delivery_run_id
        - event_id
        - event_type
        - status
        - attempt_count
        - created_at
        - updated_at
      properties:
        delivery_run_id:
          type: string
          format: uuid
          description: "Zustelllauf-ID. Ein Replay erzeugt eine **neue** ID (D-06)."
        event_id:
          type: string
          format: uuid
        endpoint_id:
          type: string
          format: uuid
          nullable: true
          description: "`null` bei `no_subscriber` — es gibt keinen Endpunkt."
        organisation_id:
          type: string
          nullable: true
          description: "Nur für `service_admin` gefüllt."
        event_type:
          type: string
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        attempt_count:
          type: integer
          format: int32
          minimum: 0
          description: "Anzahl der bereits ausgeführten Versuche (FR-030)."
        max_attempts:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: "Konfigurierte Versuchsgrenze. `null`, solange O-06 offen ist."
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: "Zeitpunkt des letzten Versuchs (FR-030)."
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Nächster Versuchszeitpunkt. **Leer** bei endgültigen Zuständen
            (`sent`, `abandoned`, `rejected`, `cancelled`) — es wird kein
            Zeitpunkt in der Vergangenheit oder in der Zukunft angezeigt
            (AC-015-2).
        last_response_status:
          type: integer
          nullable: true
          description: "HTTP-Statuscode der Antwort des Empfängers im letzten Versuch (FR-030)."
        last_error_code:
          type: string
          nullable: true
          description: "Fehlercode des letzten Versuchs, z. B. `connection_refused`, `read_timeout`."
        rejection_reason:
          $ref: "#/components/schemas/RejectionReason"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeliveryAttempt:
      type: object
      required: [attempt_id, delivery_run_id, attempt_number, started_at, outcome]
      properties:
        attempt_id:
          type: string
          format: uuid
          description: "Versuchs-ID — für jeden HTTP-Versuch eindeutig (D-06)."
        delivery_run_id:
          type: string
          format: uuid
        attempt_number:
          type: integer
          format: int32
          minimum: 1
          description: "Versuchsnummer innerhalb des Zustelllaufs (1-basiert)."
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        response_status:
          type: integer
          nullable: true
          description: "HTTP-Statuscode der Antwort des Empfängers, `null` bei Transportfehlern."
        outcome:
          $ref: "#/components/schemas/AttemptOutcome"
        error_code:
          type: string
          nullable: true
          description: "Fehlercode bei Transportfehlern, z. B. `connection_refused`, `read_timeout`, `dns_error`."
        next_attempt_at:
          type: string
          format: date-time
          nullable: true

    DeliveryRejection:
      type: object
      description: >-
        Das exakte Format des **Ablehnungssignals**, mit dem der Empfaenger
        signalisiert, dass er das Ereignis dauerhaft nicht moechte (FR-025).
        Der Dienst beendet die Zustellung daraufhin sofort ohne weitere
        Versuche (D-08).
      required: [rejection, reason]
      properties:
        rejection:
          type: string
          enum: [permanent]
          description: "Kennzeichnet die Ablehnung als dauerhaft."
          example: permanent
        reason:
          type: string
          maxLength: 100
          description: "Maschinenlesbarer Ablehnungsgrund."
          example: event_type_not_subscribed
        message:
          type: string
          nullable: true
          maxLength: 500
          description: "Optionaler Klartext fuer das Protokoll."
        rejected_event_types:
          type: array
          nullable: true
          description: "Ereignistypen, die der Empfaenger abgelehnt hat."
          items:
            type: string

    DeliveryRunDetail:
      allOf:
        - $ref: "#/components/schemas/DeliveryRun"
        - type: object
          required: [attempts]
          properties:
            attempts:
              type: array
              description: "Alle Versuche dieses Zustelllaufs, chronologisch."
              items:
                $ref: "#/components/schemas/DeliveryAttempt"

    DeliveryList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryRun"
        page:
          $ref: "#/components/schemas/Page"

    DeadDelivery:
      type: object
      description: "Eine tote Zustellung — aufgegeben nach erschöpften Versuchen (FR-031)."
      required:
        - delivery_run_id
        - event_id
        - endpoint_id
        - event_type
        - status
        - attempt_count
        - abandoned_at
      properties:
        delivery_run_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        organisation_id:
          type: string
          nullable: true
          description: "Mandant des Endpunkts — für `service_admin` gefüllt (AC-016-1)."
        endpoint_id:
          type: string
          format: uuid
        endpoint_url:
          type: string
          format: uri
          nullable: true
        event_type:
          type: string
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        attempt_count:
          type: integer
          format: int32
          minimum: 0
        last_response_status:
          type: integer
          nullable: true
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        abandoned_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    DeadDeliveryList:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeadDelivery"
        page:
          $ref: "#/components/schemas/Page"

    ReplayRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
          description: "Freitextbegründung für das Audit-Protokoll."

    ReplayResponse:
      type: object
      required: [previous_delivery_run_id, delivery_run_id, event_id, status, attempt_count]
      properties:
        previous_delivery_run_id:
          type: string
          format: uuid
          description: "Der aufgegebene Zustelllauf — bleibt im Protokoll unverändert erhalten (AC-013-2)."
        delivery_run_id:
          type: string
          format: uuid
          description: "Der **neue** Zustelllauf mit neuer ID und derselben Ereignis-ID (AC-013-5)."
        event_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        attempt_count:
          type: integer
          format: int32
          description: "Beginnt wieder bei 0; der erste Versuch hat die Nummer 1 (AC-013-1)."
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
        replayed_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------- Kennzahlen
    EndpointMetrics:
      type: object
      required: [endpoint_id, window, data_available]
      properties:
        endpoint_id:
          type: string
          format: uuid
        window:
          $ref: "#/components/schemas/MetricsWindow"
        data_available:
          type: boolean
          description: >-
            `false`, wenn im Fenster **kein** Zustellvorgang vorhanden ist. Dann
            sind `success_rate` und `delivery_latency_p95_ms` `null` — **nicht**
            0 % und **nicht** 100 % (AC-017-3).
        attempts_total:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        attempts_successful:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        success_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
          description: "Erfolgreiche Versuche / alle Versuche im Fenster (FR-032)."
        delivery_latency_p95_ms:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: "p95 der Dauer von der Annahme bis zur erfolgreichen Antwort (FR-032)."
        rate_limit:
          $ref: "#/components/schemas/RateLimitObservation"

    MetricsWindow:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time

    RateLimitObservation:
      type: object
      description: >-
        Zählung der Zustellversuche je Endpunkt und Zeitfenster als Datenbasis
        für die noch offene Festlegung O-01 (D-14).
      required: [limit, window_seconds, strategy, observed_attempts, delayed_attempts]
      properties:
        limit:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            Der Grenzwert. **Bleibt `null`, solange O-01 offen ist** — es wird kein
            Wert vorbelegt (AC-018-4).
        window_seconds:
          type: integer
          minimum: 1
          description: "Länge des Zählfensters in Sekunden."
        strategy:
          type: string
          enum: [delay, block]
          description: "Angewandte Strategie bei Überschreitung."
        observed_attempts:
          type: integer
          format: int64
          minimum: 0
        delayed_attempts:
          type: integer
          format: int64
          minimum: 0
          description: "Zahl der durch das Limit verschobenen Versuche (AC-018-2)."

    # ----------------------------------------------------------------- Aufbewahrung
    RetentionEnforcementRequest:
      type: object
      additionalProperties: false
      properties:
        dry_run:
          type: boolean
          default: true
          description: >-
            `true` = nur zählen, nichts löschen. `false` = tatsächlich löschen.
            Standard ist `true`, damit ein versehentlicher Aufruf keine Daten
            verliert.

    RetentionEnforcementResponse:
      type: object
      required: [dry_run, retention_days, executed_at]
      properties:
        dry_run:
          type: boolean
        retention_days:
          type: integer
          format: int32
          nullable: true
          description: "Die angewandte Frist in Tagen. `null`, solange keine Frist konfiguriert ist (O-02)."
        cutoff:
          type: string
          format: date-time
          nullable: true
          description: "Stichtag: Datensätze **vor** diesem Zeitpunkt werden gelöscht."
        deleted_events:
          type: integer
          format: int64
          minimum: 0
        deleted_delivery_runs:
          type: integer
          format: int64
          minimum: 0
        deleted_attempts:
          type: integer
          format: int64
          minimum: 0
        executed_at:
          type: string
          format: date-time

    # ------------------------------------------------------------------ Betrieb
    HealthStatus:
      type: object
      required: [status, service, version, checked_at]
      properties:
        status:
          type: string
          enum: [up]
        service:
          type: string
          example: echobox
        version:
          type: string
          example: 1.0.0
        checked_at:
          type: string
          format: date-time

    ReadinessStatus:
      type: object
      required: [status, checks, checked_at]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database, delivery_worker, tenant_context]
          properties:
            database:
              type: string
              enum: [ok, unavailable]
            delivery_worker:
              type: string
              enum: [ok, unavailable]
            tenant_context:
              type: string
              enum: [ok, unavailable]
        checked_at:
          type: string
          format: date-time

    # --------------------------------------------------------------------- Seite
    Page:
      type: object
      description: "Cursor-basierte Seitennavigation."
      required: [limit, has_more]
      properties:
        limit:
          type: integer
          minimum: 1
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
          description: "Cursor für die nächste Seite; `null` bei der letzten Seite."

# =============================================================================

# =============================================================================
# EchoBox — Baseline des SCA-Scans (S-32)
#
# Grundlage: der SCA-Schritt der Pipeline (.github/workflows/deploy.yml) darf
# **nur neue** Advisories scheitern lassen. Ohne Baseline schlug der Scan auf
# **jedem** Lauf an — der Gate war vorhanden, aber nicht kalibriert: er
# unterschied nicht zwischen "neu" und "seit langem bekannt".
#
# Diese Datei ist die **Baseline**: sie listet die zum Zeitpunkt der Erzeugung
# **bekannten** Advisories mit Begruendung und Ablaufdatum. Der Scan meldet
# damit nur noch Advisories, die **nicht** in dieser Datei stehen.
#
# Erzeugt aus dem aktuellen Stand:
#   * Java:  `mvn -B dependency:tree` (110 Koordinaten) -> OSV `querybatch`
#   * NPM:   `package-lock.json` (522 Pakete)          -> OSV `querybatch`
# Stand: 2026-10-22 — 17 Java- und 9 npm-Advisories, alle mit Begruendung
# (Sicherheits-Audit, Anhang A).
#
# **Pflege (verbindlich):**
#   * Wer eine Abhaengigkeit aktualisiert, entfernt die betroffenen Eintraege
#     in demselben Schritt — eine behobene Advisory gehoert nicht mehr in die
#     Baseline.
#   * Jeder Eintrag traegt eine **Begruendung** (warum ist das in dieser
#     Konfiguration nicht erreichbar?) und ein **Ablaufdatum**
#     (`ignoreUntil`, hoechstens sechs Monate in der Zukunft).
#   * Ist das Ablaufdatum ueberschritten, meldet der Scan das Advisory
#     wieder — es muss dann behoben oder neu begruendet werden. Die Datei
#     veraltet also von selbst.
#   * Die Baseline wird zu Beginn jeder Sicherheits-Audit-Runde neu erzeugt
#     (Owner: `aisdlc-qa`); die Freigabe der Baseline erfolgt mit GATE 2
#     (Owner: menschlicher Reviewer).
# =============================================================================

# --- Java (Maven) ------------------------------------------------------------
# Die Erreichbarkeit ist je Advisory im Sicherheits-Audit (Anhang A.2 bis A.4)

openapi: "3.0.3"
info:
  title: "AI SDLC Project API"
  version: "1.0.0"
  description: >
    REST API for the AI SDLC project. All endpoints require JWT authentication
    and are scoped to the authenticated user's organisation.
    Update this spec in Phase 2 (Architecture) before implementing any code.

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  # Add your endpoints here following the openapi.yaml contract.
  # Example:
  # /projects:
  #   get:
  #     summary: List projects
  #     parameters:
  #       - name: page
  #         in: query
  #         schema: { type: integer, default: 1 }
  #     responses:
  #       "200":
  #         description: Project list
  #         content:
  #           application/json:
  #             schema:
  #               $ref: "#/components/schemas/ProjectList"

components:
  schemas:
    # Add your schemas here.
    # Example:
    # Project:
    #   type: object
    #   properties:
    #     id: { type: string, format: uuid }
    #     title: { type: string, maxLength: 200 }
    #     description: { type: string, maxLength: 5000 }
    #     status: { type: string, enum: [submitted, processing, completed, failed] }
    #     created_at: { type: string, format: date-time }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []


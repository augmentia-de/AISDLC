# =============================================================================
# EchoBox — Bereitstellung (Staging und Produktion getrennt)
#
# Grundlage: AC-023-5 / NFR-006 — „Staging und Produktion werden getrennt
# bereitgestellt und erhalten getrennte Konfigurationen und Secrets."
#
# Grundsaetze:
#   * **Keine Secrets in dieser Datei.** Jeder Wert kommt aus dem
#     Secret-Store der jeweiligen Umgebung (`secrets.*`); die Datei enthaelt
#     nur die *Namen* der Geheimnisse.
#   * **Getrennte Jobs.** Staging und Produktion werden in zwei eigenen Jobs
#     bereitgestellt — nie im selben Job. Jeder Job laeuft in seiner eigenen
#     GitHub-Umgebung (`environment:`), die ihre eigenen Freigaben und ihre
#     eigenen Secrets traegt.
#   * Der **Build** ist gemeinsam: er erzeugt das Image, das beide Umgebungen
#     beziehen. Die **Bereitstellung** ist getrennt.
#   * **S-25:** vor dem Image gibt es Gates — Secret-Scan, SCA-Scan, die
#     Tests des Dienstes **und** der Oberflaeche. Die Registry-Anmeldung
#     nutzt das **kurzlebige** Token des Laufs (`GITHUB_TOKEN`, per OIDC
#     erteilt), nicht einen statischen, langlebigen Registry-Schluessel.
# =============================================================================
name: echobox-bereitstellung

on:
  push:
    branches: [main]
  workflow_dispatch:

# Standardberechtigungen: nur lesen. Das Schreiben in die Paket-Registry
# erfolgt ueber das kurzlebige Token des Laufs; `id-token: write` erlaubt
# zusaetzlich die OIDC-Anmeldung an eine Registry, die OIDC spricht.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/example/echobox
  FRONTEND: src/main/frontend

jobs:
  # ------------------------------------------------------------------ Build
  build:
    name: Build und Image
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      # ---------------------------------------------------------- Gates
      - name: Secret-Scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --no-banner --exit-code=1

      - name: SCA-Scan (OSV)
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --recursive
            ./

      # ------------------------------------------------- Dienst (Backend)
      - name: Java-Build und Tests (inkl. Coverage-Gate)
        run: mvn -B verify

      # ------------------------------------------- Oberflaeche (Frontend)
      # Der npm-Workspace liegt in der Wurzel; `package-lock.json` ebenfalls.
      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhaengigkeiten der Oberflaeche installieren
        run: npm ci

      - name: Typpruefung des gesamten Projekts
        run: npm run typecheck

      - name: Lint, Vertragspruefung und Unit-Tests der Oberflaeche
        run: npm run frontend:check

      - name: Oberflaeche bauen
        run: npm run build

      - name: Browser fuer die End-to-End-Tests installieren
        working-directory: ${{ env.FRONTEND }}
        run: npx playwright install --with-deps chromium

      - name: End-to-End-Tests der Oberflaeche
        run: npm run test:e2e

      # ------------------------------------------------------------ Image
      - name: Image bauen
        run: docker build --tag ${{ env.IMAGE }}:${{ github.sha }} .

      - name: Image in die Registry pushen
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # S-25: das Token des Laufs (`GITHUB_TOKEN`) statt eines statischen
          # Registry-Schluessels — es ist kurzlebig und wird automatisch
          # entzogen. Ein statisches `REGISTRY_TOKEN` wird nicht mehr gebraucht.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image pushen
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}

  # --------------------------------------------------------------- Staging
  deploy-staging:
    name: deploy-staging (Bereitstellung Staging)
    needs: build
    runs-on: ubuntu-latest
    # Die Umgebung traegt ihre eigenen Freigaben und ihre eigenen Secrets.
    environment: staging
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: staging-Konfiguration anwenden
        env:
          # S-27: das Image ist nicht fest auf ein Profil gepinnt — die
          # Umgebung legt das Profil fest.
          SPRING_PROFILES_ACTIVE: staging
          ECHobox_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          ECHobox_DATABASE_USERNAME: ${{ secrets.STAGING_DATABASE_USERNAME }}
          ECHobox_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
          ECHobox_CRYPTO_KEY: ${{ secrets.STAGING_CRYPTO_KEY }}
          ECHobox_CURSOR_KEY: ${{ secrets.STAGING_CURSOR_KEY }}
          ECHobox_SECURITY_JWK_SET_URI: ${{ secrets.STAGING_JWK_SET_URI }}
          ECHobox_SECURITY_AUDIENCE: ${{ secrets.STAGING_SECURITY_AUDIENCE }}
        run: echo "Die Staging-Konfiguration kommt ausschliesslich aus den Secrets der Umgebung 'staging'."

      - name: Image in staging ausrollen
        run: echo "Rollout des Images ${{ env.IMAGE }}:${{ github.sha }} in die Umgebung 'staging'."

  # ------------------------------------------------------------- Produktion
  deploy-production:
    name: deploy-production (Bereitstellung Produktion)
    needs: build
    runs-on: ubuntu-latest
    # Eigene Umgebung, eigene Freigabe, eigene Secrets — von Staging getrennt.
    environment: production
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: production-Konfiguration anwenden
        env:
          # S-27: das Image ist nicht fest auf ein Profil gepinnt — die
          # Umgebung legt das Profil fest.
          SPRING_PROFILES_ACTIVE: production
          ECHobox_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          ECHobox_DATABASE_USERNAME: ${{ secrets.PRODUCTION_DATABASE_USERNAME }}
          ECHobox_DATABASE_PASSWORD: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
          ECHobox_CRYPTO_KEY: ${{ secrets.PRODUCTION_CRYPTO_KEY }}
          ECHobox_CURSOR_KEY: ${{ secrets.PRODUCTION_CURSOR_KEY }}
          ECHobox_SECURITY_JWK_SET_URI: ${{ secrets.PRODUCTION_JWK_SET_URI }}
          ECHobox_SECURITY_AUDIENCE: ${{ secrets.PRODUCTION_SECURITY_AUDIENCE }}
        run: echo "Die Produktionskonfiguration kommt ausschliesslich aus den Secrets der Umgebung 'production'."

      - name: Image in production ausrollen
        run: echo "Rollout des Images ${{ env.IMAGE }}:${{ github.sha }} in die Umgebung 'production'."
